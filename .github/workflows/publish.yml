# حدث للكل: يبني البرنامج على ويندوز وينشره، وكل اللي عندهم اللعبة يتحدثون لحالهم أول ما يفتحونها.
# يتشغل بس لما محمد يضغط Run workflow بنفسه.
name: حدث للكل
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: تأكد إن هالنسخة ما انتشرت قبل
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "النسخة: $V"
          if D=$(gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$D" != "true" ]; then
              echo "::error::النسخة v$V منشورة من قبل. ما فيه شي جديد تنشره."
              exit 1
            fi
            # نسخة مخفية باقية من محاولة فاشلة: نشيلها ونبدأ من جديد
            gh release delete "v$V" --repo "$GITHUB_REPOSITORY" --yes
          fi
      - run: npm ci
      # النشر يصير على 3 خطوات عشان الملفات كلها تنرفع قبل ما اللاعبين يشوفون النسخة:
      # 1) نسوي النسخة مخفية (draft)، 2) نرفع الملفات فيها، 3) نخليها ظاهرة للكل.
      # (قبل كانت electron-builder تسوي النسخة مرتين بنفس الوقت ويطلع خطأ 422.)
      - name: سو النسخة مخفية
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          gh release create "v$V" --repo "$GITHUB_REPOSITORY" --draft --title "v$V" --target "$GITHUB_SHA" --notes "Mohammed Game $V"
      - name: ابن البرنامج وارفع الملفات
        shell: bash
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_DRAFT: "true"
      - name: انشر النسخة للكل
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          FILES=$(gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          echo "$FILES"
          for f in Mohammed-Game-Setup.exe Mohammed-Game-Setup.exe.blockmap latest.yml; do
            echo "$FILES" | grep -qx "$f" || { echo "::error::الملف $f ما انرفع، النسخة باقية مخفية."; exit 1; }
          done
          gh release edit "v$V" --repo "$GITHUB_REPOSITORY" --draft=false --latest
