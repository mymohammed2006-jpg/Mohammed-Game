function obbHit(px,py,pr,cx,cy,hw,hh,a){const dx=px-cx,dy=py-cy,c=Math.cos(a),s=Math.sin(a);const lx=dx*c+dy*s,ly=-dx*s+dy*c;return Math.abs(lx)<hw+pr&&Math.abs(ly)<hh+pr;}
function circle(x,y,r){g.beginPath();g.arc(x,y,Math.max(0,r),0,TAU);g.fill();}

function Bullet(x,y,vx,vy,r=10){return{x,y,vx,vy,r,
  update(t,dt){this.x+=this.vx*dt;this.y+=this.vy*dt;if(this.x<-80||this.x>W+80||this.y<-80||this.y>H+80)this.dead=true;},
  draw(){g.fillStyle='rgba(255,42,109,0.22)';circle(this.x,this.y,this.r*1.7*(1+0.2*pulse));g.fillStyle=PINK;circle(this.x,this.y,this.r*(1+0.15*pulse));},
  hit(p){const dx=p.x-this.x,dy=p.y-this.y,rr=this.r+p.r-2;return dx*dx+dy*dy<rr*rr;}};}

function Laser(o){return{
  update(t){if(t>o.te+0.25)this.dead=true;},
  draw(t){g.save();g.translate(o.x,o.y);g.rotate(o.ang);
    if(t<o.ta){const k=clamp((t-o.tw)/(o.ta-o.tw),0,1);g.fillStyle=`rgba(255,42,109,${0.07+0.2*k})`;g.fillRect(-o.len/2,-o.w/2,o.len,o.w);
      if(o.tile){g.strokeStyle='rgba(255,42,109,0.85)';g.lineWidth=3;g.strokeRect(-o.len/2+6,-o.w/2+6,o.len-12,o.w-12);}
      else{g.fillStyle='rgba(255,42,109,0.85)';g.fillRect(-o.len/2,-1.5,o.len,3);}}
    else if(t<o.te){const k=Math.min(1,(t-o.ta)/0.06),fl=Math.max(0,1-(t-o.ta)/0.15);const ww=(o.tile?o.w:o.w*(0.5+0.5*k)*(1+0.12*pulse));const ll=o.tile?o.len*(0.85+0.15*k):o.len;g.shadowColor=PINK;g.shadowBlur=24;g.fillStyle=PINK;g.fillRect(-ll/2,-ww/2,ll,ww);if(fl>0){g.globalAlpha=fl;g.fillStyle='#fff';g.fillRect(-ll/2,-ww/2,ll,ww);}}
    else{const k=1-(t-o.te)/0.25;g.globalAlpha=Math.max(0,k);g.fillStyle=PINK;const ww=o.w*Math.max(0,k);g.fillRect(-o.len/2,-ww/2,o.len,ww);}
    g.restore();},
  hit(p,t){return t>=o.ta&&t<o.te&&obbHit(p.x,p.y,p.r,o.x,o.y,o.len/2,o.w/2,o.ang);}};}

function Bomb(x,y,tw,th,n,sp){return{ex:false,
  update(t){if(!this.ex&&t>=th){this.ex=true;const off=rnd()*TAU;for(let i=0;i<n;i++){const a=off+i*TAU/n;hazards.push(Bullet(x,y,Math.cos(a)*sp,Math.sin(a)*sp,9));}burst(x,y,PINK,14);shake=Math.max(shake,5);}if(t>th+0.25)this.dead=true;},
  draw(t){if(t<th){const k=clamp((t-tw)/(th-tw),0,1);g.strokeStyle=PINK;g.lineWidth=3;g.globalAlpha=0.7;g.beginPath();g.arc(x,y,42,0,TAU);g.stroke();g.globalAlpha=0.3;g.fillStyle=PINK;circle(x,y,42*k);g.globalAlpha=1;circle(x,y,6+4*pulse);}
    else{const k=(t-th)/0.25;g.globalAlpha=Math.max(0,1-k);g.fillStyle=k<0.3?'#fff':PINK;circle(x,y,46+40*k);g.globalAlpha=1;}},
  hit(p,t){return t>=th&&t<th+0.12&&Math.hypot(p.x-x,p.y-y)<44+p.r;}};}

function Spinner(o){
  const ang=t=>t<o.tsw?(t-o.ts)*o.w1:(o.tsw-o.ts)*o.w1+(t-o.tsw)*o.w2;
  const live=t=>t>=o.ts+2*SPB&&t<o.te;
  return{
  update(t){if(t>o.te+SPB)this.dead=true;},
  draw(t){const gr=t<o.ts+2*SPB?clamp((t-o.ts)/(2*SPB),0,1):t>o.te?clamp(1-(t-o.te)/SPB,0,1):1;const act=live(t);
    g.save();g.translate(o.x,o.y);g.rotate(ang(t));g.fillStyle=PINK;g.globalAlpha=act?1:0.35;if(act){g.shadowColor=PINK;g.shadowBlur=16;}
    const ww=o.w*(act?1+0.2*pulse:1);
    for(let i=0;i<o.arms;i++){g.save();g.rotate(i*TAU/o.arms);g.fillRect(0,-ww/2,o.L*gr,ww);g.restore();}
    circle(0,0,26*(1+0.15*pulse)*Math.max(gr,0.3));g.restore();},
  hit(p,t){if(!live(t))return false;if(Math.hypot(p.x-o.x,p.y-o.y)<26+p.r)return true;const a=ang(t);
    for(let i=0;i<o.arms;i++){const aa=a+i*TAU/o.arms;if(obbHit(p.x,p.y,p.r,o.x+Math.cos(aa)*o.L/2,o.y+Math.sin(aa)*o.L/2,o.L/2,o.w/2,aa))return true;}return false;}};}

function Ring(x,y,t0,sp,th,gap,gs,warn){return{
  update(t){if((t-t0)*sp>1600)this.dead=true;},
  draw(t){g.strokeStyle=PINK;
    if(t<t0){const k=clamp(1-(t0-t)/warn,0,1);g.globalAlpha=0.6;g.lineWidth=4;g.beginPath();g.arc(x,y,20+50*k,gap+gs/2,gap-gs/2+TAU);g.stroke();g.globalAlpha=1;return;}
    const r=(t-t0)*sp;g.lineWidth=th*(1+0.15*pulse);g.shadowColor=PINK;g.shadowBlur=14;g.beginPath();g.arc(x,y,r,gap+gs/2,gap-gs/2+TAU);g.stroke();g.shadowBlur=0;},
  hit(p,t){if(t<t0)return false;const r=(t-t0)*sp,dx=p.x-x,dy=p.y-y,d=Math.hypot(dx,dy);if(Math.abs(d-r)>th/2+p.r-2)return false;let da=Math.atan2(dy,dx)-gap;da=Math.atan2(Math.sin(da),Math.cos(da));return Math.abs(da)>gs/2-p.r/Math.max(d,1);}};}

function poly(n,r){g.beginPath();for(let i=0;i<n;i++){const a=i*TAU/n-Math.PI/2;i?g.lineTo(Math.cos(a)*r,Math.sin(a)*r):g.moveTo(Math.cos(a)*r,Math.sin(a)*r);}g.closePath();g.fill();}
// الزعيم: ينزل مع رجعة الباص، يشحن قبل الانفجار الثاني، وينفجر لما تنقطع الموسيقى
function Boss(cx,cy,ts,te){
  let lastB=-1,ex=false;
  const pos=t=>{const k=clamp((t-ts)/(2*SPB),0,1),e=1-Math.pow(1-k,3);return{x:cx,y:-160+(cy+160)*e};};
  const ring=(n,base,sp,r=9)=>{for(let i=0;i<n;i++){const a=base+i*TAU/n;hazards.push(Bullet(cx+Math.cos(a)*60,cy+Math.sin(a)*60,Math.cos(a)*sp,Math.sin(a)*sp,r));}};
  const charging=t=>t>=B(258)&&t<B(262);
  return{
  update(t){
    if(t>=te&&!ex){ex=true;ring(28,0,210,10);burst(cx,cy,PINK,70,520);burst(cx,cy,'#fff',35,420);shake=26;flash=0.7;rumble(500,1,1);this.dead=true;return;}
    if(t<ts+2*SPB)return;
    const beat=Math.floor(BT(t)+1e-6);if(beat===lastB)return;lastB=beat;
    if(beat<258)ring(6,beat*0.45,185);
    else if(beat<262){}
    else if(beat===262){ring(16,0,230,10);flash=Math.max(flash,0.35);shake=Math.max(shake,14);rumble(300,0.9,0.7);}
    else if(beat===263){}
    else if(beat%2===0)ring(8,beat*0.37,205);
    else if(player){const a0=Math.atan2(player.y-cy,player.x-cx);for(let k=-1;k<=1;k++){const a=a0+k*0.25;hazards.push(Bullet(cx+Math.cos(a)*60,cy+Math.sin(a)*60,Math.cos(a)*265,Math.sin(a)*265,11));}}
  },
  draw(t){const P=pos(t),ch=charging(t);let s=1+0.12*pulse;let jx=0,jy=0;
    if(ch){const k=(t-B(258))/(B(262)-B(258));s=1+0.25*k;jx=(Math.random()*2-1)*6*k;jy=(Math.random()*2-1)*6*k;}
    g.save();g.translate(P.x+jx,P.y+jy);
    g.shadowColor=PINK;g.shadowBlur=ch?50:34;g.fillStyle=PINK;g.save();g.rotate(t*(ch?3:0.8));poly(6,70*s);g.restore();
    g.shadowBlur=0;g.fillStyle=ARENA;g.save();g.rotate(-t*1.6);poly(3,36*s);g.restore();
    g.fillStyle=ch?'#fff':PINK;circle(0,0,9+5*pulse);
    g.globalAlpha=0.5;g.strokeStyle=PINK;g.lineWidth=2;g.save();g.rotate(-t*0.5);for(let i=0;i<4;i++){g.rotate(TAU/4);g.strokeRect(92,-7,14,14);}g.restore();
    g.restore();},
  hit(p,t){if(t<ts+2*SPB)return false;const P=pos(t);return Math.hypot(p.x-P.x,p.y-P.y)<58+p.r;}};}

/* ================= المرحلة =================

   القسم الأول: الضربات ٠–٩٩ | القسم الثاني: ١٠٠–١٩٥ | القسم الثالث: ١٩٦–النهاية */
function buildLevel1(){
  const E=[],R=mulberry32(2026),ev=(b,f)=>E.push({b,f}),EW=easy?ezV('ezwn',EZ_WN):1,ES=easy?ezV('ezsp',EZ_SP):1;
  const rx=(a=120,b=W-120)=>a+R()*(b-a),ry=(a=100,b=H-100)=>a+R()*(b-a);
  const L=(hit,warn,dur,o)=>{warn*=EW;ev(hit-warn,()=>hazards.push(Laser(Object.assign({len:3200},o,{tw:B(hit-warn),ta:B(hit),te:B(hit+dur)}))));};
  const hL=(hit,y,w,dur=1,warn=1.5)=>L(hit,warn,dur,{x:W/2,y,ang:0,w});
  const vL=(hit,x,w,dur=1,warn=1.5)=>L(hit,warn,dur,{x,y:H/2,ang:Math.PI/2,w});
  const tile=(hit,c,r,dur=0.5,warn=1.5)=>L(hit,warn,dur,{x:c*320+160,y:r*240+120,ang:0,w:240,len:320,tile:true});
  const bomb=(hit,x,y,n=6,sp=200,warn=2)=>{warn*=EW;sp*=ES;ev(hit-warn,()=>hazards.push(Bomb(x,y,B(hit-warn),B(hit),n,sp)));};
  const shot=(b,x,y,vx,vy,r=10)=>ev(b,()=>hazards.push(Bullet(x,y,vx*ES,vy*ES,r)));
  const ring=(hit,x,y,sp,gs=1.5,warn=1.5)=>{warn*=EW;sp*=ES;const gap=R()*TAU;ev(hit-warn,()=>hazards.push(Ring(x,y,B(hit),sp,16,gap,gs,warn*SPB)));};
  const C=[[0,0],[W,0],[W,H],[0,H]];
  const aimed=(b,ci,sp=270)=>ev(b,()=>{if(!player)return;sp*=ES;const [x,y]=C[ci%4];const a=Math.atan2(player.y-y,player.x-x);hazards.push(Bullet(x,y,Math.cos(a)*sp,Math.sin(a)*sp,11));});
  let lastTile=-1;const rtile=()=>{let k;do{k=Math.floor(R()*12);}while(k===lastTile);lastTile=k;return[k%4,Math.floor(k/4)];};

  /* ---------- القسم الأول (أسهل بشوي) ---------- */
  // ٠:٠٠ المقدمة الهادية
  bomb(8,rx(400),ry(),5,160);bomb(12,rx(400),ry(),5,160);
  for(let b=16;b<32;b+=4)bomb(b,rx(380),ry(),5,170);
  for(let b=18;b<32;b+=2)shot(b,W+20,ry(50,H-50),-240,0);
  // ٠:١٥ يدخل الباص
  for(let b=32;b<64;b+=2)shot(b,W+20,ry(50,H-50),-(260+R()*40),0);

}

/* ================= أشكال المرحلة الثانية (المعبد) ================= */
function SqBullet(x,y,vx,vy,s=11){const b=Bullet(x,y,vx,vy,s);b.rot=rnd()*TAU;
  b.draw=function(){this.rot+=0.08;g.save();g.translate(this.x,this.y);g.rotate(this.rot);const a=this.r*1.6*(1+0.2*pulse),c=this.r*(1+0.15*pulse);g.fillStyle='rgba(255,42,109,0.22)';g.fillRect(-a,-a,2*a,2*a);g.fillStyle=PINK;g.fillRect(-c,-c,2*c,2*c);g.restore();};return b;}
function Stone(x,y,s,tw,th,stay,frag,fsp){return{
  update(t){if(!this.l&&t>=th){this.l=true;shake=Math.max(shake,6);burst(x,y,PINK,10,250);}
    if(t>=th+stay){if(frag){for(let i=0;i<4;i++){const a=Math.PI/4+i*Math.PI/2;hazards.push(SqBullet(x,y,Math.cos(a)*fsp,Math.sin(a)*fsp,9));}}this.dead=true;}},
  draw(t){if(t<th){const k=clamp((t-tw)/(th-tw),0,1),a=s*(1.7-0.7*k);g.fillStyle=`rgba(255,42,109,${0.07+0.17*k})`;g.fillRect(x-a/2,y-a/2,a,a);g.strokeStyle='rgba(255,42,109,0.85)';g.lineWidth=2;g.strokeRect(x-s/2,y-s/2,s,s);}
    else{const k=clamp((t-th)/0.08,0,1);g.save();g.shadowColor=PINK;g.shadowBlur=22;g.fillStyle=k<1?'#fff':PINK;g.fillRect(x-s/2,y-s/2,s,s);g.restore();
      g.strokeStyle='#000';g.lineWidth=3;g.beginPath();g.moveTo(x-s*0.3,y-s*0.2);g.lineTo(x,y+s*0.05);g.lineTo(x+s*0.25,y-s*0.3);g.moveTo(x,y+s*0.05);g.lineTo(x+s*0.05,y+s*0.35);g.stroke();}},
  hit(p,t){return t>=th&&t<th+stay&&Math.abs(p.x-x)<s/2+p.r&&Math.abs(p.y-y)<s/2+p.r;}};}
function Sweep(px,py,a0,a1,w,tw,ta,te){const len=1700,ang=t=>a0+(a1-a0)*clamp((t-ta)/(te-ta),0,1);return{
  update(t){if(t>te+0.2)this.dead=true;},
  draw(t){g.save();g.translate(px,py);
    if(t<ta){const k=clamp((t-tw)/(ta-tw),0,1);g.fillStyle=`rgba(255,42,109,${0.04+0.08*k})`;g.beginPath();g.moveTo(0,0);g.arc(0,0,len,Math.min(a0,a1),Math.max(a0,a1));g.closePath();g.fill();
      g.save();g.rotate(a0);g.fillStyle='rgba(255,42,109,0.9)';g.fillRect(0,-1.5,len,3);g.restore();}
    else if(t<te){g.save();g.rotate(ang(t));g.shadowColor=PINK;g.shadowBlur=20;g.fillStyle=PINK;const ww=w*(1+0.12*pulse);g.fillRect(0,-ww/2,len,ww);g.restore();}
    else{const k=Math.max(0,1-(t-te)/0.2);g.save();g.globalAlpha=k;g.rotate(a1);g.fillStyle=PINK;g.fillRect(0,-w*k/2,len,w*k);g.restore();}
    g.fillStyle=PINK;circle(0,0,14+4*pulse);g.restore();},
  hit(p,t){if(t<ta||t>=te)return false;const a=ang(t);return obbHit(p.x,p.y,p.r,px+Math.cos(a)*len/2,py+Math.sin(a)*len/2,len/2,w/2,a);}};}
function GapWall(dir,gc,gh,th,sp,tw,ta){
  const vert=dir==='L'||dir==='R',sg=(dir==='L'||dir==='U')?-1:1,ext=vert?W:H;
  const st=sg<0?ext+th/2:-th/2,pos=t=>st+sg*sp*(t-ta);
  return{
  update(t){const p=pos(t);if(t>ta&&(p<-th||p>ext+th))this.dead=true;},
  draw(t){const a=gc-gh/2,b=gc+gh/2;
    if(t<ta){const k=clamp((t-tw)/(ta-tw),0,1),e=16;g.fillStyle=`rgba(255,42,109,${0.2+0.4*k})`;
      if(vert){const x=sg<0?W-e:0;g.fillRect(x,0,e,a);g.fillRect(x,b,e,H-b);}else{const y=sg<0?H-e:0;g.fillRect(0,y,a,e);g.fillRect(b,y,W-b,e);}return;}
    const p=pos(t);g.save();g.shadowColor=PINK;g.shadowBlur=18;g.fillStyle=PINK;
    if(vert){g.fillRect(p-th/2,0,th,a);g.fillRect(p-th/2,b,th,H-b);}else{g.fillRect(0,p-th/2,a,th);g.fillRect(b,p-th/2,W-b,th);}g.restore();},
  hit(pl,t){if(t<ta)return false;const p=pos(t),a=gc-gh/2,b=gc+gh/2;
    if(vert){if(Math.abs(pl.x-p)>th/2+pl.r)return false;return pl.y<a+pl.r||pl.y>b-pl.r;}
    if(Math.abs(pl.y-p)>th/2+pl.r)return false;return pl.x<a+pl.r||pl.x>b-pl.r;}};}
function Snake(path,t0,t1,n,lag,r,tw){const u=t=>(t-t0)/(t1-t0);const sz=i=>r*(i===0?1.3:1-i/(n*1.6));return{
  update(t){if(u(t)-n*lag>1.02)this.dead=true;},
  draw(t){if(t<t0){const k=clamp((t-tw)/(t0-tw),0,1);g.fillStyle=`rgba(255,42,109,${0.1+0.3*k})`;for(let i=0;i<=44;i++){const q=path(i/44);circle(q.x,q.y,3);}return;}
    const uh=u(t);for(let i=n-1;i>=0;i--){const v=uh-i*lag;if(v<0||v>1)continue;const q=path(v),s=sz(i)*(1+0.12*pulse);g.save();g.translate(q.x,q.y);g.rotate(v*14);g.fillStyle=PINK;if(i===0){g.shadowColor=PINK;g.shadowBlur=18;}g.fillRect(-s,-s,2*s,2*s);g.restore();}},
  hit(p,t){if(t<t0)return false;const uh=u(t);for(let i=0;i<n;i++){const v=uh-i*lag;if(v<0||v>1)continue;const q=path(v),s=sz(i);if(Math.abs(p.x-q.x)<s+p.r-1&&Math.abs(p.y-q.y)<s+p.r-1)return true;}return false;}};}
function Spikes(side,depth,tw,ta,te){
  const hz=side==='T'||side==='B',n=hz?16:9,step=(hz?W:H)/n;
  const ext=t=>t<te?clamp((t-ta)/0.06,0,1):clamp(1-(t-te)/0.2,0,1);
  return{
  update(t){if(t>te+0.2)this.dead=true;},
  draw(t){g.save();if(side==='B'){g.translate(0,H);g.scale(1,-1);}if(side==='R'){g.translate(W,0);g.scale(-1,1);}
    const d=t<ta?depth:depth*ext(t);
    if(t<ta){const k=clamp((t-tw)/(ta-tw),0,1);g.fillStyle=`rgba(255,42,109,${0.08+0.2*k})`;}else{g.fillStyle=PINK;g.shadowColor=PINK;g.shadowBlur=14;}
    g.beginPath();for(let i=0;i<n;i++){const a=i*step,m=a+step/2,b=a+step;if(hz){g.moveTo(a,0);g.lineTo(m,d);g.lineTo(b,0);}else{g.moveTo(0,a);g.lineTo(d,m);g.lineTo(0,b);}}g.fill();
    if(hz)g.fillRect(0,0,W,6);else g.fillRect(0,0,6,H);g.restore();},
  hit(p,t){if(t<ta||t>=te)return false;const d=depth*0.75;if(side==='T')return p.y-p.r<d;if(side==='B')return p.y+p.r>H-d;if(side==='L')return p.x-p.r<d;return p.x+p.r>W-d;}};}

// حارس المعبد: يتنقّل في الساحة، يطلق مربعات، يرمي أحجار، ويلف أشعة
function Guardian(ts,te){
  const AN=[[W/2,H/2],[W*0.27,H*0.3],[W*0.73,H*0.3],[W*0.73,H*0.7],[W*0.27,H*0.7]];
  let lastS=-1,ex=false,from=[W/2,-200],to=[W/2,H/2],mt0=ts,mt1=ts+2*SPB,ai=0,x=W/2,y=-200,eye=0;
  const sq=(n,base,sp,s=11)=>{for(let i=0;i<n;i++){const a=base+i*TAU/n;hazards.push(SqBullet(x+Math.cos(a)*70,y+Math.sin(a)*70,Math.cos(a)*sp,Math.sin(a)*sp,s));}};
  const aim=(sp,spread=0,cnt=1)=>{if(!player)return;const a0=Math.atan2(player.y-y,player.x-x);for(let k=0;k<cnt;k++){const a=a0+(k-(cnt-1)/2)*spread;hazards.push(SqBullet(x+Math.cos(a)*70,y+Math.sin(a)*70,Math.cos(a)*sp,Math.sin(a)*sp,11));}};
  const stoneAt=(t,px,py,s)=>{px=clamp(px,s/2,W-s/2);py=clamp(py,s/2,H-s/2);hazards.push(Stone(px,py,s,t,t+SPB*1.4,SPB*0.5,true,240));};
  const sweep=(t,a0,a1)=>hazards.push(Sweep(x,y,a0,a1,26,t,t+SPB*1.375,t+SPB*2.375));
  return{
  update(t){
    const k=clamp((t-mt0)/(mt1-mt0),0,1),e=k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;x=from[0]+(to[0]-from[0])*e;y=from[1]+(to[1]-from[1])*e;
    if(player)eye=Math.atan2(player.y-y,player.x-x);
    if(t>=te&&!ex){ex=true;sq(24,0,230);burst(x,y,PINK,70,520);burst(x,y,'#fff',35,420);shake=26;flash=0.7;rumble(500,1,1);this.dead=true;return;}
    if(t<ts+2*SPB)return;
    const s=Math.floor(BT(t)*4+1e-6);if(s===lastS)return;lastS=s;
    const bar=Math.floor(s/16),p=s%16;
    if(p===8&&bar%2===1&&bar<50){let ni;do{ni=Math.floor(rnd()*5);}while(ni===ai);from=[x,y];ai=ni;to=AN[ni];mt0=t;mt1=t+SPB*0.75;}
    if(bar>=50){if(p%4===0)sq(5,s*0.4,210);if(p===0||p===8)aim(275,0.22,3);return;}
    if(bar<28){
      if(p===0)sq(8,bar*0.3,230);
      else if(p===3||p===6)aim(290,0.22,2);
      else if(p===10&&player)stoneAt(t,player.x,player.y,100);
      else if(p===13)sq(6,bar*0.3+0.5,250);
    }else if(bar<38){
      if(p===0)sweep(t,eye-1.1,eye+1.1);
      else if(p===4||p===6)aim(300);
      else if(p===10)sq(6,s*0.3,220);
      else if(p===12&&player)stoneAt(t,player.x,player.y,90);
    }else{
      if(p===0)sq(7,bar*0.37,215);
      else if(p===4)aim(280,0.25,3);
      else if(p===10&&bar%2===0)sweep(t,eye+1.2,eye-1.2);
      else if(p===14&&bar%2===1)sq(5,-s*0.3,240);
      else if(p===12&&bar%4===1&&player)stoneAt(t,player.x+(rnd()*2-1)*120,player.y+(rnd()*2-1)*120,100);
    }
  },
  draw(t){const sc=1+0.1*pulse;g.save();g.translate(x,y);
    g.save();g.rotate(t*0.6);g.shadowColor=PINK;g.shadowBlur=34;g.fillStyle=PINK;g.fillRect(-60*sc,-60*sc,120*sc,120*sc);g.shadowBlur=0;g.fillStyle='#000';g.fillRect(-42*sc,-42*sc,84*sc,84*sc);g.restore();
    g.save();g.rotate(Math.PI/4);g.fillStyle=PINK;g.fillRect(-22,-22,44,44);g.restore();
    g.fillStyle='#000';circle(Math.cos(eye)*9,Math.sin(eye)*9,9);
    g.strokeStyle=PINK;g.globalAlpha=0.5;g.lineWidth=2;g.save();g.rotate(-t*0.9);for(let i=0;i<4;i++){g.rotate(TAU/4);g.strokeRect(84,-8,16,16);}g.restore();
    g.restore();},
  hit(p,t){if(t<ts+2*SPB)return false;return Math.hypot(p.x-x,p.y-y)<58+p.r;}};}

/* ================= المرحلة الثانية =================
   ١٢٠ ضربة بالدقيقة. مقاطع الأغنية بالضربات:
   أ ٠–٤٧ | ب ٤٨–٧٩ | ج ٨٠–١١١ (أقوى جزء) | د ١١٢–١٥١ | هـ ١٥٢–٢٠٧ (تنقطع عند ٢٠٨) */
function buildLevel2(){
  const E=[],R=mulberry32(77),ev=(b,f)=>E.push({b,f});
  const rx=(a=120,b=W-120)=>a+R()*(b-a),ry=(a=100,b=H-100)=>a+R()*(b-a);
  const TI=ezT([{sp:270,wn:1.5,gap:220},{sp:300,wn:1.375,gap:195},{sp:315,wn:1.375,gap:190}]);
  const C=[[0,0],[W,0],[W,H],[0,H]];
  const stone=(hit,x,y,s,stay,frag,T)=>ev(hit-T.wn,()=>hazards.push(Stone(x,y,s,B(hit-T.wn),B(hit),stay*SPB,frag,T.sp*0.8)));
  const stoneP=(hit,s,T)=>ev(hit-T.wn,()=>{const x=clamp(player?player.x:rx(),s/2,W-s/2),y=clamp(player?player.y:ry(),s/2,H-s/2);hazards.push(Stone(x,y,s,B(hit-T.wn),B(hit),0.5*SPB,true,T.sp*0.8));});
  const sqs=(b,x,y,vx,vy)=>ev(b,()=>hazards.push(SqBullet(x,y,vx,vy)));
  const aimSq=(b,ci,sp)=>ev(b,()=>{if(!player)return;const[x,y]=C[ci%4];const a=Math.atan2(player.y-y,player.x-x);hazards.push(SqBullet(x,y,Math.cos(a)*sp,Math.sin(a)*sp));});
  const burstAt=(b,x,y,n,sp)=>ev(b,()=>{const o=rnd()*TAU;for(let i=0;i<n;i++){const a=o+i*TAU/n;hazards.push(SqBullet(x,y,Math.cos(a)*sp,Math.sin(a)*sp,10));}burst(x,y,PINK,8);});
  const sweep=(hit,px,py,a0,a1,dur,T,w=28)=>ev(hit-T.wn,()=>hazards.push(Sweep(px,py,a0,a1,w,B(hit-T.wn),B(hit),B(hit+dur))));
  const wall=(hit,dir,T,sp)=>{const vert=dir==='L'||dir==='R',gc=vert?ry(130,H-130):rx(170,W-170);ev(hit-1,()=>hazards.push(GapWall(dir,gc,T.gap,40,sp||(vert?430:300),B(hit-1),B(hit))));};
  const snake=(b,fromLeft,T,dur=4,amp=170)=>{const y0=ry(200,H-200),ph=R()*TAU,ln=R()<0.5?2:3;
    const path=u=>({x:fromLeft?-60+u*(W+120):W+60-u*(W+120),y:y0+Math.sin(u*Math.PI*ln+ph)*amp});
    ev(b-1,()=>hazards.push(Snake(path,B(b),B(b+dur),10,0.035,13,B(b-1))));};
  const spikes=(hit,side,T,dur=0.5,depth=90)=>ev(hit-T.wn,()=>hazards.push(Spikes(side,depth,B(hit-T.wn),B(hit),B(hit+dur))));
  const col=(hit,x,T,dur=0.5)=>ev(hit-T.wn,()=>hazards.push(Laser({x,y:H/2,ang:0,len:140,w:H+10,tile:true,tw:B(hit-T.wn),ta:B(hit),te:B(hit+dur)})));
  const SW=[[0,Math.PI/2],[Math.PI,Math.PI/2],[Math.PI,1.5*Math.PI],[TAU,1.5*Math.PI]];

  // مقطع أ: أحجار ومربعات وجدران وأشعة الزوايا
  function secA(d){const T=TI[d];
    for(let k=0;k<4;k++){const b=k*4,fr=k===0||k%2===1;
      if(k>0)stone(b,rx(),ry(),90,0.5,d>=1,T);
      stone(b+2,rx(),ry(),90,0.5,d>=1,T);
      sqs(b+0.75,fr?W+20:-20,ry(60,H-60),(fr?-1:1)*T.sp,0);
      sqs(b+1.5,fr?W+20:-20,ry(60,H-60),(fr?-1:1)*T.sp,0);
      if(d>=1)sqs(b+3.25,rx(),-20,0,T.sp);}
    for(let k=4;k<8;k++){const b=k*4;wall(b,k%2?'L':'R',T);stone(b+2,rx(),ry(),90,0.5,d>=1,T);stone(b+3.25,rx(),ry(),80,0.5,false,T);if(d>=1)aimSq(b+1.5,k,T.sp);}
    for(let k=8;k<12;k++){const b=k*4,c=k%4;
      if(d>=1||k%2===0)sweep(b,C[c][0],C[c][1],SW[c][0],SW[c][1],2,T);
      const o=C[(c+2)%4],ag=Math.atan2(H/2-o[1],W/2-o[0]);for(let i=0;i<3;i++){const a=ag+(i-1)*0.2;sqs(b+1.5,o[0],o[1],Math.cos(a)*T.sp,Math.sin(a)*T.sp);}
      burstAt(b+3.25,rx(),ry(),6,T.sp*0.8);}
  }
  // مقطع ب: ثعابين وأشواك
  function secB(d,boss){const T=TI[d];
    for(let k=12;k<20;k++){const b=k*4;
      if(k%2===0||(d>=1&&!boss))snake(b,k%2===0,T,4,170);
      spikes(b+1.5,k%2?'T':'B',T);

  }
  // مقطع ج: انهيار المعبد (أقوى جزء)
  function secC(d,boss){const T=TI[d];
    for(let k=20;k<28;k++){const b=k*4;
      if(boss){if(k%2===0)wall(b,['L','R','D','U'][(k/2)%4],T);else col(b+2,rx(100,W-100),T);stone(b+3.25,rx(),ry(),80,0.4,false,T);continue;}
      stoneP(b,100,T);stone(b+0.75,rx(),ry(),80,0.4,true,T);stone(b+1.5,rx(),ry(),80,0.4,k%2===1,T);
      if(k%2===0)wall(b+2,k%4===0?'L':'R',T);else col(b+2,rx(100,W-100),T);

  }
  // مقطع د: عقارب الساعة والأشواك
  function secD(d,boss){const T=TI[d];
    for(let k=28;k<38;k++){const b=k*4;
      if(boss){spikes(b+2.5,['T','R','B','L'][k%4],T);if(k%2)aimSq(b+1.5,k,T.sp);continue;}
      if(k%2===0){const a=R()*TAU;sweep(b,W/2,H/2,a,a+Math.PI,4,T);if(k>=32)sweep(b,W/2,H/2,a+Math.PI,a+TAU,4,T);}

      spikes(b+2.5,['T','R','B','L'][k%4],T);
      stone(b+3,rx(),ry(),80,0.4,false,T);}
  }
  // مقطع هـ: مع الزعيم دائمًا
  function secE(d){const T=TI[d];
    for(let k=38;k<50;k++){const b=k*4;
      if(k%4===0)wall(b+2,['L','D','R','U'][(k/4)%4],T);
      if(k%4===1)snake(b,k%8===1,T,4,150);
      if(k%4===3)spikes(b+2.5,['T','B'][Math.floor(k/4)%2],T);}
  }
  const boss=b=>ev(b,()=>hazards.push(Guardian(B(b),B(208))));
  secA(0);secB(0,false);secC(1,false);secD(1,false);boss(152);secE(2);
  E.sort((a,b)=>a.b-b.b);return E;
}

/* ================= أشكال المرحلة الثالثة (المستيقظ) ================= */
function segDist(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l2=dx*dx+dy*dy||1;const u=clamp(((px-a[0])*dx+(py-a[1])*dy)/l2,0,1);return Math.hypot(px-a[0]-u*dx,py-a[1]-u*dy);}
function Shard(x,y,vx,vy,r=8){const b=Bullet(x,y,vx,vy,r),a=Math.atan2(vy,vx);
  b.draw=function(){g.save();g.translate(this.x,this.y);g.rotate(a);const s=1+0.15*pulse;g.fillStyle='rgba(255,42,109,0.22)';g.beginPath();g.moveTo(-19*s,0);g.lineTo(0,-9*s);g.lineTo(19*s,0);g.lineTo(0,9*s);g.closePath();g.fill();g.fillStyle=PINK;g.beginPath();g.moveTo(-13*s,0);g.lineTo(0,-6*s);g.lineTo(13*s,0);g.lineTo(0,6*s);g.closePath();g.fill();g.restore();};return b;}
function lens(r,o){g.beginPath();g.moveTo(-r*1.4,0);g.quadraticCurveTo(0,-r*1.3*o-2,r*1.4,0);g.quadraticCurveTo(0,r*1.3*o+2,-r*1.4,0);g.closePath();}
// عين تنفتح وتطلق شعاع باتجاه نظرتها
function Eye(x,y,ang,tw,ta,te,o={}){const r=o.r||22,bw=o.bw||26,len=2200,hide=o.hide;return{
  update(t){if(t>te+0.35)this.dead=true;},
  draw(t){const op=t<ta?clamp((t-tw)/(ta-tw),0,1):t<te?1:clamp(1-(t-te)/0.3,0,1);
    g.save();g.translate(x,y);g.save();g.rotate(ang);
    if(t<ta){g.fillStyle=`rgba(255,42,109,${0.05+0.13*op})`;g.fillRect(0,-bw/2,len,bw);g.fillStyle=`rgba(255,42,109,${0.15+0.5*op})`;g.fillRect(0,-1.5,len,3);}
    else if(t<te){const fl=Math.max(0,1-(t-ta)/0.12),ww=bw*(1+0.12*pulse);g.shadowColor=PINK;g.shadowBlur=24;g.fillStyle=PINK;g.fillRect(0,-ww/2,len,ww);if(fl>0){g.globalAlpha=fl;g.fillStyle='#fff';g.fillRect(0,-ww/2,len,ww);}}
    g.restore();
    if(!hide){g.globalAlpha=t<ta?0.5:op;lens(r,Math.max(op,0.08));g.fillStyle=PINK;g.shadowColor=PINK;g.shadowBlur=14;g.fill();g.shadowBlur=0;
      if(op>0.15){g.fillStyle='#000';circle(Math.cos(ang)*r*0.4,Math.sin(ang)*r*0.4*op,r*0.45*op);}g.globalAlpha=1;}
    g.restore();},
  hit(p,t){if(t<ta||t>=te)return false;if(!hide&&Math.hypot(p.x-x,p.y-y)<r+p.r)return true;return obbHit(p.x,p.y,p.r,x+Math.cos(ang)*len/2,y+Math.sin(ang)*len/2,len/2,bw/2,ang);}};}
// ضربة سيف تقطع الشاشة
function Slash(cx,cy,ang,tw,ta,te,w=24){const L=3400,ax=cx-Math.cos(ang)*L/2,ay=cy-Math.sin(ang)*L/2,cut=0.09,pr=t=>clamp((t-ta)/cut,0,1);
  const blade=(l,ww)=>{g.beginPath();g.moveTo(0,0);g.lineTo(l*0.5,-ww/2);g.lineTo(l,0);g.lineTo(l*0.5,ww/2);g.closePath();g.fill();};
  return{
  update(t){if(t>te+0.25)this.dead=true;},
  draw(t){g.save();g.translate(ax,ay);g.rotate(ang);
    if(t<ta){const k=clamp((t-tw)/(ta-tw),0,1);g.fillStyle=`rgba(255,42,109,${0.15+0.5*k})`;for(let d=0;d<L;d+=28)g.fillRect(d,-1.5,15,3);}
    else if(t<te){const q=pr(t);g.shadowColor=PINK;g.shadowBlur=22;g.fillStyle=q<1?'#fff':PINK;blade(L*q,w*(1+0.15*pulse));}
    else{const k=Math.max(0,1-(t-te)/0.25);g.globalAlpha=k;g.fillStyle=PINK;blade(L,w*k);}
    g.restore();},
  hit(p,t){if(t<ta||t>=te)return false;const c=Math.cos(ang),s=Math.sin(ang),dx=p.x-ax,dy=p.y-ay,lx=dx*c+dy*s,ly=-dx*s+dy*c;if(lx<0||lx>L*pr(t))return false;const half=(w/2)*(1-Math.abs(lx-L/2)/(L/2));return Math.abs(ly)<Math.max(3,half)+p.r;}};}
// شكل هندسي يكبر وفيه ضلع ناقص
function PolyBurst(cx,cy,n,t0,sp,th,gapI,rot0,rotV,warn){
  const pts=t=>{const r=Math.max(0,(t-t0)*sp),rot=rot0+rotV*(t-t0),P=[];for(let i=0;i<n;i++){const a=rot+i*TAU/n;P.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);}return P;};
  return{
  update(t){if((t-t0)*sp>1700)this.dead=true;},
  draw(t){g.strokeStyle=PINK;g.lineCap='round';
    if(t<t0){const k=clamp(1-(t0-t)/warn,0,1),r=20+45*k;g.globalAlpha=0.6;g.lineWidth=4;g.beginPath();for(let i=0;i<n;i++){if(i===gapI)continue;const a1=rot0+i*TAU/n,a2=rot0+(i+1)*TAU/n;g.moveTo(cx+Math.cos(a1)*r,cy+Math.sin(a1)*r);g.lineTo(cx+Math.cos(a2)*r,cy+Math.sin(a2)*r);}g.stroke();g.globalAlpha=1;return;}
    const P=pts(t);g.lineWidth=th*(1+0.15*pulse);g.shadowColor=PINK;g.shadowBlur=14;g.beginPath();for(let i=0;i<n;i++){if(i===gapI)continue;const a=P[i],b=P[(i+1)%n];g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);}g.stroke();g.shadowBlur=0;},
  hit(p,t){if(t<t0)return false;const P=pts(t);for(let i=0;i<n;i++){if(i===gapI)continue;if(segDist(p.x,p.y,P[i],P[(i+1)%n])<th/2+p.r-2)return true;}return false;}};}
// كرة تلاحقك ثم تنفجر
function Orb(x,y,tw,t0,t1,sp,turn,shsp){let vx=0,vy=0;return{x,y,
  update(t,dt){if(t<t0)return;
    if(t>=t1){for(let i=0;i<8;i++){const a=i*TAU/8+0.2;hazards.push(Shard(this.x,this.y,Math.cos(a)*shsp,Math.sin(a)*shsp));}burst(this.x,this.y,PINK,14);shake=Math.max(shake,5);this.dead=true;return;}
    if(player){const a=Math.atan2(player.y-this.y,player.x-this.x),ca=Math.atan2(vy,vx);let da=a-ca;da=Math.atan2(Math.sin(da),Math.cos(da));const na=(vx||vy)?ca+clamp(da,-turn*dt,turn*dt):a;vx=Math.cos(na)*sp;vy=Math.sin(na)*sp;}

  draw(t){if(t<t0){const k=clamp((t-tw)/(t0-tw),0,1);g.strokeStyle=PINK;g.globalAlpha=0.6;g.lineWidth=3;g.beginPath();g.arc(this.x,this.y,40*(1-k)+15,0,TAU);g.stroke();g.globalAlpha=0.3;g.fillStyle=PINK;circle(this.x,this.y,15*k);g.globalAlpha=1;return;}
    const left=t1-t,bl=left<0.6&&Math.floor(left*14)%2===0;g.fillStyle='rgba(255,42,109,0.25)';circle(this.x,this.y,27*(1+0.2*pulse));g.fillStyle=bl?'#fff':PINK;circle(this.x,this.y,15*(1+0.15*pulse));},
  hit(p,t){return t>=t0&&Math.hypot(p.x-this.x,p.y-this.y)<15+p.r-1;}};}
// بندول يتأرجح من فوق
function Pendulum(px,L,amp,per,ph,tw,t0,t1,R=42){
  const ang=t=>amp*Math.sin(TAU*(t-t0)/per+ph);
  const len=t=>t<t0?L*clamp((t-tw)/(t0-tw),0,1):t<t1?L:L*clamp(1-(t-t1)/(SPB*1.5),0,1);
  const bob=t=>{const a=ang(Math.max(t,t0)),l=len(t);return[px+Math.sin(a)*l,-30+Math.cos(a)*l];};
  return{
  update(t){if(t>t1+SPB*1.5)this.dead=true;},
  draw(t){const act=t>=t0&&t<t1;
    if(t<t0){g.strokeStyle='rgba(255,42,109,0.3)';g.lineWidth=2;g.beginPath();g.arc(px,-30,L,Math.PI/2-amp,Math.PI/2+amp);g.stroke();}
    const[bx,by]=bob(t);g.globalAlpha=act?1:0.4;g.strokeStyle=PINK;g.lineWidth=6;g.beginPath();g.moveTo(px,-30);g.lineTo(bx,by);g.stroke();
    g.fillStyle=PINK;if(act){g.shadowColor=PINK;g.shadowBlur=22;}circle(bx,by,R*(1+0.1*pulse));g.shadowBlur=0;g.fillStyle='#000';circle(bx,by,R*0.42);g.globalAlpha=1;},
  hit(p,t){if(t<t0||t>=t1)return false;const[bx,by]=bob(t);if(Math.hypot(p.x-bx,p.y-by)<R+p.r-2)return true;return segDist(p.x,p.y,[px,-30],[bx,by])<3+p.r;}};}
// كف تنزل تضرب الأرض
function Palm(x,y,tw,ta,stay,shsp){const w=150,h=170;return{
  update(t){if(!this.l&&t>=ta){this.l=true;shake=Math.max(shake,9);burst(x,y,PINK,14,300);}
    if(t>=ta+stay){for(let i=0;i<6;i++){const a=i*TAU/6+0.3;hazards.push(Shard(x,y,Math.cos(a)*shsp,Math.sin(a)*shsp));}this.dead=true;}},
  shape(s){const fw=w/4;g.beginPath();rr(x-w/2*s,y-h*0.1*s,w*s,h*0.6*s,20*s);g.fill();for(let i=0;i<4;i++){rr(x-w/2*s+i*fw*s+4*s,y-h/2*s,fw*s-8*s,h*0.5*s,10*s);g.fill();}},
  draw(t){if(t<ta){const k=clamp((t-tw)/(ta-tw),0,1);g.fillStyle=`rgba(255,42,109,${0.06+0.2*k})`;this.shape(1.6-0.6*k);}
    else{g.save();g.shadowColor=PINK;g.shadowBlur=24;g.fillStyle=(t-ta)<0.08?'#fff':PINK;this.shape(1);g.restore();}},

// الزعيم: المستيقظ — عين عملاقة نصها برا الشاشة
function Awakened(ts,te,T){
  const cy=H/2,R=200,HX=W+80;let x=W+420,look=Math.PI,lastS=-1,ex=false;
  const openT=ts+4*SPB,openE=ts+8*SPB,live=ts+8*SPB;
  const op=t=>t>=te?0:clamp((t-openT)/(openE-openT),0,1);
  const pupil=()=>[x+Math.cos(look)*R*0.4,cy+Math.sin(look)*R*0.4];
  const beam=(t,w=34)=>{const[px,py]=pupil();if(!player)return;const a=Math.atan2(player.y-py,player.x-px);hazards.push(Eye(px,py,a,t,t+SPB*T.wn,t+SPB*(T.wn+0.75),{hide:true,bw:w}));};
  const fan=(n,spread,sp)=>{const[px,py]=pupil();if(!player)return;const a0=Math.atan2(player.y-py,player.x-px);for(let k=0;k<n;k++){const a=a0+(k-(n-1)/2)*spread;hazards.push(Shard(px,py,Math.cos(a)*sp,Math.sin(a)*sp));}};
  const palm=t=>{if(!player)return;const px=clamp(player.x+(rnd()*2-1)*60,80,W-300),py=clamp(player.y+(rnd()*2-1)*60,90,H-90);hazards.push(Palm(px,py,t,t+SPB*(T.wn+0.2),SPB*0.5,230));};
  const orbs=t=>{for(const dy of [-170,170])hazards.push(Orb(W-260,cy+dy,t,t+SPB,t+SPB*7,165,1.6,210));};
  const poly=(t,n)=>{const[px,py]=pupil();hazards.push(PolyBurst(px,py,n,t+SPB*T.wn,230,16,Math.floor(rnd()*n),rnd()*TAU,0.4,SPB*T.wn));};
  return{
  update(t){
    x=t<ts+2*SPB?W+420-(W+420-HX)*clamp((t-ts)/(2*SPB),0,1):HX;
    if(player){const[px,py]=[x,cy];const target=Math.atan2(player.y-py,player.x-px);let d=target-look;d=Math.atan2(Math.sin(d),Math.cos(d));look+=d*0.12;}
    if(t>=te&&!ex){ex=true;for(let i=0;i<30;i++){const a=Math.PI/2+i*Math.PI/29;hazards.push(Shard(W-60,cy,Math.cos(a)*230,Math.sin(a)*230));}burst(W-60,cy,PINK,80,560);burst(W-60,cy,'#fff',40,460);shake=28;flash=0.75;rumble(600,1,1);this.dead=true;return;}
    if(t<openT+0.01&&t>=ts+2*SPB&&!this.rumbled){this.rumbled=true;rumble(800,0.5,0.4);shake=Math.max(shake,6);}
    if(t<live)return;
    const s=Math.floor(BT(t)*4+1e-6);if(s===lastS)return;lastS=s;
    const bar=Math.floor(s/16),p=s%16;
    if(bar<55){if(p===0)beam(t);else if(p===8)palm(t);else if(p===4||p===12)fan(5,0.18,T.sp);else if(p===10&&bar%2)beam(t,28);}
    else if(bar<59){if(p===0&&bar%2===1)orbs(t);else if(p===8)fan(5,0.2,T.sp*0.9);}
    else if(bar<63){if(p===0||p===8)beam(t);else if(p===4)palm(t);else if(p===12)poly(t,6);else if(p%4===2)fan(3,0.2,T.sp);}
    else{if(p===0)beam(t);else if(p===8&&bar%2)palm(t);else if(p===8)fan(5,0.18,T.sp*0.9);else if(p===12)fan(3,0.22,T.sp);}
  },
  draw(t){const o=op(t);g.save();g.translate(x,cy);
    g.save();g.rotate(t*0.3);g.strokeStyle=PINK;g.globalAlpha=0.5;g.lineWidth=2;for(let i=0;i<8;i++){g.rotate(TAU/8);g.save();g.translate(R+34,0);g.rotate(Math.PI/4);g.strokeRect(-8,-8,16,16);g.restore();}g.restore();g.globalAlpha=1;
    g.shadowColor=PINK;g.shadowBlur=40;g.fillStyle=PINK;circle(0,0,R*(1+0.04*pulse));g.shadowBlur=0;
    const lr=R*0.85,lp=()=>{g.beginPath();g.moveTo(-lr,0);g.quadraticCurveTo(0,-R*0.95*o,lr,0);g.quadraticCurveTo(0,R*0.95*o,-lr,0);g.closePath();};
    if(o>0.03){lp();g.fillStyle='#000';g.fill();g.save();lp();g.clip();g.fillStyle=PINK;circle(Math.cos(look)*R*0.38,Math.sin(look)*R*0.38,R*0.3);g.fillStyle='#000';circle(Math.cos(look)*R*0.43,Math.sin(look)*R*0.43,R*0.13*(1+0.3*pulse));g.restore();}
    else{g.strokeStyle='#000';g.lineWidth=7;g.beginPath();g.moveTo(-lr,0);g.quadraticCurveTo(0,R*0.18,lr,0);g.stroke();}
    g.restore();},
  hit(p,t){return Math.hypot(p.x-x,p.y-cy)<R-6+p.r;}};}

/* ================= المرحلة الثالثة =================
   ١٢٠ ضربة بالدقيقة. القسم الأول ٠–١٠٧ | الثاني ١٠٨–١٨٧ | الثالث ١٨٨–٢٨٣ والزعيم ينهزم عند ٢٨٤ */
function buildLevel3(){
  const E=[],R=mulberry32(303),ev=(b,f)=>E.push({b,f});
  const rx=(a=120,b=W-120)=>a+R()*(b-a),ry=(a=100,b=H-100)=>a+R()*(b-a);
  const TI=ezT([{sp:285,wn:1.375},{sp:315,wn:1.25},{sp:335,wn:1.2}]);
  const edge=()=>{const s=Math.floor(R()*4),u=R();return s===0?[60+u*(W-120),30]:s===1?[W-30,60+u*(H-120)]:s===2?[60+u*(W-120),H-30]:[30,60+u*(H-120)];};
  const eye=(hit,T,pt,dur=0.75)=>{const[x,y]=pt||edge();ev(hit-T.wn,()=>{const a=player?Math.atan2(player.y-y,player.x-x):Math.atan2(H/2-y,W/2-x);hazards.push(Eye(x,y,a,B(hit-T.wn),B(hit),B(hit+dur)));});};
  const slash=(hit,T,onPlayer=true)=>{const a=R()*Math.PI,jx=(R()*2-1)*80,jy=(R()*2-1)*80,fx=rx(),fy=ry();ev(hit-T.wn,()=>{const cx=onPlayer&&player?player.x+jx:fx,cy=onPlayer&&player?player.y+jy:fy;hazards.push(Slash(cx,cy,a,B(hit-T.wn),B(hit),B(hit+0.35)));});};
  const poly=(hit,x,y,n,T,sp=220,rv=0)=>{const gi=Math.floor(R()*n),r0=R()*TAU;ev(hit-T.wn,()=>hazards.push(PolyBurst(x,y,n,B(hit),sp,16,gi,r0,rv,T.wn*SPB)));};
  const orb=(hit,x,y,T,life=5,sp=165)=>ev(hit-1,()=>hazards.push(Orb(x,y,B(hit-1),B(hit),B(hit+life),sp,1.5,T.sp*0.7)));
  const pend=(b0,b1,px,L,amp,per,ph)=>ev(b0-2,()=>hazards.push(Pendulum(px,L,amp,per*SPB,ph,B(b0-2),B(b0),B(b1))));
  const fanFrom=(b,pt,n,spread,sp)=>ev(b,()=>{if(!player)return;const[x,y]=pt;const a0=Math.atan2(player.y-y,player.x-x);for(let k=0;k<n;k++){const a=a0+(k-(n-1)/2)*spread;hazards.push(Shard(x,y,Math.cos(a)*sp,Math.sin(a)*sp));}});
  const C=[[0,0],[W,0],[W,H],[0,H]];

  /* ---------- القسم الأول ---------- */
  let T=TI[0];
  for(let k=1;k<8;k+=2)eye(k*4,T);for(let k=2;k<8;k+=2)eye(k*4+2,T,[W/2,20]);
  orb(12,W*0.75,H*0.3,T);orb(28,W*0.75,H*0.7,T);
  for(let k=8;k<12;k++){const b=k*4;slash(b,T);if(k%2)slash(b+1,T,false);if(k%2===0)eye(b+3,T);}
  for(let k=12;k<20;k++){const b=k*4;if(k%2===0)poly(b,rx(300,W-300),ry(200,H-200),6,T,200);else{eye(b,T);slash(b+2,T,false);}}
  pend(82,106,W*0.5,520,0.95,8,0);
  for(let k=20;k<27;k++){const b=k*4;if(k%2===0)slash(b,T);else eye(b+2,T);}

  /* ---------- القسم الثاني ---------- */
  T=TI[1];
  ev(108,()=>{flash=Math.max(flash,0.25);shake=Math.max(shake,10);});
  for(const c of C)eye(108,T,[c[0]?c[0]-30:30,c[1]?c[1]-30:30],1);
  for(const b of [112,120,128]){orb(b,rx(700,W-120),ry(),T,6,160);orb(b+2,rx(120,560),ry(),T,6,160);}
  pend(114,134,W*0.5,560,1.0,8,0);
  for(const b of [116,124,132])poly(b,rx(300,W-300),ry(200,H-200),5,T,230,0.3);
  for(let k=34;k<42;k++){const b=k*4;eye(b,T);eye(b+0.5,T);slash(b+2,T);fanFrom(b+3,C[k%4],4,0.2,T.sp);}
  poly(144,W/2,H/2,6,T,230,0.4);poly(160,W/2,H/2,6,T,230,-0.4);
  for(let k=42;k<46;k++){const b=k*4;slash(b,T);slash(b+1,T,false);slash(b+2,T);slash(b+3,T,false);}
  poly(168,W/2,H/2,3,T,250,0.5);poly(176,W/2,H/2,3,T,250,-0.5);
  pend(168,184,W*0.3,500,1.0,4,0);pend(168,184,W*0.7,500,1.0,4,Math.PI);
  // ١:٣٢ السكتة — ما فيه شي

  /* ---------- القسم الثالث (الزعيم) ---------- */
  T=TI[2];const TT=T;
  ev(188,()=>hazards.push(Awakened(B(188),B(284),TT)));
  for(let k=49;k<55;k++){slash(k*4+2,T);if(k%2)eye(k*4+3,T);}
  for(let k=55;k<59;k++){const b=k*4;slash(b,T);slash(b+2,T,false);eye(b+1,T);}
  for(let k=59;k<63;k++){const b=k*4;slash(b+1,T,false);slash(b+3,T);}
  pend(254,282,W*0.28,500,0.9,8,0);pend(254,282,W*0.58,500,0.9,8,Math.PI);
  for(let k=63;k<71;k++){slash(k*4+2,T);if(k%2===0)slash(k*4+3.5,T,false);}
  E.sort((a,b)=>a.b-b.b);return E;
}

/* ================= أشكال المرحلة الرابعة (زهرة العقل) ================= */
function Leaf(x,y,vx,vy,r=9){const b=Bullet(x,y,vx,vy,r),a=Math.atan2(vy,vx);
  b.draw=function(){g.save();g.translate(this.x,this.y);g.rotate(a);const s=1+0.15*pulse;g.fillStyle='rgba(255,42,109,0.22)';g.beginPath();g.ellipse(0,0,20*s,11*s,0,0,TAU);g.fill();g.fillStyle=PINK;g.beginPath();g.ellipse(0,0,14*s,7*s,0,0,TAU);g.fill();g.restore();};return b;}
// زهرة تتفتح: بتلات تكبر وتلف ثم تطير
function Bloom(x,y,n,tw,ta,tr,R,sp,rv=1.2){const rot0=rnd()*TAU,pw=R*0.32;
  const rot=t=>rot0+rv*Math.max(0,t-ta),len=t=>R*clamp((t-ta)/0.15,0,1);
  return{
  update(t){if(t>=tr){const r=rot(tr);for(let i=0;i<n;i++){const a=r+i*TAU/n;hazards.push(Leaf(x+Math.cos(a)*R*0.5,y+Math.sin(a)*R*0.5,Math.cos(a)*sp,Math.sin(a)*sp));}burst(x,y,PINK,10);this.dead=true;}},
  draw(t){g.save();g.translate(x,y);
    if(t<ta){const k=clamp((t-tw)/(ta-tw),0,1);g.rotate(rot0);g.strokeStyle=`rgba(255,42,109,${0.2+0.5*k})`;g.lineWidth=2;for(let i=0;i<n;i++){g.save();g.rotate(i*TAU/n);g.beginPath();g.ellipse(R/2,0,R/2,pw/2,0,0,TAU);g.stroke();g.restore();}g.fillStyle=`rgba(255,42,109,${0.2+0.4*k})`;circle(0,0,10*k+4);}
    else{g.rotate(rot(t));const l=len(t);g.shadowColor=PINK;g.shadowBlur=18;g.fillStyle=(t-ta)<0.08?'#fff':PINK;for(let i=0;i<n;i++){g.save();g.rotate(i*TAU/n);g.beginPath();g.ellipse(l/2,0,l/2,pw/2*(1+0.12*pulse),0,0,TAU);g.fill();g.restore();}g.shadowBlur=0;g.fillStyle='#000';circle(0,0,12);}
    g.restore();},
  hit(p,t){if(t<ta)return false;const r=rot(t),l=len(t);if(Math.hypot(p.x-x,p.y-y)<14+p.r)return true;for(let i=0;i<n;i++){const a=r+i*TAU/n,cx=x+Math.cos(a)*l/2,cy=y+Math.sin(a)*l/2;const c=Math.cos(a),s=Math.sin(a),dx=p.x-cx,dy=p.y-cy,lx=(dx*c+dy*s)/(l/2+p.r),ly=(-dx*s+dy*c)/(pw/2+p.r);if(lx*lx+ly*ly<1)return true;}return false;}};}
// غصن ينمو على مسار ويبقى لحظة ثم يذبل
function Vine(path,tw,t0,tg,t1,w=18){const N=48,P=[];for(let i=0;i<=N;i++){const q=path(i/N);P.push([q.x,q.y]);}
  const grown=t=>clamp((t-t0)/(tg-t0),0,1);
  return{
  update(t){if(t>t1+0.3)this.dead=true;},
  draw(t){g.lineCap='round';g.lineJoin='round';
    if(t<t0){const k=clamp((t-tw)/(t0-tw),0,1);g.fillStyle=`rgba(255,42,109,${0.15+0.45*k})`;for(let i=0;i<=N;i+=2)circle(P[i][0],P[i][1],3);return;}
    const gk=grown(t),m=Math.max(1,Math.floor(gk*N)),a=t<t1?1:Math.max(0,1-(t-t1)/0.3);
    g.globalAlpha=a;g.strokeStyle=PINK;g.lineWidth=w*(t<t1?1+0.12*pulse:a);g.shadowColor=PINK;g.shadowBlur=14;g.beginPath();g.moveTo(P[0][0],P[0][1]);for(let i=1;i<=m;i++)g.lineTo(P[i][0],P[i][1]);g.stroke();g.shadowBlur=0;
    g.fillStyle=PINK;for(let i=6;i<=m;i+=8){const dx=P[i][0]-P[i-1][0],dy=P[i][1]-P[i-1][1],an=Math.atan2(dy,dx)+(i%16?1:-1)*1.1;g.save();g.translate(P[i][0],P[i][1]);g.rotate(an);g.beginPath();g.ellipse(14,0,14,6,0,0,TAU);g.fill();g.restore();}
    g.globalAlpha=1;},
  hit(p,t){if(t<t0||t>=t1)return false;const m=Math.max(1,Math.floor(grown(t)*N));for(let i=1;i<=m;i++)if(segDist(p.x,p.y,P[i-1],P[i])<w/2+p.r-1)return true;return false;}};}
// شبكة مربعات متناوبة: نص الخانات تضرب
function Checker(cols,rows,par,tw,ta,te){const cw=W/cols,ch=H/rows,bad=(i,j)=>((i+j)&1)===par;
  return{
  update(t){if(t>te+0.25)this.dead=true;},
  draw(t){const a=t<ta?0.07+0.2*clamp((t-tw)/(ta-tw),0,1):t<te?1:Math.max(0,1-(t-te)/0.25);
    for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){if(!bad(i,j))continue;const x=i*cw,y=j*ch;
      if(t<ta){g.fillStyle=`rgba(255,42,109,${a})`;g.fillRect(x+3,y+3,cw-6,ch-6);g.strokeStyle='rgba(255,42,109,0.7)';g.lineWidth=2;g.strokeRect(x+10,y+10,cw-20,ch-20);}
      else{g.globalAlpha=a;g.fillStyle=(t-ta)<0.07?'#fff':PINK;const s=t<te?0.92+0.08*pulse:a;g.fillRect(x+cw*(1-s)/2,y+ch*(1-s)/2,cw*s,ch*s);g.globalAlpha=1;}}},
  hit(p,t){if(t<ta||t>=te)return false;for(const[dx,dy]of[[-1,-1],[1,-1],[-1,1],[1,1]]){const px=p.x+dx*(p.r-1),py=p.y+dy*(p.r-1),i=Math.floor(px/cw),j=Math.floor(py/ch);if(i>=0&&j>=0&&i<cols&&j<rows&&bad(i,j))return true;}return false;}};}
// باعث بذور يرمي أوراق على أذرع تلف
function Seeder(x,y,arms,t0,t1,step,rv,sp,tw){let last=-1;return{
  update(t){if(t>=t1){this.dead=true;return;}if(t<t0)return;const k=Math.floor((t-t0)/step);if(k===last)return;last=k;const base=rv*(t-t0);for(let i=0;i<arms;i++){const a=base+i*TAU/arms;hazards.push(Leaf(x+Math.cos(a)*20,y+Math.sin(a)*20,Math.cos(a)*sp,Math.sin(a)*sp,8));}},

  hit(){return false;}};}

// الزعيم: زهرة العقل — في النص، بتلاتها تلف وتنبض مع الإيقاع وتزيد كل ما تقدمت
function MindFlower(ts,te,T){
  const cx=W/2,cy=H/2,Lb=230,pw=34;let rot=0,lastS=-1,ex=false,lastT=ts;
  const nAt=bar=>bar<60?4:bar<68?6:8;
  const grow=t=>clamp((t-ts)/(2*SPB),0,1);
  const env=t=>{const ph=((BT(t))%1+1)%1;return Math.exp(-ph*4);};
  const plen=t=>Lb*grow(t)*(0.55+0.45*env(t));
  const seeds=(n,base,sp)=>{for(let i=0;i<n;i++){const a=base+i*TAU/n;hazards.push(Leaf(cx+Math.cos(a)*60,cy+Math.sin(a)*60,Math.cos(a)*sp,Math.sin(a)*sp,8));}};
  const bloomAt=(t,px,py)=>{px=clamp(px,110,W-110);py=clamp(py,110,H-110);hazards.push(Bloom(px,py,5,t,t+SPB*T.wn,t+SPB*(T.wn+2),130,T.sp*0.8));};
  const vine=t=>{if(!player)return;const s=Math.floor(rnd()*4),u=rnd();const st=s===0?[u*W,-20]:s===1?[W+20,u*H]:s===2?[u*W,H+20]:[-20,u*H];const tx=player.x,ty=player.y,dx=tx-st[0],dy=ty-st[1],d=Math.hypot(dx,dy)||1,nx=-dy/d,ny=dx/d,amp=60+rnd()*60,ex2=st[0]+dx/d*1700,ey2=st[1]+dy/d*1700;
    hazards.push(Vine(u2=>({x:st[0]+(ex2-st[0])*u2+nx*Math.sin(u2*Math.PI*3)*amp,y:st[1]+(ey2-st[1])*u2+ny*Math.sin(u2*Math.PI*3)*amp}),t,t+SPB*T.wn,t+SPB*(T.wn+1),t+SPB*(T.wn+2)));};
  const fan=(n,spr,sp)=>{if(!player)return;const a0=Math.atan2(player.y-cy,player.x-cx);for(let k=0;k<n;k++){const a=a0+(k-(n-1)/2)*spr;hazards.push(Leaf(cx+Math.cos(a)*60,cy+Math.sin(a)*60,Math.cos(a)*sp,Math.sin(a)*sp));}};
  return{
  update(t){const dt=t-lastT;lastT=t;const bar=Math.floor(BT(t)/4);rot+=dt*(Math.floor(bar/8)%2?-0.9:0.9);
    if(t>=te&&!ex){ex=true;seeds(32,0,230);burst(cx,cy,PINK,80,560);burst(cx,cy,'#fff',40,460);shake=28;flash=0.75;rumble(600,1,1);this.dead=true;return;}
    if(t<ts+2*SPB)return;
    const s=Math.floor(BT(t)*4+1e-6);if(s===lastS)return;lastS=s;const p=s%16;
    if(bar<60){if(p===0&&player)bloomAt(t,player.x+(rnd()*2-1)*90,player.y+(rnd()*2-1)*90);else if(p===8&&bar%2===0)vine(t);else if(p===4||p===12)seeds(3,s*0.33,T.sp*0.75);}
    else if(bar<68){if(p===0&&player)bloomAt(t,player.x+(rnd()*2-1)*90,player.y+(rnd()*2-1)*90);else if(p===8)vine(t);else if(p===4||p===12)fan(3,0.24,T.sp);else if(p===6||p===14)seeds(5,s*0.3,T.sp*0.75);}
    else{if((p===0||p===8)&&player)bloomAt(t,player.x+(rnd()*2-1)*110,player.y+(rnd()*2-1)*110);else if(p%4===2)seeds(6,s*0.27,T.sp*0.75);}
  },
  draw(t){const gr=grow(t),bar=Math.floor(BT(t)/4),n=nAt(bar),l=plen(t);g.save();g.translate(cx,cy);
    g.globalAlpha=t<ts+2*SPB?0.4:1;g.save();g.rotate(rot);g.shadowColor=PINK;g.shadowBlur=26;g.fillStyle=PINK;
    for(let i=0;i<n;i++){g.save();g.rotate(i*TAU/n);g.beginPath();g.ellipse(l/2+20,0,l/2,pw/2,0,0,TAU);g.fill();g.restore();}g.restore();
    g.shadowColor=PINK;g.shadowBlur=36;g.fillStyle=PINK;circle(0,0,55*gr*(1+0.08*pulse));g.shadowBlur=0;
    g.fillStyle='#000';g.save();g.rotate(-t*0.8);for(let i=0;i<6;i++){g.rotate(TAU/6);g.beginPath();g.ellipse(20*gr,0,16*gr,7*gr,0,0,TAU);g.fill();}g.restore();circle(0,0,10*gr);
    g.globalAlpha=1;g.restore();},
  hit(p,t){if(t<ts+2*SPB)return false;if(Math.hypot(p.x-cx,p.y-cy)<55+p.r-2)return true;const bar=Math.floor(BT(t)/4),n=nAt(bar),l=plen(t);
    for(let i=0;i<n;i++){const a=rot+i*TAU/n,mx=cx+Math.cos(a)*(l/2+20),my=cy+Math.sin(a)*(l/2+20),c=Math.cos(a),s=Math.sin(a),dx=p.x-mx,dy=p.y-my,lx=(dx*c+dy*s)/(l/2+p.r),ly=(-dx*s+dy*c)/(pw/2+p.r);if(lx*lx+ly*ly<1)return true;}return false;}};}

/* ================= المرحلة الرابعة =================
   ١٥٠ ضربة بالدقيقة (كل مقطع ١.٦ ثانية). القسم الأول ٠–١١١ | الثاني ١١٢–٢٠٧ | الثالث ٢٠٨–٢٨٧ والزعيم ينهزم عند ٢٨٨ */
function buildLevel4(){
  const E=[],R=mulberry32(404),ev=(b,f)=>E.push({b,f});
  const rx=(a=130,b=W-130)=>a+R()*(b-a),ry=(a=110,b=H-110)=>a+R()*(b-a);
  const TI=ezT([{sp:290,wn:1.65},{sp:320,wn:1.5},{sp:340,wn:1.4}]);
  const bloom=(hit,x,y,n,T,R0=130,life=2)=>ev(hit-T.wn,()=>hazards.push(Bloom(x,y,n,B(hit-T.wn),B(hit),B(hit+life),R0,T.sp*0.8)));
  const bloomP=(hit,n,T)=>{const jx=(R()*2-1)*80,jy=(R()*2-1)*80;ev(hit-T.wn,()=>{const x=clamp((player?player.x:W/2)+jx,110,W-110),y=clamp((player?player.y:H/2)+jy,110,H-110);hazards.push(Bloom(x,y,n,B(hit-T.wn),B(hit),B(hit+2),130,T.sp*0.8));});};
  const vine=(hit,T,aimP=false)=>{const s=Math.floor(R()*4),u=0.15+R()*0.7,amp=50+R()*70,wav=2+Math.floor(R()*2),tx0=rx(),ty0=ry();
    ev(hit-T.wn,()=>{const st=s===0?[u*W,-20]:s===1?[W+20,u*H]:s===2?[u*W,H+20]:[-20,u*H];const tx=aimP&&player?player.x:tx0,ty=aimP&&player?player.y:ty0;const dx=tx-st[0],dy=ty-st[1],d=Math.hypot(dx,dy)||1,nx=-dy/d,ny=dx/d,ex=st[0]+dx/d*1700,ey=st[1]+dy/d*1700;
      hazards.push(Vine(q=>({x:st[0]+(ex-st[0])*q+nx*Math.sin(q*Math.PI*wav)*amp,y:st[1]+(ey-st[1])*q+ny*Math.sin(q*Math.PI*wav)*amp}),B(hit-T.wn),B(hit),B(hit+1),B(hit+2)));});};
  const checker=(hit,par,T,cols=8,rows=4,dur=0.75)=>ev(hit-T.wn,()=>hazards.push(Checker(cols,rows,par,B(hit-T.wn),B(hit),B(hit+dur))));
  const seeder=(b0,b1,x,y,arms,stepB,rv,T,sp)=>ev(b0-1,()=>hazards.push(Seeder(x,y,arms,B(b0),B(b1),stepB*SPB,rv,sp||T.sp*0.75,B(b0-1))));

  /* ---------- القسم الأول ---------- */
  let T=TI[0];
  for(let k=1;k<8;k++){bloom(k*4,rx(),ry(),k%2?4:5,T);if(k%2===0)vine(k*4+2,T);}
  for(let k=8;k<16;k++){const b=k*4;vine(b,T);if(k%2)bloom(b+2,rx(),ry(),4,T);else bloomP(b+2,4,T);}
  bloom(60,W/2,H/2,8,T,170,2);
  for(let k=16;k<28;k++){const b=k*4;if(k%4===0)checker(b,k%8?1:0,T);else if(k%2)vine(b,T);else bloomP(b,5,T);if(k%4===2)vine(b+2,T,true);}
  // ٠:٤٤ نقطة الحفظ الأولى
  /* ---------- القسم الثاني ---------- */
  T=TI[1];
  seeder(112,136,W/2,H/2,4,0.5,0.9,T,T.sp*0.7);
  for(let k=28;k<34;k++){const b=k*4;vine(b+2,T);if(k%2===0)bloomP(b,4,T);else bloom(b,rx(),ry(),5,T);}
  for(const b of [136,140]){ev(b,()=>{flash=Math.max(flash,0.22);shake=Math.max(shake,9);});bloom(b,W/2,H/2,8,T,190,1.5);checker(b+2,(b/4)%2,T);}
  for(let k=36;k<44;k++){const b=k*4;if(k%2===0){checker(b,k%4?1:0,T,8,4,0.6);bloomP(b+2,4,T);vine(b+3,T,true);}else{vine(b,T,true);bloom(b+2,rx(),ry(),5,T);}}
  seeder(176,192,W*0.3,H/2,3,1,1.1,T);seeder(176,192,W*0.7,H/2,3,1,-1.1,T);
  for(let k=44;k<48;k++){vine(k*4+2,T);bloomP(k*4,5,T);}
  for(let k=48;k<52;k++){const b=k*4;bloomP(b,5,T);bloomP(b+2,4,T);checker(b+3,k%2,T,8,4,0.5);}
  /* ---------- القسم الثالث (الزعيم) ---------- */
  T=TI[2];const TT=T;
  ev(208,()=>hazards.push(MindFlower(B(208),B(288),TT)));
  for(let k=54;k<72;k+=4)checker(k*4+2,k%8===2?0:1,T,8,4,0.6);
  for(let k=52;k<68;k++)vine(k*4+3,T,k%2===0);
  E.sort((a,b)=>a.b-b.b);return E;
}

function PianoKey(col,n,tw,ta,te,black){const cw=W/n,x=col*cw+cw/2,w=black?cw*0.62:cw-4,len=black?H*0.62:H;

// ديكور: كيبورد رمادي فوق الشاشة (ما يضر)

    g.globalAlpha=1;g.restore();},

// الزعيم: طائر الفينيق — فوق في النص، جناحاته ترفرف مع الإيقاع وترمي ريش، يمسح بالنار، وينقض على اللاعب.
// لما تنقطع الموسيقى يوقف ويشحن، وينفجر عند ٢:٥٠
function Phoenix(ts,tc,tx,T){
  const HX=W/2,HY=150,WL=190;let x=HX,y=-200,lastS=-1,ex=false,dive=null;
  const flap=t=>Math.exp(-(((BT(t))%1+1)%1)*3),grow=t=>clamp((t-ts)/(2*SPB),0,1);
  const wingA=(t,sd)=>{const a=-0.3-0.75*flap(t);return sd>0?a:Math.PI-a;};
  const root=sd=>[x+sd*26,y-4],tip=(t,sd)=>{const[rx,ry]=root(sd),a=wingA(t,sd);return[rx+Math.cos(a)*WL,ry+Math.sin(a)*WL];};
  const fanW=(t,n,spr,sp)=>{for(const sd of [-1,1]){const[tx2,ty2]=tip(t,sd),a0=sd>0?0.55:Math.PI-0.55;for(let k=0;k<n;k++){const a=a0+(k-(n-1)/2)*spr;hazards.push(Feather(tx2,ty2,Math.cos(a)*sp,Math.sin(a)*sp));}}};
  const aim=(n,spr,sp)=>{if(!player)return;const a0=Math.atan2(player.y-y,player.x-x);for(let k=0;k<n;k++){const a=a0+(k-(n-1)/2)*spr;hazards.push(Feather(x+Math.cos(a)*40,y+Math.sin(a)*40,Math.cos(a)*sp,Math.sin(a)*sp));}};
  const ring=(n,base,sp)=>{for(let i=0;i<n;i++){const a=base+i*TAU/n;hazards.push(Feather(x+Math.cos(a)*40,y+Math.sin(a)*40,Math.cos(a)*sp,Math.sin(a)*sp));}};
  const sweep=(t,sd)=>{const a0=sd>0?0.12:Math.PI-0.12,a1=sd>0?1.9:Math.PI-1.9;hazards.push(Sweep(HX,HY,a0,a1,30,t,t+SPB*T.wn,t+SPB*(T.wn+2)));};
  return{
  update(t){
    if(t>=tx&&!ex){ex=true;burst(x,y,PINK,90,600);burst(x,y,'#fff',50,480);burst(x,y,'#ffb36b',30,380);shake=30;flash=0.8;rumble(650,1,1);this.dead=true;return;}
    if(t<ts){return;}
    if(dive){const{tw,ta,tb,te,px,py}=dive;if(t<ta){x=HX;y=HY;}else if(t<tb){const k=clamp((t-ta)/(tb-ta),0,1),e=k*k;x=HX+(px-HX)*e;y=HY+(py-HY)*e;}else if(t<te){const k=clamp((t-tb)/(te-tb),0,1),e=1-Math.pow(1-k,2);x=px+(HX-px)*e;y=py+(HY-py)*e;}else{x=HX;y=HY;dive=null;}}
    else{const k=grow(t),e=1-Math.pow(1-k,3);x=HX;y=-200+(HY+200)*e;}
    if(t<ts+2*SPB||t>=tc)return;
    const s=Math.floor(BT(t)*2+1e-6);if(s===lastS)return;lastS=s;
    const b=s/2,rb=Math.floor((b-BT(ts))/4),p=s%8;// p: نص ضربة داخل المقطع
    if(dive&&t<dive.te)return;
    if(rb<4){if(p===0||p===4)fanW(t,6,0.26,T.sp*0.9);else if(p===2||p===6)aim(5,0.2,T.sp);else if(p===5)ring(12,s*0.4,T.sp*0.7);}
    else if(rb<8){if(p===0){fanW(t,6,0.26,T.sp*0.9);sweep(t,rb%2?-1:1);}else if(p===4)fanW(t,5,0.28,T.sp*0.9);else if(p===2||p===6)aim(5,0.2,T.sp);else if(p===7)ring(10,s*0.37,T.sp*0.7);}
    else{if(p===0&&player){const px=clamp(player.x,120,W-120),py=clamp(player.y,200,H-90),tw=t,ta=t+SPB*T.wn;dive={tw,ta,tb:ta+SPB*0.5,te:ta+SPB*1.5,px,py};hazards.push(DiveMark(HX,HY,px,py,tw,ta));}
      else if(p===5)fanW(t,5,0.28,T.sp*0.9);else if(p===6){ring(14,s*0.33,T.sp*0.75);}else if(p===7)aim(5,0.2,T.sp);}
  },
  draw(t){const gr=grow(t),ch=t>=tc&&t<tx;let jx=0,jy=0,s=1;if(ch){const k=(t-tc)/(tx-tc);s=1+0.3*k;jx=(Math.random()*2-1)*7*k;jy=(Math.random()*2-1)*7*k;}
    g.save();g.translate(jx,jy);g.globalAlpha=t<ts+2*SPB?0.45:1;

    g.fillStyle=PINK;g.shadowColor=PINK;g.shadowBlur=20;for(let i=-1;i<=1;i++){const w2=Math.sin(t*6+i)*10;g.beginPath();g.moveTo(x-12+i*10,y+20);g.quadraticCurveTo(x+i*30+w2,y+80,x+i*44+w2,y+130+Math.abs(i)*-20);g.quadraticCurveTo(x+i*18,y+70,x+12+i*10,y+20);g.fill();}
    // الجناحين
    for(const sd of [-1,1]){const[rx,ry]=root(sd),a=wingA(t,sd);g.save();g.translate(rx,ry);g.rotate(a);for(let k=0;k<5;k++){const L=WL*(1-k*0.13)*s;g.save();g.rotate(k*0.13*sd);g.beginPath();g.moveTo(0,-8);g.quadraticCurveTo(L*0.5,-24+k*4,L,0);g.quadraticCurveTo(L*0.5,14,0,10);g.fill();g.restore();}g.restore();}

  hit(p,t){if(t<ts+2*SPB||t>=tc)return false;if(Math.hypot((p.x-x)/(30+p.r),(p.y-y)/(46+p.r))<1||Math.hypot(p.x-x,p.y-y+52)<20+p.r)return true;
    for(const sd of [-1,1]){const[rx,ry]=root(sd),a=wingA(t,sd);if(obbHit(p.x,p.y,p.r-1,rx+Math.cos(a)*WL*0.5,ry+Math.sin(a)*WL*0.5,WL*0.5,12,a))return true;}return false;}};}

  /* ---------- القسم الأول (٠:٣٣ – ١:٠٩) ---------- */

  for(let k=30;k<34;k++){const b=k*4;gliss(b,k%2?-1:1,2+Math.floor(R()*11),0.22,T);toastP(b+2,k%2===0,T,10);fw(b+3,k%2?W*0.7:W*0.3,H*0.3,10,T);}

  for(let k=38;k<49;k++){const b=k*4;if(k<48){keyP(b+1,T);keyP(b+1,T,0.8,1);keyP(b+3,T,0.8,k%2?2:-2);keyP(b+3,T,0.8,k%2?3:-3);}if(k<48)fwP(b+2,10,T);}
  E.sort((a,b)=>a.b-b.b);return E;
}

function heartPath(s){g.beginPath();g.moveTo(0,0.8*s);g.bezierCurveTo(-1.2*s,0,-0.6*s,-1.0*s,0,-0.35*s);g.bezierCurveTo(0.6*s,-1.0*s,1.2*s,0,0,0.8*s);g.closePath();}

  b.draw=function(){rot+=sp*0.016;g.save();g.translate(this.x,this.y);g.rotate(rot);const s=this.r*1.5*(1+0.12*pulse);g.fillStyle=PINK;g.shadowColor=PINK;g.shadowBlur=10;g.beginPath();g.moveTo(0,-s);g.lineTo(s*0.8,s*0.7);g.lineTo(-s*0.6,s*0.5);g.closePath();g.fill();g.restore();};return b;}
function HalfHeart(x,y,vx,vy,s,side){let rot=0;return{x,y,

function Frame(x,y,w,h,tw,ta,sp){return{

  draw(t){const k=clamp((t-tw)/(ta-tw),0,1);g.save();g.translate(x,y);g.globalAlpha=Math.min(1,k*3);g.strokeStyle=GREY+'0.75)';g.lineWidth=4;g.strokeRect(-w/2,-h/2,w,h);g.lineWidth=2;g.strokeRect(-w/2+10,-h/2+10,w-20,h-20);
    g.save();heartPath(Math.min(w,h)*0.22);g.strokeStyle=GREY+'0.5)';g.stroke();g.restore();
    g.fillStyle=`rgba(255,42,109,${0.05+0.15*k})`;g.fillRect(-w/2,-h/2,w,h);
    if(k>0.3){g.strokeStyle='rgba(255,255,255,0.85)';g.lineWidth=2;const n=Math.floor(k*6);for(let i=0;i<n;i++){const a=i*1.1+0.4;g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(a)*w*0.25,Math.sin(a)*h*0.2);g.lineTo(Math.cos(a+0.3)*w*0.48,Math.sin(a+0.3)*h*0.45);g.stroke();}}
    g.restore();g.globalAlpha=1;},
  hit(){return false;}};}
// ===== تشققات الأرض =====
function Crack(x,y,tw,ta,te,n=5,len=300){const P=[];for(let b=0;b<n;b++){let a=b*TAU/n+rnd()*0.6,px=x,py=y;const seg=[[px,py]];for(let i=0;i<6;i++){a+=(rnd()*2-1)*0.5;px+=Math.cos(a)*len/6;py+=Math.sin(a)*len/6;seg.push([px,py]);}P.push(seg);}
  const gr=t=>clamp((t-ta)/0.12,0,1);
  return{
  update(t){if(t>te+0.25)this.dead=true;},
  draw(t){const act=t>=ta&&t<te,k=t<ta?clamp((t-tw)/(ta-tw),0,1):1;g.lineJoin='round';g.lineCap='round';
    g.strokeStyle=t<ta?`rgba(255,42,109,${0.2+0.45*k})`:PINK;g.lineWidth=t<ta?2:(t<te?10*(1+0.12*pulse):10*Math.max(0,1-(t-te)/0.25));if(act){g.shadowColor=PINK;g.shadowBlur=14;}
    for(const s of P){const m=t<ta?Math.ceil(k*6):Math.ceil(gr(t)*6);g.beginPath();g.moveTo(s[0][0],s[0][1]);for(let i=1;i<=m;i++)g.lineTo(s[i][0],s[i][1]);g.stroke();}g.shadowBlur=0;},
  hit(p,t){if(t<ta||t>=te)return false;const m=Math.ceil(gr(t)*6);for(const s of P)for(let i=1;i<=m;i++)if(segDist(p.x,p.y,s[i-1],s[i])<5+p.r)return true;return false;}};}
// ===== خط نبض القلب: يرسم من اليسار لليمين مع نبضات على الإيقاع =====
function ECG(y,t0,t1,te,spikes,amp,tw){const N=160,P=[];
  const off=x=>{let v=0;for(const sx of spikes){const d=x-sx;if(d>-30&&d<-12)v+=amp*0.15*Math.sin((d+30)/18*Math.PI);else if(d>=-12&&d<0)v-=amp*(1-(-d)/12);else if(d>=0&&d<14)v+=amp*0.45*(1-d/14);}return v;};
  for(let i=0;i<=N;i++){const x=i*W/N;P.push([x,y+off(x)]);}
  const head=t=>clamp((t-t0)/(t1-t0),0,1);
  return{
  update(t){if(t>te+0.3)this.dead=true;},
  draw(t){g.lineJoin='round';g.lineCap='round';
    if(t<t0){const k=clamp((t-tw)/(t0-tw),0,1);g.strokeStyle=`rgba(255,42,109,${0.15+0.4*k})`;g.lineWidth=2;g.setLineDash([6,8]);g.beginPath();g.moveTo(P[0][0],P[0][1]);for(const q of P)g.lineTo(q[0],q[1]);g.stroke();g.setLineDash([]);return;}
    const m=Math.floor(head(t)*N),a=t<te?1:Math.max(0,1-(t-te)/0.3);g.globalAlpha=a;g.strokeStyle=PINK;g.lineWidth=7;g.shadowColor=PINK;g.shadowBlur=14;g.beginPath();g.moveTo(P[0][0],P[0][1]);for(let i=1;i<=m;i++)g.lineTo(P[i][0],P[i][1]);g.stroke();g.shadowBlur=0;
    if(t<t1){g.fillStyle='#fff';circle(P[m][0],P[m][1],7);}g.globalAlpha=1;},
  hit(p,t){if(t<t0||t>=te)return false;const m=Math.floor(head(t)*N);for(let i=1;i<=m;i++)if(segDist(p.x,p.y,P[i-1],P[i])<4+p.r)return true;return false;}};}

// ===== الزعيم: القلب المكسور =====
// يدخل قلب كامل، ينشق نصين يلفون ويتصافقون عليك (وتتشقق الأرض)، يربطهم خيط يلف معهم،
// يقطرون دموع، وفي الآخر يرجعون يتجمعون وينكسر القلب للأبد
function BrokenHeart(ts,te,T){
  const cx=W/2,cy=H/2,S=85,RX=300,RY=190,wv=0.9,split=ts+2*SPB;let lastS=-1,ex=false,clap=null,thread=null;const P={};
  const orb=(t,side)=>{const a=wv*(t-ts),k=clamp((t-split)/SPB,0,1);return[cx+side*Math.cos(a)*RX*k,cy+side*Math.sin(a)*RY*k];};
  const lerp=(p,q,k)=>[p[0]+(q[0]-p[0])*k,p[1]+(q[1]-p[1])*k];
  const pos=(t,side)=>{const o=orb(t,side);
    if(t>te-SPB)return lerp(o,[cx,cy],Math.pow(clamp((t-(te-SPB))/SPB,0,1),2));
    if(clap&&t>=clap.t0&&t<clap.tr){const C=clap,near=[C.x+side*120,C.y],hit=[C.x+side*34,C.y];
      if(t<C.ta)return lerp(o,near,1-Math.pow(1-clamp((t-C.t0)/(C.ta-C.t0-0.08),0,1),3));
      if(t<C.ta+0.08)return lerp(near,hit,(t-C.ta)/0.08);
      if(t<C.te)return hit;
      return lerp(hit,o,clamp((t-C.te)/(C.tr-C.te),0,1));}
    return o;};
  const shoot=(side,n,spr,sp)=>{if(!player)return;const[x,y]=P[side];const a0=Math.atan2(player.y-y,player.x-x);for(let k=0;k<n;k++){const a=a0+(k-(n-1)/2)*spr;hazards.push(Tear(x,y,Math.cos(a)*sp,Math.sin(a)*sp));}};
  return{
  update(t){P[-1]=pos(t,-1);P[1]=pos(t,1);
    if(clap&&!clap.cracked&&t>=clap.ta){clap.cracked=true;hazards.push(Crack(clap.x,clap.y,t,t+SPB*0.6,t+SPB*1.1,5,260));shake=Math.max(shake,10);rumble(150,0.7,0.5);}
    if(t>=te&&!ex){ex=true;for(let i=0;i<28;i++){const a=i*TAU/28;hazards.push(Tear(cx,cy,Math.cos(a)*215,Math.sin(a)*215));}for(let i=0;i<10;i++){const a=i*TAU/10;hazards.push(ShardTri(cx,cy,Math.cos(a)*280,Math.sin(a)*280,10));}
      burst(cx,cy,PINK,80,560);burst(cx,cy,'#fff',40,460);shake=28;flash=0.75;rumble(600,1,1);hazards.push(FadeHeart(t+0.6,t+5));this.dead=true;return;}
    if(t<split+SPB)return;
    const s=Math.floor(BT(t)*4+1e-6);if(s===lastS)return;lastS=s;const bar=Math.floor(s/16),p=s%16;
    if(t>te-2*SPB)return;
    const busy=clap&&t<clap.tr,thr=thread&&t<thread.te;
    if(bar<75){
      if(p===8&&bar%2===0&&player)clap={x:clamp(player.x,160,W-160),y:clamp(player.y,100,H-100),t0:t,ta:t+SPB*T.wn,te:t+SPB*(T.wn+0.5),tr:t+SPB*(T.wn+1.5)};
      if(p===0&&!busy){shoot(-1,1,0,T.sp);shoot(1,1,0,T.sp);}
      else if(p===4&&!busy)shoot(bar%2?1:-1,3,0.22,T.sp*0.95);
    }else if(bar<81){
      if(p===0&&bar%2===1)thread={tw:t,ta:t+SPB*T.wn,te:t+SPB*(T.wn+4)};
      if(p%4===0&&t>=split){for(const side of[-1,1])hazards.push(Tear(P[side][0],P[side][1]+30,0,T.sp*0.8));}
      if(p===8&&bar%2===0&&!thr)shoot(bar%4?1:-1,3,0.25,T.sp*0.9);
    }else{
      if(p===0&&player&&t<te-5*SPB)clap={x:clamp(player.x,160,W-160),y:clamp(player.y,100,H-100),t0:t,ta:t+SPB*T.wn,te:t+SPB*(T.wn+0.4),tr:t+SPB*(T.wn+1.4)};
      if(p===8)shoot(bar%2?1:-1,3,0.22,T.sp);
    }
  },
  draw(t){const sc=clamp((t-ts)/(1.5*SPB),0,1),act=t>=split;
    if(!act){g.save();g.translate(cx,cy);g.scale(sc*(1+0.08*pulse),sc*(1+0.08*pulse));g.globalAlpha=0.5;g.fillStyle=PINK;g.shadowColor=PINK;g.shadowBlur=30;heartPath(S);g.fill();g.restore();g.globalAlpha=1;return;}
    const[a1,a2]=[pos(t,-1),pos(t,1)];
    if(thread&&t>=thread.tw&&t<thread.te+0.2){const on=t>=thread.ta&&t<thread.te;g.strokeStyle=on?PINK:`rgba(255,42,109,${0.25+0.4*clamp((t-thread.tw)/(thread.ta-thread.tw),0,1)})`;g.lineWidth=on?8*(1+0.15*pulse):2;if(!on)g.setLineDash([8,8]);if(on){g.shadowColor=PINK;g.shadowBlur=16;}g.beginPath();g.moveTo(a1[0],a1[1]);g.lineTo(a2[0],a2[1]);g.stroke();g.setLineDash([]);g.shadowBlur=0;}
    if(clap&&t>=clap.t0&&t<clap.ta){g.strokeStyle='rgba(255,42,109,0.5)';g.lineWidth=2;g.setLineDash([8,10]);for(const q of[a1,a2]){g.beginPath();g.moveTo(q[0],q[1]);g.lineTo(clap.x,clap.y);g.stroke();}g.setLineDash([]);
      g.strokeStyle='rgba(255,42,109,0.9)';g.lineWidth=3;g.beginPath();g.moveTo(clap.x-14,clap.y-14);g.lineTo(clap.x+14,clap.y+14);g.moveTo(clap.x+14,clap.y-14);g.lineTo(clap.x-14,clap.y+14);g.stroke();}
    for(const side of[-1,1]){const[x,y]=side<0?a1:a2;g.save();g.translate(x,y);g.scale(1+0.08*pulse,1+0.08*pulse);g.shadowColor=PINK;g.shadowBlur=30;g.fillStyle=PINK;halfPath(S,side);g.fill();g.shadowBlur=0;g.fillStyle='#000';circle(side*0.4*S,-0.2*S,0.12*S);g.restore();}},
  hit(p,t){if(t<split)return false;for(const side of[-1,1]){const[x,y]=pos(t,side);if(Math.hypot(p.x-x-side*0.35*S,p.y-y+0.1*S)<0.52*S+p.r-2)return true;}
    if(thread&&t>=thread.ta&&t<thread.te&&segDist(p.x,p.y,pos(t,-1),pos(t,1))<4+p.r)return true;return false;}};}

/* ================= مرحلة: ليش ضيعت الوفا (اختيار Gampet) =================
   كل ضربة متتبعة لحالها (تسجيل حي). مشاهد المرحلة:
   ٠ القلب الرمادي → ٢٤ ينكسر | ٢٦ القلوب المتناثرة | ٥٦ ستارة الدموع والتصفيق | ٨٨ أقفاص السلاسل
   ١١٢ الشموع (كلمة الشموع) | ١٤٧ الدمعة الكبيرة (كلمة الدموع) | ١٤٨ حفظ ← العيون الباكية
   ٢٠٨ الذكريات المكسورة | ٢٤٠ نبض القلب | ٢٧٢ الخط المستقيم | ٢٧٦ حفظ ← الزعيم | ٣٣٦ ينكسر للأبد */
let gloom=0,gloomT=0;
function buildFriend1(){
  const E=[],R=mulberry32(902),ev=(b,f)=>E.push({b,f});
  const rx=(a=140,b=W-140)=>a+R()*(b-a),ry=(a=120,b=H-120)=>a+R()*(b-a);
  const TI=ezT([{sp:265,wn:1.6,gap:200},{sp:285,wn:1.5,gap:175},{sp:300,wn:1.45,gap:160}]);
  const heart=(hit,x,y,T,s=50,life=1.5,ang=0)=>ev(hit-T.wn,()=>hazards.push(HeartBomb(x,y,s,B(hit-T.wn),B(hit),B(hit+life),T.sp*0.85,ang)));
  const clap=(hit,axis,T,c,hold=0.5)=>{const cc=c!==undefined?c:(axis==='V'?rx(220,W-220):ry(150,H-150));ev(hit-T.wn,()=>hazards.push(Clap(axis,cc,T.gap,B(hit-T.wn),B(hit),B(hit+hold))));};
  const clapP=(hit,axis,T,hold=0.5)=>ev(hit-T.wn,()=>{const c=axis==='V'?clamp((player?player.x:W/2)+(R()*2-1)*200,220,W-220):clamp((player?player.y:H/2)+(R()*2-1)*150,150,H-150);hazards.push(Clap(axis,c,T.gap,B(hit-T.wn),B(hit),B(hit+hold)));});
  const cage=(hit,T,rad=140)=>{const a0=R()*TAU;ev(hit-T.wn,()=>{const px=clamp(player?player.x:W/2,200,W-200),py=clamp(player?player.y:H/2,170,H-170);for(let k=0;k<3;k++){const n=a0+k*TAU/3;hazards.push(Chain(px+Math.cos(n)*rad,py+Math.sin(n)*rad,n+Math.PI/2,B(hit-T.wn),B(hit),B(hit+0.8),T.sp*0.55));}});};
  const chain=(hit,x,y,ang,T)=>ev(hit-T.wn,()=>hazards.push(Chain(x,y,ang,B(hit-T.wn),B(hit),B(hit+0.6),T.sp*0.55)));
  const frame=(hit,x,y,T,w=150,h=110)=>ev(hit-2,()=>hazards.push(Frame(x,y,w,h,B(hit-2),B(hit),T.sp*0.85)));
  const frameP=(hit,T)=>{const jx=(R()*2-1)*120,jy=(R()*2-1)*90;ev(hit-2,()=>{const x=clamp((player?player.x:W/2)+jx,100,W-100),y=clamp((player?player.y:H/2)+jy,80,H-80);hazards.push(Frame(x,y,140,100,B(hit-2),B(hit),T.sp*0.85));});};
  const crack=(hit,x,y,T,n=5)=>ev(hit-T.wn,()=>hazards.push(Crack(x,y,B(hit-T.wn),B(hit),B(hit+0.6),n,300)));
  const ecg=(b0,b1,y,T,amp=110)=>{ev(b0-T.wn,()=>{const t0=B(b0),t1=B(b1),sp=[];for(let b=Math.ceil(b0);b<b1;b++)sp.push(W*(B(b)-t0)/(t1-t0));hazards.push(ECG(y,t0,t1,B(b1+1),sp,amp,B(b0-T.wn)));});};

  /* ---------- القسم الأول ---------- */
  let T=TI[0];
  E.push({b:0,keep:1,f:()=>hazards.push(BgRain(B(0),B(340),70))});
  ev(2,()=>hazards.push(IntroHeart(B(2),B(24),T.sp*0.85)));
  // ٢٦–٥٥ القلوب المتناثرة: قطري ← قطري معاكس ← دائرة
  for(let i=0;i<4;i++)heart(28+i*2,180+i*300,120+i*160,T,44,1.5,Math.PI/4);
  for(let i=0;i<4;i++)heart(37+i*2,W-180-i*300,120+i*160,T,44,1.5,-Math.PI/4);
  for(let i=0;i<4;i++){const a=-Math.PI/2+i*TAU/4;heart(46+i*2,W/2+Math.cos(a)*300,H/2+Math.sin(a)*210,T,44,2,a+Math.PI/2);}
  // ٥٦–٨٧ ستارة الدموع والتصفيق
  const t56=B(56),t72=B(72);ev(56,()=>hazards.push(TearCurtain(t56,t72,SPB*2,t=>W/2+Math.sin((t-t56)*0.9)*380,T.gap+40,T.sp*0.7,85)));
  clap(79,'V',T,W*0.35);heart(80,W/2,H/2,T,60,2);
  // ٨٨–١١١ أقفاص السلاسل
  cage(90,T,150);chain(94,W/2,H*0.3,0,T);chain(95,W/2,H*0.7,0,T);chain(102,W*0.3,H/2,Math.PI/2,T);chain(103,W*0.7,H/2,Math.PI/2,T);cage(106,T,150);chain(109,W/2,H/2,Math.PI/4,T);chain(110,W/2,H/2,-Math.PI/4,T);
  // ١١٢ الشموع: تشتعل ورا بعض، ترمي شرار، وتنطفي وحدة وحدة والظلام يزيد
  {const N=8;for(let i=0;i<N;i++){const a=-Math.PI/2+i*TAU/N,x=W/2+Math.cos(a)*450,y=H/2+30+Math.sin(a)*240,em=[];em.push(120+i*2);
    const tl=112+i*0.5,to=136+i;ev(tl-0.5,()=>hazards.push(Candle(x,y,B(tl),B(to),B(147),em.map(B),T.sp*0.75)));}}
  clap(131,'H',T,H/2);heart(140,W/2,H/2-20,T,55,2,Math.PI/2);
  // ١٤٧ "الدموع": دمعة كبيرة تطيح وتتناثر
  ev(145,()=>hazards.push(BigTear(W/2,H/2,B(145),B(147),T.sp*0.85)));
  /* ---------- القسم الثاني ---------- */
  T=TI[1];
  // ١٤٨–٢٠٧ العيون الباكية على الطبل
  const EX=[W*0.14,W*0.38,W*0.62,W*0.86];
  ev(148,()=>{const cr=[[],[],[],[]];
    for(let b=150;b<166;b++){cr[(b-150)%4].push(b);if(b%2)cr[3-(b-150)%4].push(b+0.5);}
    for(let b=166;b<182;b++){const m=(b-166)%4;if(m===0){cr[0].push(b);cr[3].push(b);}else if(m===2){cr[1].push(b);cr[2].push(b);}else cr[m===1?2:1].push(b);}
    for(let b=182;b<200;b++){if(b%4===0)for(let i=0;i<4;i++)if(i!==(b/4)%4)cr[i].push(b);if(b%4===2)cr[(b/2)%4].push(b+0.5);}
    for(let i=0;i<4;i++)hazards.push(CryEye(EX[i],B(149),B(203),cr[i].map(B),T.sp*0.95));});
  for(const b of [155,163,167,171,179,183,187,195,199])clapP(b,b%8===3?'H':'V',T,0.45);
  for(const b of [154,158,170,174,186,190])heart(b,rx(),ry(220,H-120),T,46,1.5,b%8===2?0:Math.PI/2);
  ev(201,()=>{});
  // ٢٠٨ الذكريات المكسورة
  frame(208,W/2,H/2,T,260,180);
  for(let k=0;k<7;k++){const b=212+k*4;frameP(b,T);crack(b+2,rx(),ry(),T,4);if(k%2)clapP(b+3,k%4===1?'V':'H',T,0.4);else frameP(b+2.5,T);}
  // ٢٤٠ نبض القلب: خطوط نبض ترسم على الإيقاع
  ecg(240,248,H*0.3,T);heart(244,W/2,H*0.7,T,50,1.5);ecg(248,256,H*0.7,T);heart(252,W/2,H*0.3,T,50,1.5);ecg(256,264,H*0.5,T,140);frameP(258,T);frameP(262,T);
  ecg(264,270,H*0.3,T,90);ecg(266,272,H*0.7,T,90);clapP(250,'V',T,0.4);clapP(261,'H',T,0.4);
  // ٢٧٢ الخط المستقيم... وبعده يرجع القلب
  ev(270,()=>hazards.push(ECG(H/2,B(272),B(275),B(275.6),[],0,B(270))));
  /* ---------- القسم الثالث (الزعيم) ---------- */
  T=TI[2];const TT=T;
  ev(276,()=>hazards.push(BrokenHeart(B(276),B(336),TT)));
  for(const b of [284,290,296,300,306,312,316,322])clapP(b,b%8===4?'H':'V',T,0.4);
  {const ta=B(302),tb=B(322);ev(302,()=>hazards.push(TearCurtain(ta,tb,SPB*2,t=>W/2+Math.sin((t-ta)*1.1)*400,T.gap+70,T.sp*0.65,95)));}
  for(const b of [290,312,326,330])crack(b,rx(),ry(),T,4);
  E.sort((a,b)=>a.b-b.b);return E;
}

function drawPerson(x,y,col,a=1,sc=1){g.save();g.translate(x,y);g.scale(sc,sc);g.globalAlpha=a;g.strokeStyle=col;g.fillStyle=col;g.lineWidth=3;g.lineCap='round';circle(0,-16,7);g.beginPath();g.moveTo(0,-9);g.lineTo(0,6);g.moveTo(-9,-3);g.lineTo(9,-3);g.moveTo(0,6);g.lineTo(-7,17);g.moveTo(0,6);g.lineTo(7,17);g.stroke();g.restore();g.globalAlpha=1;}
function Person(x,y,t0,tb,mode,T,o={}){let vx=0,vy=0,ang=rnd()*TAU,dash=null;const wn=SPB*T.wn,orbR=o.r||170,fade=o.fade;
  return{x,y,
  update(t,dt){
    if(fade!==undefined&&t>=fade+0.6){this.dead=true;return;}
    if(t<tb){if(!player)return;let tx,ty;if(o.follow){ang+=dt*0.7;tx=player.x+Math.cos(ang)*orbR;ty=player.y+Math.sin(ang)*orbR;}else{tx=o.tx!==undefined?o.tx:W/2;ty=o.ty!==undefined?o.ty:H/2;}
      const dx=tx-this.x,dy=ty-this.y,d=Math.hypot(dx,dy);const sp=Math.min(o.speed||120,d*2);this.x+=dx/(d||1)*sp*dt;this.y+=dy/(d||1)*sp*dt;return;}
    if(mode==='pop'){for(let i=0;i<6;i++){const a=i*TAU/6+0.3;hazards.push(Bullet(this.x,this.y,Math.cos(a)*T.sp*0.85,Math.sin(a)*T.sp*0.85,8));}burst(this.x,this.y,PINK,10);this.dead=true;return;}
    if(!dash){const a=player?Math.atan2(player.y-this.y,player.x-this.x):0;dash={vx:Math.cos(a)*T.sp*1.6,vy:Math.sin(a)*T.sp*1.6,te:t+0.5};}
    this.x+=dash.vx*dt;this.y+=dash.vy*dt;
    if(t>=dash.te){for(let i=0;i<4;i++){const a=i*TAU/4+Math.PI/4;hazards.push(Bullet(this.x,this.y,Math.cos(a)*T.sp*0.8,Math.sin(a)*T.sp*0.8,7));}burst(this.x,this.y,PINK,8);this.dead=true;}},
  draw(t){const fa=fade!==undefined?clamp(1-(t-fade)/0.6,0,1):1,ia=clamp((t-t0)/0.4,0,1);
    if(t<tb-wn)drawPerson(this.x,this.y,GREY+'0.75)',fa*ia);
    else if(t<tb){const on=Math.floor((t-(tb-wn))*12)%2===0;drawPerson(this.x,this.y,on?PINK:GREY+'0.75)',fa);if(on){g.strokeStyle='rgba(255,42,109,0.35)';g.lineWidth=2;g.beginPath();g.arc(this.x,this.y-2,26,0,TAU);g.stroke();}}
    else{g.save();g.shadowColor=PINK;g.shadowBlur=16;drawPerson(this.x,this.y,PINK,1,1.15);g.restore();}},
  hit(p,t){return t>=tb&&Math.hypot(p.x-this.x,p.y-this.y)<16+p.r;}};}
// ===== لوحة الشطرنج: "لعبت بحالي لعبة" =====
const CELL=120,BX=40;const cellC=(i,j)=>[BX+i*CELL+CELL/2,j*CELL+CELL/2];
function Board(t0,t1){return{update(t){if(t>t1+0.6)this.dead=true;},draw(t){const a=Math.min(1,(t-t0)/0.6,(t1+0.6-t)/0.6);if(a<=0)return;g.fillStyle=GREY+(0.05*a)+')';for(let i=0;i<10;i++)for(let j=0;j<6;j++)if((i+j)%2===0)g.fillRect(BX+i*CELL,j*CELL,CELL,CELL);g.strokeStyle=GREY+(0.12*a)+')';g.lineWidth=1;g.strokeRect(BX,0,CELL*10,CELL*6);},hit(){return false;}};}
function pieceShape(type,s){g.beginPath();
  if(type==='R'){g.moveTo(-s*0.45,s*0.5);g.lineTo(s*0.45,s*0.5);g.lineTo(s*0.35,-s*0.25);g.lineTo(s*0.45,-s*0.25);g.lineTo(s*0.45,-s*0.5);g.lineTo(s*0.25,-s*0.5);g.lineTo(s*0.25,-s*0.38);g.lineTo(s*0.08,-s*0.38);g.lineTo(s*0.08,-s*0.5);g.lineTo(-s*0.08,-s*0.5);g.lineTo(-s*0.08,-s*0.38);g.lineTo(-s*0.25,-s*0.38);g.lineTo(-s*0.25,-s*0.5);g.lineTo(-s*0.45,-s*0.5);g.lineTo(-s*0.45,-s*0.25);g.lineTo(-s*0.35,-s*0.25);g.closePath();}
  else if(type==='B'){g.ellipse(0,-s*0.1,s*0.24,s*0.36,0,0,TAU);g.moveTo(-s*0.4,s*0.5);g.lineTo(s*0.4,s*0.5);g.lineTo(s*0.25,s*0.25);g.lineTo(-s*0.25,s*0.25);g.closePath();g.moveTo(s*0.06,-s*0.6);g.arc(0,-s*0.56,s*0.07,0,TAU);}
  else if(type==='N'){g.moveTo(-s*0.4,s*0.5);g.lineTo(s*0.4,s*0.5);g.lineTo(s*0.3,-s*0.05);g.lineTo(s*0.05,-s*0.15);g.lineTo(s*0.35,0.02*s);g.lineTo(s*0.4,-s*0.2);g.lineTo(s*0.1,-s*0.55);g.lineTo(-s*0.15,-s*0.5);g.lineTo(-s*0.35,-s*0.1);g.lineTo(-s*0.2,s*0.15);g.closePath();}
  else{g.moveTo(-s*0.42,s*0.5);g.lineTo(s*0.42,s*0.5);g.lineTo(s*0.45,-s*0.35);g.lineTo(s*0.2,-s*0.05);g.lineTo(0,-s*0.5);g.lineTo(-s*0.2,-s*0.05);g.lineTo(-s*0.45,-s*0.35);g.closePath();}}
function ChessPiece(type,i,j,tw,ta,te,w=58){const[cx,cy]=cellC(i,j),KN=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]].map(([a,b])=>[i+a,j+b]).filter(([a,b])=>a>=0&&a<10&&b>=0&&b<6);
  const rook=type==='R'||type==='Q',bish=type==='B'||type==='Q';
  const lines=()=>{if(rook){g.fillRect(-2000,cy-w/2,4000,w);g.fillRect(cx-w/2,-2000,w,4000);}
    if(bish)for(const sg of[1,-1]){g.save();g.translate(cx,cy);g.rotate(sg*Math.PI/4);g.fillRect(-2000,-w/2,4000,w);g.restore();}
    if(type==='N')for(const[a,b]of KN){const[x,y]=cellC(a,b);g.fillRect(x-CELL/2+6,y-CELL/2+6,CELL-12,CELL-12);}};
  return{
  update(t){if(t>te+0.3)this.dead=true;},
  draw(t){const a=t<ta?clamp((t-tw)/(ta-tw),0,1):t<te?1:Math.max(0,1-(t-te)/0.3);
    if(t<ta){g.fillStyle=`rgba(255,42,109,${0.05+0.13*a})`;lines();}
    else if(t<te){g.save();g.shadowColor=PINK;g.shadowBlur=16;g.fillStyle=(t-ta)<0.08?'#fff':PINK;lines();g.restore();}
    g.save();g.translate(cx,cy+(t<ta?(1-a)*-30:0));g.globalAlpha=t<ta?0.4+0.5*a:a;pieceShape(type,78*(1+0.08*pulse));g.fillStyle=PINK;g.shadowColor=PINK;g.shadowBlur=14;g.fill();g.restore();g.globalAlpha=1;},
  hit(p,t){if(t<ta||t>=te)return false;const dx=p.x-cx,dy=p.y-cy,r=w/2+p.r-2;
    if(rook&&(Math.abs(dy)<r||Math.abs(dx)<r))return true;if(bish&&(Math.abs(dx-dy)/Math.SQRT2<r||Math.abs(dx+dy)/Math.SQRT2<r))return true;
    if(type==='N'){for(const[a,b]of KN){const[x,y]=cellC(a,b);if(Math.abs(p.x-x)<CELL/2-6+p.r&&Math.abs(p.y-y)<CELL/2-6+p.r)return true;}}
    return Math.hypot(dx,dy)<30+p.r;}};}

const R2=()=>rnd();
function Tower(x,n,tb,step,tf,dir,T){const bw=86,bh=84,h=n*bh,wn=SPB*T.wn,fallD=0.35,lie=SPB*0.6,piv=[x+dir*bw/2,H];
  const ang=t=>t<tf?0:dir*Math.PI/2*Math.min(1,Math.pow((t-tf)/fallD,2));
  const blocks=t=>Math.min(n,Math.floor((t-tb)/step)+1);
  return{
  update(t){if(t>=tf+fallD+lie){const a=ang(t),c=Math.cos(a),s=Math.sin(a);for(let k=0;k<n;k++){const lx=-dir*bw/2,ly=-(k+0.5)*bh,cx=piv[0]+lx*c-ly*s,cy=piv[1]+lx*s+ly*c;const out=-Math.PI/2+dir*(0.3+R2()*0.9);hazards.push(SqBullet(cx,cy,Math.cos(out)*T.sp*0.75,Math.sin(out)*T.sp*0.75,13));}burst(piv[0]+dir*h*0.5,H-40,PINK,20,300);shake=Math.max(shake,12);this.dead=true;}},
  draw(t){if(t<tb)return;const a=ang(t),warn=t>=tf-wn&&t<tf,act=t>=tf;
    if(warn){const k=(t-(tf-wn))/wn;g.fillStyle=`rgba(255,42,109,${0.06+0.16*k})`;g.beginPath();g.moveTo(piv[0],piv[1]);g.arc(piv[0],piv[1],h,dir>0?-Math.PI/2:Math.PI,dir>0?0:-Math.PI/2);g.closePath();g.fill();}
    g.save();g.translate(piv[0],piv[1]);g.rotate(a);const m=blocks(t);
    for(let k=0;k<m;k++){const flick=warn&&Math.floor(t*12)%2===0;g.fillStyle=act?PINK:flick?'rgba(255,42,109,0.85)':GREY+'0.55)';if(act){g.shadowColor=PINK;g.shadowBlur=14;}g.fillRect(dir>0?-bw:0,-(k+1)*bh+3,bw,bh-6);g.shadowBlur=0;}
    g.restore();},
  hit(p,t){if(t<tf||t>=tf+fallD+lie)return false;const a=ang(t),c=Math.cos(a),s=Math.sin(a);const lx0=-dir*bw/2,ly0=-h/2;const cx=piv[0]+lx0*c-ly0*s,cy=piv[1]+lx0*s+ly0*c;return obbHit(p.x,p.y,p.r,cx,cy,bw/2,h/2,a);}};}

function lockShape(x,y,s){g.save();g.translate(x,y);g.lineWidth=s*0.16;g.beginPath();g.arc(0,-s*0.2,s*0.32,Math.PI,0);g.stroke();rr(-s*0.48,-s*0.2,s*0.96,s*0.75,s*0.12);g.fill();g.fillStyle='#000';circle(0,s*0.12,s*0.09);g.fillRect(-s*0.04,s*0.12,s*0.08,s*0.2);g.restore();}
function Lock(x,y,tw,ta,te,s=56){return{
  update(t){if(t>te+0.3)this.dead=true;if(!this.l&&t>=ta){this.l=true;shake=Math.max(shake,7);burst(x,y,PINK,10,220);}},
  draw(t){const k=t<ta?clamp((t-tw)/(ta-tw),0,1):1,a=t<te?1:Math.max(0,1-(t-te)/0.3);g.globalAlpha=t<ta?0.25+0.45*k:a;g.strokeStyle=PINK;g.fillStyle=PINK;if(t>=ta){g.shadowColor=PINK;g.shadowBlur=16;}lockShape(x,y-(t<ta?(1-k)*80:0),s*(t<ta?1.3-0.3*k:1+0.08*pulse));g.shadowBlur=0;g.globalAlpha=1;},
  hit(p,t){return t>=ta&&t<te&&Math.hypot(p.x-x,p.y-y)<s*0.5+p.r;}};}
function Link(ax,ay,bx,by,tw,ta,te){const L=Math.hypot(bx-ax,by-ay),ang=Math.atan2(by-ay,bx-ax);return{
  update(t){if(t>te+0.3)this.dead=true;},
  draw(t){g.save();g.translate(ax,ay);g.rotate(ang);if(t<ta){const k=clamp((t-tw)/(ta-tw),0,1);g.strokeStyle=`rgba(255,42,109,${0.2+0.5*k})`;g.lineWidth=2;for(let d=0;d<L;d+=34)g.strokeRect(d,-5,22,10);}
    else{const a=t<te?1:Math.max(0,1-(t-te)/0.3),q=clamp((t-ta)/0.12,0,1);g.globalAlpha=a;g.shadowColor=PINK;g.shadowBlur=14;g.strokeStyle=PINK;g.lineWidth=6;for(let d=0;d<L*q;d+=34){rr(d,-8,26,16,7);g.stroke();}g.globalAlpha=1;}g.restore();},
  hit(p,t){if(t<ta||t>=te)return false;return segDist(p.x,p.y,[ax,ay],[bx,by])<9+p.r;}};}

function Squeeze(x0,y0,x1,y1,tw,ta,te){const cl=t=>t<ta?0:t<ta+0.12?(t-ta)/0.12:t<te?1:clamp(1-(t-te)/0.25,0,1);return{
  update(t){if(t>te+0.3)this.dead=true;},
  draw(t){if(t<ta){const k=clamp((t-tw)/(ta-tw),0,1);g.fillStyle=`rgba(255,42,109,${0.04+0.12*k})`;g.fillRect(0,0,W,y0);g.fillRect(0,y1,W,H-y1);g.fillRect(0,y0,x0,y1-y0);g.fillRect(x1,y0,W-x1,y1-y0);g.strokeStyle='rgba(255,42,109,0.9)';g.lineWidth=3;g.setLineDash([12,8]);g.strokeRect(x0,y0,x1-x0,y1-y0);g.setLineDash([]);return;}
    const k=cl(t);g.save();g.shadowColor=PINK;g.shadowBlur=18;g.fillStyle=(t-ta)<0.1?'#fff':PINK;g.fillRect(0,0,W,y0*k);g.fillRect(0,H-(H-y1)*k,W,(H-y1)*k);g.fillRect(0,0,x0*k,H);g.fillRect(W-(W-x1)*k,0,(W-x1)*k,H);g.restore();},
  hit(p,t){if(cl(t)<0.9||t>=te)return false;return p.x-p.r<x0||p.x+p.r>x1||p.y-p.r<y0||p.y+p.r>y1;}};}

function BackStab(x,y,tw,ta,sp,n=3){return{
  update(t){if(t>=ta){if(player){const a0=Math.atan2(player.y-y,player.x-x);for(let k=0;k<n;k++){const a=a0+(k-(n-1)/2)*0.2;hazards.push(SqBullet(x,y,Math.cos(a)*sp,Math.sin(a)*sp,10));}}burst(x,y,PINK,8);this.dead=true;}},
  draw(t){const k=clamp((t-tw)/(ta-tw),0,1);g.save();g.translate(x,y);g.rotate(Math.PI/4);g.strokeStyle=`rgba(255,42,109,${0.3+0.6*k})`;g.lineWidth=3;const s=26-12*k;g.strokeRect(-s,-s,2*s,2*s);g.restore();},hit(){return false;}};}

function Traitor(ts,turn,te,T){let x=W/2,y=H/2,lastS=-1,ex=false,fx=1,fy=0,dash=null,trail=[];const S=30;
  const behind=()=>{if(!player)return[W/2,H/2];return[clamp(player.x-fx*330,40,W-40),clamp(player.y-fy*330,40,H-40)];};
  return{
  update(t,dt){
    if(player&&Math.hypot(player.fx,player.fy)>0.1){fx=player.fx;fy=player.fy;}
    if(dash&&t>=dash.ta&&t<dash.te){const k=(t-dash.ta)/(dash.te-dash.ta);x=dash.x0+(dash.x1-dash.x0)*k;y=dash.y0+(dash.y1-dash.y0)*k;trail.push({x,y,t});}
    else if(!(dash&&t<dash.ta)&&player){const[tx,ty]=t<turn?[player.x-fx*150,player.y-fy*150]:behind();const sp=t<turn?2.2:1.4;x+=(clamp(tx,40,W-40)-x)*Math.min(1,dt*sp);y+=(clamp(ty,40,H-40)-y)*Math.min(1,dt*sp);}
    trail=trail.filter(q=>t-q.t<0.55);
    if(t>=te&&!ex){ex=true;for(let i=0;i<24;i++){const a=i*TAU/24;hazards.push(SqBullet(x,y,Math.cos(a)*220,Math.sin(a)*220,10));}burst(x,y,PINK,70,520);burst(x,y,'#fff',35,420);shake=26;flash=0.7;rumble(500,1,1);this.dead=true;return;}
    if(t<turn+SPB)return;
    const s=Math.floor(BT(t)*4+1e-6);if(s===lastS)return;lastS=s;const bar=Math.floor(s/16),p=s%16;if(t>te-SPB)return;
    if(p===0){for(let i=0;i<8;i++){const a=bar*0.4+i*TAU/8;hazards.push(SqBullet(x,y,Math.cos(a)*T.sp*0.8,Math.sin(a)*T.sp*0.8,9));}}
    else if(p===4||p===12){const[bx,by]=behind();hazards.push(BackStab(bx,by,t,t+SPB*T.wn,T.sp,3));}
    if((p===8||(p===0&&bar%2===1))&&player&&!(dash&&t<dash.te+0.2)){const a=Math.atan2(player.y-y,player.x-x),d=Math.hypot(player.x-x,player.y-y)+220;dash={x0:x,y0:y,x1:clamp(x+Math.cos(a)*d,30,W-30),y1:clamp(y+Math.sin(a)*d,30,H-30),ta:t+SPB*T.wn,te:t+SPB*T.wn+0.32};}
  },
  draw(t){const pre=t<turn,g0=clamp((t-ts)/(2*SPB),0,1),fl=t>=turn-SPB*1.5&&t<turn&&Math.floor(t*12)%2===0;
    for(const q of trail){const a=1-(t-q.t)/0.55;g.globalAlpha=a*0.7;g.fillStyle=PINK;g.fillRect(q.x-S*0.6,q.y-S*0.6,S*1.2,S*1.2);}g.globalAlpha=1;
    if(dash&&t<dash.ta){g.strokeStyle='rgba(255,42,109,0.6)';g.lineWidth=3;g.setLineDash([10,8]);g.beginPath();g.moveTo(dash.x0,dash.y0);g.lineTo(dash.x1,dash.y1);g.stroke();g.setLineDash([]);}
    g.save();g.translate(x,y);const s=S*(0.4+0.6*g0)*(1+0.08*pulse);g.rotate(pre?Math.sin(t*2)*0.1:t*1.5);
    const col=pre&&!fl?GREY+'0.8)':PINK;g.fillStyle=col;if(!pre||fl){g.shadowColor=PINK;g.shadowBlur=24;}g.fillRect(-s,-s,2*s,2*s);g.shadowBlur=0;
    g.fillStyle='#000';if(pre&&!fl){circle(-s*0.35,-s*0.15,s*0.13);circle(s*0.35,-s*0.15,s*0.13);}else{g.beginPath();g.moveTo(-s*0.55,-s*0.35);g.lineTo(-s*0.15,-s*0.1);g.lineTo(-s*0.55,-s*0.05);g.fill();g.beginPath();g.moveTo(s*0.55,-s*0.35);g.lineTo(s*0.15,-s*0.1);g.lineTo(s*0.55,-s*0.05);g.fill();}
    g.restore();},
  hit(p,t){if(t<turn)return false;if(Math.hypot(p.x-x,p.y-y)<S+p.r-2)return true;for(const q of trail)if(t-q.t<0.4&&Math.hypot(p.x-q.x,p.y-q.y)<S*0.6+p.r)return true;return false;}};}

/* ================= مرحلة: وعد مني (اختيار ixGha) =================
   ٩٦ ضربة بالدقيقة، المقطع من ٠:٣٠ إلى ٢:٠٠ من الأغنية.
   ٠ الناس | ١٦ "لعبة" | ٣٢ "الوفي وخان" | ٤٤ "بنيان" | ٥٦ تكرار المقطع
   ٧٢ حفظ ← "وعد مني وعد" | ٨٠ "ما أثق أبد" | ٨٨ "ولا أنطي مجال" | ٩٦ "كل شي وله حد"
   ١١٢ حفظ ← "ولا واحد" ← الصاحب الخاين | ١٣٨ ينهزم */
function buildFriend2(){
  const E=[],R=mulberry32(1203),ev=(b,f)=>E.push({b,f});
  const rx=(a=140,b=W-140)=>a+R()*(b-a),ry=(a=120,b=H-120)=>a+R()*(b-a),ri=n=>Math.floor(R()*n);
  const TI=ezT([{sp:265,wn:1.5},{sp:285,wn:1.4},{sp:300,wn:1.35}]);
  const piece=(hit,type,i,j,T,dur=0.6)=>ev(hit-T.wn,()=>hazards.push(ChessPiece(type,i,j,B(hit-T.wn),B(hit),B(hit+dur))));
  const pieceP=(hit,type,T,dur=0.6)=>{const oi=ri(5)-2,oj=ri(3)-1;ev(hit-T.wn,()=>{const i=clamp(Math.floor(((player?player.x:W/2)-BX)/CELL)+oi,0,9),j=clamp(Math.floor((player?player.y:H/2)/CELL)+oj,0,5);hazards.push(ChessPiece(type,i,j,B(hit-T.wn),B(hit),B(hit+dur)));});};
  const crowd=(b,n,tb0,gap,mode,T,o={})=>{const ang0=R()*TAU;ev(b,()=>{for(let k=0;k<n;k++){const a=ang0+k*TAU/n,px=clamp((player?player.x:W/2)+Math.cos(a)*420,30,W-30),py=clamp((player?player.y:H/2)+Math.sin(a)*300,30,H-30);hazards.push(Person(px,py,B(b),B(tb0+k*gap),mode,T,Object.assign({follow:true,r:150+(k%2)*60},o)));}});};
  const tower=(x,n,b0,stepB,fallB,dir,T)=>ev(b0,()=>hazards.push(Tower(x,n,B(b0),stepB*SPB,B(fallB),dir,T)));
  const lock=(hit,x,y,T,dur=6)=>ev(hit-T.wn,()=>hazards.push(Lock(x,y,B(hit-T.wn),B(hit),B(hit+dur))));
  const link=(hit,a,b,T,dur)=>ev(hit-T.wn,()=>hazards.push(Link(a[0],a[1],b[0],b[1],B(hit-T.wn),B(hit),B(hit+dur))));

// ورقة تقويم تنشق وتطير وهي تتمايل
