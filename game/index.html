  const wall=(hit,gc,T,sp=420,dir='L')=>ev(hit-1,()=>hazards.push(GapWall(dir,gc,T.gap,36,sp,B(hit-1),B(hit))));
  const cannon=(hit,x,y,ang,T,dur=0.6,bw=46)=>ev(hit-T.wn,()=>hazards.push(Cannon(x,y,ang,B(hit-T.wn),B(hit),B(hit+dur),bw)));
  const cannonP=(hit,x,y,T)=>ev(hit-T.wn,()=>{const a=player?Math.atan2(player.y-y,player.x-x):Math.atan2(H/2-y,W/2-x);hazards.push(Cannon(x,y,a,B(hit-T.wn),B(hit),B(hit+0.6),44));});
  const dash=(hit,dir,T,warn=3,tag=false,sp=950)=>ev(hit-warn,()=>hazards.push(DashWall(dir,B(hit-warn),B(hit),sp,26,tag)));
  const box=(hit,w,h,T,dur)=>ev(hit-T.wn,()=>hazards.push(Squeeze(W/2-w/2,H/2-h/2,W/2+w/2,H/2+h/2,B(hit-T.wn),B(hit),B(hit+dur))));
  const seeker=(hit,x,y,T,life=6)=>ev(hit-1,()=>hazards.push(Seeker(x,y,B(hit-1),B(hit),B(hit+life),T.sp*0.5,2.2)));
  const CR=[[30,30,Math.PI/4],[W-30,30,Math.PI*3/4],[W-30,H-30,-Math.PI*3/4],[30,H-30,-Math.PI/4]];

  /* ---------- القسم الأول ---------- */
  let T=TI[0];
  // ٠:٠٠ المقدمة: تعليم العدّاد والمرايا
  tile(6,2,1,3,T);tile(12,5,2,3,T);tile(18,1,2,4,T);tile(18,6,1,2,T);tile(24,3,0,3,T);tile(24,4,3,3,T);tile(26,0,0,2,T);tile(26,7,3,2,T);
  mirV(28,W*0.3,T,60);mirH(30,H*0.3,T,60);
  // ٠:١٦ الممر: جدران بفتحات ترسم طريق متعرج

// فقاعة كلام (كلام الناس): مكانها معادلة ثابتة بالوقت، فتمشي نفس الشي كل مرة
function Bubble(x0,y0,vx,vy,t0,o={}){const ax=o.ax||0,ay=o.ay||0,r=o.r||11,sw=o.sw||0,sf=o.sf||3,ph=o.ph||0,life=o.life||10,fl=vx>0?-1:1;

  update(t){if(t-t0>life)this.dead=true;else if(t-t0>0.6){const q=pos(t);if(q[0]<-120||q[0]>W+120||q[1]<-130||q[1]>H+130)this.dead=true;}},
  draw(t){if(t<t0)return;const[x,y]=pos(t),s=r*(1+0.15*pulse);g.save();g.translate(x,y);

// قلب يحترق ("يحرق قلبك"): يسخن ويرجف، وبعدين يولّع وتطلع منه شعل نار بكل الاتجاهات

// دبكة: رجل تنزل بقوة على عمود (من تحت أو من فوق)، وتطلع من الضربة موجتين على الأرض

// درويش يلف (التنورة): التنورة تدور وطرفها يضر، والطاقية رمادي. ang دالة بالوقت، وemit يطلع فقاعات من أطراف التنورة كل ضربة
function Tanoura(x,y,R,arms,w,ts,te,ang,emit){const grow=t=>clamp((t-ts)/(1.5*SPB),0,1),live=t=>t>=ts+1.5*SPB&&t<te;let lb=-1;return{

// "ريّح بالك": دائرة كبيرة تقفل عليك وفيها فتحة، اطلع منها من الفتحة
function RingSqueeze(x,y,r0,r1,tw,ta,te,th,gap,gs){const rad=t=>{const k=clamp((t-ta)/(te-ta),0,1);return r0+(r1-r0)*(k*(2-k));};return{

// دائرة تحميل: قطع تلف حول نقطة، المضيئة منها تضر
function HxSpin(x,y,R,tw,t0,t1,segs,on,w,rot,a0=0){const ang=t=>a0+rot*(t-t0),gw=0.07;

// الزعيم: الفيروس (جمجمة بكسل) — يختفي ويطلع بمكان ثاني، يرمي كود، عيونه ليزر، وفي الذروة يلف أشعة.
// يشحن قبل ما تنقطع الموسيقى، وينفجر بكسلات عند ٢:٣٩
const HX_SKULL=['....#####....','..#########..','.###########.','.###########.','###..###..###','###..###..###','#############','.#####.#####.','..#########..','..#.#.#.#.#..','..#########..','...#.#.#.#...'];
function HxSkull(ts,tc,tx,T,moves){

  const M=moves.map(([b,mx,my])=>({tw:B(b-2),ta:B(b),tb:B(b+0.25),x:mx,y:my}));
  const at=t=>{let px=W/2,py=-200,vis=true,mv=null;if(t<ts){return{px,py,vis:false,mv:null};}
    const k=clamp((t-ts)/(2*SPB),0,1);px=W/2;py=-200+(150+200)*(1-Math.pow(1-k,3));
    for(const m of M){if(t>=m.tb){px=m.x;py=m.y;}else{if(t>=m.ta)vis=false;if(t>=m.tw)mv=m;break;}}return{px,py,vis,mv};};
  const mouth=()=>[x,y+SH*0.3];
  const fan=(n,spr,sp)=>{if(!player)return;const[mx,my]=mouth(),a0=Math.atan2(player.y-my,player.x-mx);for(let k=0;k<n;k++){const a=a0+(k-(n-1)/2)*spr;hazards.push(HxPix(mx+Math.cos(a)*30,my+Math.sin(a)*30,Math.cos(a)*sp,Math.sin(a)*sp,10));}};
  const ring=(n,sp,a0)=>{for(let i=0;i<n;i++){const a=a0+i*TAU/n;hazards.push(HxPix(x+Math.cos(a)*60,y+Math.sin(a)*60,Math.cos(a)*sp,Math.sin(a)*sp,10));}};
  const eyes=(t)=>{if(!player)return;eyeT=t;const ex0=x,ey0=y-SH*0.1,a=Math.atan2(player.y-ey0,player.x-ex0),L=2600,c=Math.cos(a),s=Math.sin(a);
    for(const sd of [-1,1]){const ox=ex0-s*sd*30,oy=ey0+c*sd*30;hazards.push(Laser({x:ox+c*L/2,y:oy+s*L/2,ang:a,len:L,w:20,tw:t,ta:t+SPB*T.wn,te:t+SPB*(T.wn+0.6)}));}};

  update(t){

    if(t<ts)return;const S=at(t);x=S.px;y=S.py;
    if(t<ts+2*SPB||t>=tc)return;
    const b=Math.floor(BT(t)+1e-6);if(b===lastB)return;lastB=b;if(!S.vis)return;
    if(S.mv&&t>=S.mv.ta-SPB*0.6)return;// قبل النقلة بشوي يوقف
    if(b<316){const o=(b-268)%16;if(o<12){if(o%4===2)ring(12,T.sp*0.75,b*0.5);else if(o%2===0)fan(5,0.22,T.sp);else fan(3,0.3,T.sp*0.9);}else if(o===14)ring(14,T.sp*0.75,b*0.4);}
    else if(b<368){const o=(b-316)%8;if(o===0||o===4)eyes(t);else if(o===2)ring(12,T.sp*0.75,b*0.4);else if(o===6)fan(5,0.2,T.sp);else if(o===3||o===7)fan(3,0.3,T.sp*0.9);}
    else if(b<380){if(b%2===0)ring(12,T.sp*0.7,b*0.37);}
    else{const o=(b-380)%8;if(o===0||o===4)eyes(t);else if(o===2||o===6)fan(7,0.18,T.sp);else if(o===7||o===3)ring(14,T.sp*0.75,b*0.4);}
  },
  draw(t){if(t<ts)return;const S=at(t),ch=t>=tc&&t<tx;let jx=0,jy=0,s=1;if(ch){const k=(t-tc)/(tx-tc);s=1+0.25*k;jx=Math.sin(t*90)*6*k;jy=Math.cos(t*77)*6*k;}
    if(S.mv&&t<S.mv.tb){const k=clamp((t-S.mv.tw)/(S.mv.ta-S.mv.tw),0,1);g.strokeStyle=`rgba(255,42,109,${0.25+0.5*k})`;g.lineWidth=2;g.setLineDash([6,6]);g.strokeRect(S.mv.x-SW/2,S.mv.y-SH/2,SW,SH);g.setLineDash([]);g.fillStyle=`rgba(255,42,109,${0.05+0.12*k})`;g.fillRect(S.mv.x-SW/2,S.mv.y-SH/2,SW,SH);}
    if(!S.vis)return;const solid=t>=ts+2*SPB;g.save();g.translate(x+jx,y+jy);g.scale(s,s);g.globalAlpha=solid?1:0.45;
    const gl=Math.sin(t*23)>0.93;g.shadowColor=PINK;g.shadowBlur=ch?44:26;
    for(let j=0;j<12;j++){const o=gl&&j%3===1?8:0;for(let i=0;i<13;i++)if(HX_SKULL[j][i]==='#'){g.fillStyle=ch&&(i+j)%2?'#fff':PINK;g.fillRect(-SW/2+i*PX+o,-SH/2+j*PX,PX-1,PX-1);}}
    g.shadowBlur=0;const eb=t-eyeT<SPB*T.wn?0.5+0.5*Math.sin(t*30):0;if(eb>0){g.fillStyle=`rgba(255,255,255,${eb})`;g.fillRect(-SW/2+3*PX,-SH/2+4*PX,2*PX,2*PX);g.fillRect(-SW/2+8*PX,-SH/2+4*PX,2*PX,2*PX);}

  hit(p,t){if(t<ts+2*SPB||t>=tc)return false;const S=at(t);if(!S.vis||(S.mv&&t>=S.mv.ta))return false;if(M.some(m=>t>=m.tb&&t<m.tb+SPB*0.6))return false;return Math.abs(p.x-x)<SW/2-8+p.r&&Math.abs(p.y-y)<SH/2-8+p.r;}};}

/* ================= المرحلة السادسة: H3ЯД =================

  const errP=(hit,w,h,T,n=8)=>{const jx=(R()*2-1)*120,jy=(R()*2-1)*80;ev(hit-T.wn-0.6,()=>{const x=clamp(PXp()+jx,w/2+10,W-w/2-10),y=clamp(PYp()+jy,h/2+10,H-h/2-10);hazards.push(HxErr(x,y,w,h,B(hit-T.wn-0.6),B(hit),n,T.sp*0.8));});};

  const gate=(hit,vert,gc,gs,T,dir,spd=0.85)=>ev(hit-T.wn,()=>hazards.push(HxGate(vert,gc,gs,B(hit-T.wn),B(hit),T.sp*spd,dir)));
  const spin=(b0,b1,x,y,Rr,T,segs,on,rot,a0=0,w=22)=>ev(b0-2*T.wn,()=>hazards.push(HxSpin(x,y,Rr,B(b0-2*T.wn),B(b0),B(b1),segs,on,w,rot,a0)));

  const at=s=>{s=clamp(s,0,L);let i=1;while(i<Lc.length-1&&Lc[i]<s)i++;const u=(s-Lc[i-1])/((Lc[i]-Lc[i-1])||1);return[P[i-1][0]+(P[i][0]-P[i-1][0])*u,P[i-1][1]+(P[i][1]-P[i-1][1])*u,Math.atan2(P[i][1]-P[i-1][1],P[i][0]-P[i-1][0])];};
  const sH=t=>clamp((t-ta)/dur,0,1)*L,sT=t=>clamp((t-ta-lin)/dur,0,1)*L;
  return{
  update(t){if(t>ta+dur+lin+0.3)this.dead=true;},
  draw(t){
    if(t<ta+dur){const k=clamp((t-tw)/(ta-tw),0,1),s0=sH(t),n=Math.max(2,Math.round(L/26));g.fillStyle=`rgba(255,42,109,${0.16+0.4*k})`;
      for(let i=0;i<=n;i++){const s=L*i/n;if(s<s0)continue;if(t<ta&&i/n>k*1.25+0.1)break;const[x,y]=at(s),z=1.8+1.4*k;g.fillRect(x-z,y-z,2*z,2*z);}}
    if(t>=ta){const h=sH(t),tl=sT(t);if(h>tl+0.5){const f=t>ta+dur?Math.max(0,1-(t-ta-dur)/(lin+0.3)):1;g.save();g.strokeStyle=PINK;g.lineCap='round';g.shadowColor=PINK;g.shadowBlur=12;g.lineWidth=w*(1+0.15*pulse);g.globalAlpha=0.55+0.45*f;
      g.beginPath();let st=at(tl);g.moveTo(st[0],st[1]);for(let i=0;i<P.length;i++)if(Lc[i]>tl&&Lc[i]<h)g.lineTo(P[i][0],P[i][1]);const e=at(h);g.lineTo(e[0],e[1]);g.stroke();g.restore();}
      if(t<ta+dur&&!nh){const[x,y,a]=at(h);g.save();g.shadowColor=PINK;g.shadowBlur=16;L9plane(x,y,a,1.15+0.1*pulse,PINK);g.restore();L9plane(x,y,a,0.5,'rgba(255,255,255,0.8)');}}
    else{const[x,y]=P[0];g.strokeStyle=`rgba(255,42,109,${0.5*clamp((t-tw)/(ta-tw),0,1)})`;g.lineWidth=2;g.beginPath();g.arc(x,y,16,0,TAU);g.stroke();}},
  hit(p,t){if(t<ta)return false;const h=sH(t),tl=sT(t);if(h<=tl)return false;const rr=w/2+p.r-2;
    if(t<ta+dur&&!nh){const[x,y]=at(h);if(Math.hypot(p.x-x,p.y-y)<18+p.r)return true;}
    for(let i=1;i<P.length;i++){const s0=Math.max(Lc[i-1],tl),s1=Math.min(Lc[i],h);if(s1<=s0)continue;const a=at(s0),b=at(s1),dx=b[0]-a[0],dy=b[1]-a[1],l2=dx*dx+dy*dy||1,u=clamp(((p.x-a[0])*dx+(p.y-a[1])*dy)/l2,0,1);
      if(Math.hypot(p.x-a[0]-dx*u,p.y-a[1]-dy*u)<rr)return true;}return false;}};}
// دبوس مكان: ينزل على المدينة ويبقى شوي (يضر)
function L9Pin(x,y,tw,ta,te,R=34){return{
  update(t){if(t>te+0.3)this.dead=true;if(!this.l&&t>=ta){this.l=1;burst(x,y,PINK,8,200);}},
  draw(t){if(t<ta){const k=clamp((t-tw)/(ta-tw),0,1);g.strokeStyle=`rgba(255,42,109,${0.3+0.5*k})`;g.lineWidth=2;g.setLineDash([6,6]);g.beginPath();g.arc(x,y,R,0,TAU);g.stroke();g.setLineDash([]);
      const f=clamp(k*1.4-0.4,0,1);if(f>0){g.globalAlpha=f;L9pinShape(x,y-R-160*(1-f),R*0.8);g.globalAlpha=1;}return;}
    const a=t<te?1:Math.max(0,1-(t-te)/0.3);g.globalAlpha=a;g.fillStyle='rgba(255,42,109,0.25)';circle(x,y,R*(1+0.1*pulse));L9pinShape(x,y-R*0.9,R*0.8);g.globalAlpha=1;},
  hit(p,t){return t>=ta&&t<te&&Math.hypot(p.x-x,p.y-y)<R*0.9+p.r-2;}};}
function L9pinShape(x,y,s){g.save();g.translate(x,y);g.shadowColor=PINK;g.shadowBlur=14;g.fillStyle=PINK;g.beginPath();g.arc(0,0,s*0.6,Math.PI*0.85,Math.PI*2.15);g.lineTo(0,s*1.1);g.closePath();g.fill();g.shadowBlur=0;g.fillStyle='#000';circle(0,0,s*0.25);g.restore();}

// منطقة حظر طيران (دايرة): تحذير خط متقطع، وبعدين تتعبى وردي مخطط وتضر لين te
function L9NoFly(x,y,r,tw,ta,te){return{
  update(t){if(t>te+0.3)this.dead=true;if(!this.l&&t>=ta){this.l=1;burst(x,y,PINK,10,240);}},
  draw(t){g.save();if(t<ta){const k=clamp((t-tw)/(ta-tw),0,1);g.fillStyle=`rgba(255,42,109,${0.04+0.1*k})`;circle(x,y,r);g.strokeStyle=`rgba(255,42,109,${0.3+0.5*k})`;g.lineWidth=2;g.setLineDash([10,8]);g.lineDashOffset=-t*30;g.beginPath();g.arc(x,y,r,0,TAU);g.stroke();g.setLineDash([]);
      g.lineWidth=3;g.beginPath();g.arc(x,y,r*0.28,0,TAU);g.moveTo(x-r*0.2,y+r*0.2);g.lineTo(x+r*0.2,y-r*0.2);g.stroke();g.restore();return;}
    const a=t<te?Math.min(1,(t-ta)/0.08):Math.max(0,1-(t-te)/0.3);g.globalAlpha=a;g.fillStyle='rgba(255,42,109,0.32)';circle(x,y,r);
    g.beginPath();g.arc(x,y,r,0,TAU);g.clip();g.strokeStyle='rgba(255,42,109,0.55)';g.lineWidth=5;g.beginPath();const o=(t*40)%26;for(let d=-r*2;d<r*2;d+=26){g.moveTo(x+d+o-r,y+r);g.lineTo(x+d+o+r,y-r);}g.stroke();
    g.restore();g.save();g.globalAlpha=a;g.shadowColor=PINK;g.shadowBlur=18;g.strokeStyle=PINK;g.lineWidth=5*(1+0.2*pulse);g.beginPath();g.arc(x,y,r,0,TAU);g.stroke();g.restore();},
  hit(p,t){return t>=ta&&t<te&&Math.hypot(p.x-x,p.y-y)<r-4+p.r-2;}};}
// رادار برج المراقبة: شعاع (قطاع) يمسح من الزاوية a0 لين a1، قبلها يبان مداه خفيف
function L9Radar(cx,cy,R,a0,a1,wid,tw,ta,te){const sg=Math.sign(a1-a0)||1,cur=t=>a0+(a1-a0)*clamp((t-ta)/(te-ta),0,1);
  return{update(t){if(t>te+0.3)this.dead=true;},
  draw(t){g.save();if(t<ta){const k=clamp((t-tw)/(ta-tw),0,1);g.fillStyle=`rgba(255,42,109,${0.03+0.07*k})`;g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,R,Math.min(a0,a1)-wid*(sg>0?1:0),Math.max(a0,a1)+wid*(sg<0?1:0));g.closePath();g.fill();
      g.strokeStyle=`rgba(255,42,109,${0.3+0.5*k})`;g.lineWidth=3;g.setLineDash([12,10]);g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(a0)*R,cy+Math.sin(a0)*R);g.moveTo(cx,cy);g.lineTo(cx+Math.cos(a0-sg*wid)*R,cy+Math.sin(a0-sg*wid)*R);g.stroke();g.setLineDash([]);
      for(let i=1;i<=3;i++){g.globalAlpha=0.25+0.35*k;g.beginPath();g.arc(cx,cy,R*i/3.2*k,0,TAU);g.stroke();}g.restore();return;}
    const c=cur(t),a=t<te?1:Math.max(0,1-(t-te)/0.3),b0=Math.min(c,c-sg*wid),b1=Math.max(c,c-sg*wid);g.globalAlpha=a;g.fillStyle='rgba(255,42,109,0.34)';g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,R,b0,b1);g.closePath();g.fill();
    g.shadowColor=PINK;g.shadowBlur=20;g.strokeStyle=PINK;g.lineWidth=6*(1+0.2*pulse);g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(c)*R,cy+Math.sin(c)*R);g.stroke();g.shadowBlur=0;g.fillStyle=PINK;circle(cx,cy,14);g.restore();},
  hit(p,t){if(t<ta||t>=te)return false;const d=Math.hypot(p.x-cx,p.y-cy);if(d>R+p.r-2)return false;if(d<16+p.r)return true;const c=cur(t);let da=(Math.atan2(p.y-cy,p.x-cx)-c)*-sg;da=((da%TAU)+TAU)%TAU;return da<wid+(p.r-2)/d;}};}
// الليل: نص الخريطة ظلام (وردي) من طرف side، حدّه يتراجع من x1 لين x2 مع طلوع الشمس
function L9Night(side,x1,x2,tw,ta,te){const bx=t=>x1+(x2-x1)*clamp((t-ta)/(te-ta),0,1),inn=(x,b)=>side<0?x<b:x>b;
  return{update(t){if(t>te+0.3)this.dead=true;},
  draw(t){const b=bx(t),pre=t<ta,k=pre?clamp((t-tw)/(ta-tw),0,1):1,a=t<te?1:Math.max(0,1-(t-te)/0.3),x0=side<0?0:b,ww=side<0?b:W-b;g.save();g.globalAlpha=a;
    g.fillStyle=pre?`rgba(255,42,109,${0.04+0.08*k})`:'rgba(255,42,109,0.3)';const wv=y=>b+Math.sin(y/70+t*2)*14;g.beginPath();g.moveTo(side<0?0:W,0);for(let y=0;y<=H;y+=20)g.lineTo(wv(y),y);g.lineTo(side<0?0:W,H);g.closePath();g.fill();
    if(!pre){g.fillStyle='rgba(255,255,255,0.5)';for(let i=0;i<40;i++){const sx=(i*197)%W,sy=(i*331)%H;if(inn(sx,wv(sy)-side*20)&&(i+Math.floor(t*3))%5)g.fillRect(sx-1.5,sy-1.5,3,3);}}
    g.strokeStyle=pre?`rgba(255,42,109,${0.3+0.5*k})`:PINK;g.lineWidth=pre?3:6;if(pre)g.setLineDash([12,10]);else{g.shadowColor=PINK;g.shadowBlur=20;}g.beginPath();for(let y=0;y<=H;y+=20)y?g.lineTo(wv(y),y):g.moveTo(wv(y),y);g.stroke();g.restore();},
  hit(p,t){if(t<ta||t>=te)return false;return inn(p.x+side*(p.r-4),bx(t)+Math.sin(p.y/70+t*2)*14);}};}

// مراقب (ما يبان ولا يضر): يطلق هجوم على مكان اللاعب في أوقات W (ضربات)، عشان ما فيه مكان تقعد فيه واقف
function L9Pulse(Wb,mk,t1){let i=-1;return{update(t){if(i<0){i=0;while(i<Wb.length&&B(Wb[i])<t-0.05)i++;}while(i<Wb.length&&t>=B(Wb[i])){mk(i);i++;}if(t>t1)this.dead=true;},draw(){},hit(){return false;}};}

// غيوم رمادي تمشي (ديكور)
function L9Clouds(t0,t1){const C=[];for(let i=0;i<8;i++)C.push([i*(W+400)/8,70+((i*3)%8)*80,46+(i*37)%30,26+(i*29)%18]);
  return{update(t){if(t>t1)this.dead=true;},
  draw(t){const a=Math.max(0,Math.min(1,(t-t0)/1.5,(t1-t)/1.0));if(a<=0)return;g.fillStyle=GREY+(0.06*a).toFixed(3)+')';
    for(const[x0,y,r,v] of C){const x=((x0-(t-t0)*v)%(W+400)+W+400)%(W+400)-200;g.beginPath();g.ellipse(x,y,r*2.6,r*0.7,0,0,TAU);g.moveTo(x+r*1.3,y-r*0.3);g.arc(x+r*0.5,y-r*0.3,r*0.8,0,TAU);g.moveTo(x-r*0.3,y-r*0.2);g.arc(x-r*0.9,y-r*0.2,r*0.6,0,TAU);g.fill();}},
  hit(){return false;}};}
// غيمة العاصفة (رمادي ما تضر): تمشي فوق، x(t) مكانها
function L9StormCloud(xf,t0,t1){return{update(t){if(t>t1)this.dead=true;},
  draw(t){const a=Math.max(0,Math.min(1,(t-t0)/0.6,(t1-t)/0.6));if(a<=0)return;const x=xf(t),y=30,p=pulse;g.fillStyle=GREY+(0.16*a).toFixed(3)+')';g.beginPath();g.ellipse(x,y+18,150,40,0,0,TAU);g.moveTo(x+30+70,y);g.arc(x+30,y,70,0,TAU);g.moveTo(x-50+55,y+8);g.arc(x-50,y+8,55,0,TAU);g.moveTo(x+100+45,y+14);g.arc(x+100,y+14,45,0,TAU);g.fill();
    g.fillStyle=`rgba(255,42,109,${(0.12+0.25*p)*a})`;g.beginPath();g.ellipse(x,y+50,120,10,0,0,TAU);g.fill();},
  hit(){return false;}};}
// برق: تحذير خفيف متقطع، وبعدين ضربة برق متعرجة من فوق لتحت (pts نقاطها)
function L9Bolt(pts,tw,ta,te,w=22){return{
  update(t){if(t>te+0.3)this.dead=true;if(!this.s&&t>=ta){this.s=1;flash=Math.max(flash,0.12);shake=Math.max(shake,5);const q=pts[pts.length-1];burst(q[0],Math.min(q[1],H-6),'#fff',8,260);}},
  draw(t){if(t<ta){const k=clamp((t-tw)/(ta-tw),0,1),fl=0.6+0.4*Math.sin(t*40);g.strokeStyle=`rgba(255,42,109,${(0.12+0.4*k)*fl})`;g.lineWidth=2+w*0.25*k;g.setLineDash([10,8]);
      g.beginPath();pts.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.stroke();g.setLineDash([]);
      g.fillStyle=`rgba(215,215,230,${0.06+0.12*k})`;circle(pts[0][0],12,50+20*k);return;}
    const e=t-ta,a=t<te?1:Math.max(0,1-(t-te)/0.3);g.save();g.globalAlpha=a;g.lineJoin='round';g.lineCap='round';g.shadowColor=PINK;g.shadowBlur=24;g.strokeStyle=PINK;g.lineWidth=w*(1+0.2*pulse);
    g.beginPath();pts.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.stroke();g.shadowBlur=0;g.strokeStyle=e<0.08?'#fff':'rgba(255,255,255,0.7)';g.lineWidth=w*0.3;g.stroke();g.restore();},
  hit(p,t){if(t<ta||t>=te)return false;const rr=w/2+p.r-2;for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],dx=b[0]-a[0],dy=b[1]-a[1],l2=dx*dx+dy*dy||1,u=clamp(((p.x-a[0])*dx+(p.y-a[1])*dy)/l2,0,1);if(Math.hypot(p.x-a[0]-dx*u,p.y-a[1]-dy*u)<rr)return true;}return false;}};}
// تشكيل طيارات (شكل V): يدخل من برا الشاشة ويعدي، وكل طيارة وراها أثر قصير يضر. قبلها خطوط مسارهم نقط
function L9Formation(x0,y0,ang,n,gap,sp,tw,ta,trl=150,s=1.0){const dx=Math.cos(ang),dy=Math.sin(ang),nx=-dy,ny=dx,F=[];
  for(let i=0;i<n;i++){const k=Math.ceil(i/2),sd=i%2?1:-1;F.push([-k*gap*0.8,i?sd*k*gap:0]);}
  const pos=(f,t)=>{const d=(t-ta)*sp+f[0];return[x0+dx*d+nx*f[1],y0+dy*d+ny*f[1],d];};
  return{
  update(t){if(t>ta&&(t-ta)*sp-gap*n-trl>2200)this.dead=true;},
  draw(t){if(t<ta+1.2){const k=clamp((t-tw)/(ta-tw),0,1);g.fillStyle=`rgba(255,42,109,${(0.12+0.35*k)*(t<ta?1:Math.max(0,1-(t-ta)/1.2))})`;
      for(const f of F){for(let d=0;d<2000;d+=34){const x=x0+dx*d+nx*f[1],y=y0+dy*d+ny*f[1];if(x<-20||x>W+20||y<-20||y>H+20){if(d>200)break;continue;}g.fillRect(x-2,y-2,4,4);}}}
    if(t<ta)return;g.save();g.strokeStyle=PINK;g.lineCap='round';g.shadowColor=PINK;g.shadowBlur=10;g.lineWidth=8;
    for(const f of F){const[x,y,d]=pos(f,t),l=Math.min(trl,Math.max(0,d));if(l>0){g.beginPath();g.moveTo(x,y);g.lineTo(x-dx*l,y-dy*l);g.stroke();}}
    g.shadowBlur=16;for(const f of F){const[x,y]=pos(f,t);L9plane(x,y,ang,s*(1+0.1*pulse),PINK);}g.restore();},
  hit(p,t){if(t<ta)return false;for(const f of F){const[x,y,d]=pos(f,t);if(Math.hypot(p.x-x,p.y-y)<17*s+p.r-2)return true;const l=Math.min(trl,Math.max(0,d));if(l<=0)continue;
      const u=clamp(((p.x-x)*-dx+(p.y-y)*-dy)/l,0,1);if(Math.hypot(p.x-x+dx*l*u,p.y-y+dy*l*u)<4+p.r-1)return true;}return false;}};}

// خلية مطر: غيمة رمادي توقف فوق، وتنزل منها عمود مطر (وردي) يضر من ta لين te
function L9Rain(x,w,tw,ta,te){return{update(t){if(t>te+0.3)this.dead=true;},
  draw(t){const pre=t<ta,k=pre?clamp((t-tw)/(ta-tw),0,1):1,a=Math.min(clamp((t-tw)/0.3,0,1),t<te?1:Math.max(0,1-(t-te)/0.3));g.save();g.globalAlpha=a;
    g.fillStyle=GREY+'0.18)';g.beginPath();g.ellipse(x,52,w*0.75,30,0,0,TAU);g.moveTo(x+w*0.25+44,30);g.arc(x+w*0.25,30,44,0,TAU);g.moveTo(x-w*0.3+36,36);g.arc(x-w*0.3,36,36,0,TAU);g.fill();
    if(pre){g.fillStyle=`rgba(255,42,109,${0.04+0.08*k})`;g.fillRect(x-w/2,80,w,H-80);g.strokeStyle=`rgba(255,42,109,${0.3+0.5*k})`;g.lineWidth=2;g.setLineDash([10,8]);g.beginPath();g.moveTo(x-w/2,80);g.lineTo(x-w/2,H);g.moveTo(x+w/2,80);g.lineTo(x+w/2,H);g.stroke();g.setLineDash([]);
      g.fillStyle=`rgba(255,42,109,${0.2+0.4*k})`;for(let i=0;i<6;i++){const yy=80+((i*97+t*160)%(140+k*(H-220)));g.fillRect(x-w/2+8+(i*53)%(w-16),yy,3,12);}g.restore();return;}
    g.fillStyle='rgba(255,42,109,0.3)';g.fillRect(x-w/2,80,w,H-80);g.shadowColor=PINK;g.shadowBlur=14;g.fillStyle=PINK;for(let i=0;i<22;i++){const xx=x-w/2+6+(i*37)%(w-12),yy=80+((i*131+t*900)%(H-80));g.fillRect(xx,yy,4,26);}
    g.shadowBlur=0;g.strokeStyle=PINK;g.lineWidth=3;g.beginPath();g.moveTo(x-w/2,80);g.lineTo(x-w/2,H);g.moveTo(x+w/2,80);g.lineTo(x+w/2,H);g.stroke();g.restore();},
  hit(p,t){return t>=ta&&t<te&&p.y>70&&Math.abs(p.x-x)<w/2-4+p.r-2;}};}
// القلب يتعبى: بعد ما ترسمه الطيارتين، داخله يصير وردي ويضر شوي (P نقاط حدوده)
function L9HeartFill(P,tw,ta,te){const inside=(x,y)=>{let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[xi,yi]=P[i],[xj,yj]=P[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c;}return c;};
  return{update(t){if(t>te+0.3)this.dead=true;if(!this.l&&t>=ta){this.l=1;}if(!this.p&&t>=te){this.p=1;let mx=0,my=0;for(const q of P){mx+=q[0];my+=q[1];}burst(mx/P.length,my/P.length,PINK,30,420);}},
  draw(t){const pre=t<ta,k=pre?clamp((t-tw)/(ta-tw),0,1):1,a=t<te?1:Math.max(0,1-(t-te)/0.3);g.save();g.globalAlpha=a;g.fillStyle=pre?`rgba(255,42,109,${0.03+0.1*k})`:`rgba(255,42,109,${0.32+0.06*pulse})`;

// لمعة البرج: شكل البرج (مثلث فيه قوس) يكبر من البرج لبرا، وفيه فتحة
function L10SparkShape(cx,cy,t0,sp,gapA,gapW,tw){const S=[[0,-1],[0.62,0.78],[-0.62,0.78]];// رؤوس المثلث (حجم ١)
  const pts=sc=>S.map(([x,y])=>[cx+x*sc,cy+y*sc]);
  const angOk=(px,py)=>{let da=Math.atan2(py-cy,px-cx)-gapA;da=Math.atan2(Math.sin(da),Math.cos(da));return Math.abs(da)>gapW/2;};
  const dSeg=(px,py,a,b)=>{const vx=b[0]-a[0],vy=b[1]-a[1],u=clamp(((px-a[0])*vx+(py-a[1])*vy)/(vx*vx+vy*vy),0,1);return Math.hypot(px-a[0]-vx*u,py-a[1]-vy*u);};
  const FA=900;return{update(t){if((t-t0)*sp+40>FA+120)this.dead=true;},
  draw(t){if(t<t0){const k=clamp((t-tw)/(t0-tw),0,1);g.strokeStyle=`rgba(255,42,109,${0.3+0.5*k})`;g.lineWidth=3;const P=pts(30+30*k);g.beginPath();g.moveTo(...P[0]);g.lineTo(...P[1]);g.lineTo(...P[2]);g.closePath();g.stroke();
      g.fillStyle=`rgba(255,255,255,${0.4+0.5*k})`;circle(cx+Math.cos(gapA)*(60+60*k),cy+Math.sin(gapA)*(60+60*k),6);return;}
    const sc=(t-t0)*sp+40,P=pts(sc);g.save();g.globalAlpha=clamp((FA+120-sc)/120,0,1);g.beginPath();g.rect(0,0,W,H);g.moveTo(cx,cy);g.arc(cx,cy,2400,gapA-gapW/2,gapA+gapW/2);g.closePath();g.clip('evenodd');
    g.shadowColor=PINK;g.shadowBlur=16;g.strokeStyle=PINK;g.lineWidth=12*(1+0.15*pulse);g.lineJoin='round';g.beginPath();g.moveTo(...P[0]);g.lineTo(...P[1]);g.lineTo(...P[2]);g.closePath();g.stroke();g.shadowBlur=0;
    g.fillStyle='#fff';for(let k=0;k<3;k++){const a=P[k],b=P[(k+1)%3];for(let i=0;i<12;i++){if((i+Math.floor(t*12))%3)continue;const u=i/12;circle(a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,3);}}g.restore();},
  hit(p,t){if(t<t0)return false;const sc=(t-t0)*sp+40;if(sc>FA+40)return false;const P=pts(sc);let d=1e9;for(let k=0;k<3;k++)d=Math.min(d,dSeg(p.x,p.y,P[k],P[(k+1)%3]));return d<6+p.r-2&&angOk(p.x,p.y);}};}

// خيط كريستال ينزل من الثريا على نغمة اللحن، ويرجع يطلع
function L10Strand(x,len,tw,ta,tr,te){const y0=L10CHY+26,cr=14,E=t=>t<ta?0:t<ta+0.1?L10ease((t-ta)/0.1):t<tr?1:1-L10ease((t-tr)/(te-tr));

  draw(t){if(t<ta){const k=clamp((t-tw)/(ta-tw),0,1);g.strokeStyle=`rgba(255,42,109,${0.2+0.5*k})`;g.lineWidth=2;L10dash(true);g.beginPath();g.moveTo(x,y0);g.lineTo(x,y0+len);g.stroke();L10dash(false);
      g.fillStyle=`rgba(255,42,109,${0.15+0.5*k})`;L10gem(x,y0+len,cr*(0.5+0.5*k));return;}
    const y1=y0+len*E(t);g.save();g.shadowColor=PINK;g.shadowBlur=14;g.strokeStyle=PINK;g.lineWidth=6;g.beginPath();g.moveTo(x,y0);g.lineTo(x,y1);g.stroke();

// برج كاسات شمبانيا (ديكور) تحت بالنص

// طاحونة مونمارتر: ٤ أشرعة تلف خطوة (٤٥ درجة) مع الضربات
function L10Mill(hx,hy,L,dir,a0,tw,ta,te,steps,stepB=0.4){const r0=28,sw=19,ang=t=>{const b=BT(t);let s=0;for(const q of steps){if(b<q)break;s+=L10ease((b-q)/stepB);}return a0+dir*s*Math.PI/4;};

  draw(t){const al=Math.min(1,(t-tw)/0.5,(te+0.5-t)/0.5);if(al<=0)return;const live=t>=ta&&t<te,a=ang(t),k0=clamp((t-tw)/(ta-tw),0,1);g.save();g.globalAlpha=al;
    g.fillStyle='rgba(22,22,30,0.95)';g.strokeStyle=GREY+'0.4)';g.lineWidth=3;g.beginPath();g.moveTo(hx-40,hy+10);g.lineTo(hx+40,hy+10);g.lineTo(hx+80,H);g.lineTo(hx-80,H);g.closePath();g.fill();g.stroke();g.beginPath();g.moveTo(hx-56,hy+16);g.lineTo(hx,hy-46);g.lineTo(hx+56,hy+16);g.closePath();g.fill();
    g.fillStyle=GREY+'0.35)';g.fillRect(hx-14,H-60,28,60);g.fillRect(hx-30,hy+70,18,22);g.fillRect(hx+12,hy+70,18,22);
    if(t<ta){g.strokeStyle=`rgba(255,42,109,${0.2+0.4*k0})`;g.lineWidth=2;L10dash(true);g.beginPath();g.arc(hx,hy,L,0,TAU);g.stroke();L10dash(false);}
    for(let k=0;k<4;k++){g.save();g.translate(hx,hy);g.rotate(a+k*Math.PI/2);if(live){g.shadowColor=PINK;g.shadowBlur=14;g.fillStyle=PINK;}else g.fillStyle=`rgba(255,42,109,${0.15+0.3*k0})`;
      g.fillRect(r0,-sw,L-r0,2*sw);g.shadowBlur=0;if(live){g.strokeStyle='rgba(110,20,45,0.55)';g.lineWidth=2;g.beginPath();for(let q=r0+28;q<L;q+=28){g.moveTo(q,-sw);g.lineTo(q,sw);}g.moveTo(r0,0);g.lineTo(L,0);g.stroke();}g.restore();}
    g.fillStyle=live?'#ffd1de':GREY+'0.5)';circle(hx,hy,r0*0.8);g.restore();},
  hit(p,t){if(t<ta||t>=te)return false;const a=ang(t),m=(r0+L)/2;if(Math.hypot(p.x-hx,p.y-hy)<r0*0.8+p.r-3)return true;for(let k=0;k<4;k++){const th=a+k*Math.PI/2;if(obbHit(p.x,p.y,p.r-3,hx+Math.cos(th)*m,hy+Math.sin(th)*m,(L-r0)/2,sw,th))return true;}return false;}};}
// هدوم الغسيل: s قميص، t بنطلون، d فستان، k شراب
function L10cloth(k,hw,hh){const h=2*hh;g.beginPath();
  if(k==='s'){g.moveTo(-hw*0.6,0);g.lineTo(hw*0.6,0);g.lineTo(hw,h*0.28);g.lineTo(hw*0.7,h*0.36);g.lineTo(hw*0.62,h);g.lineTo(-hw*0.62,h);g.lineTo(-hw*0.7,h*0.36);g.lineTo(-hw,h*0.28);}
  else if(k==='t'){g.moveTo(-hw,0);g.lineTo(hw,0);g.lineTo(hw,h);g.lineTo(hw*0.12,h);g.lineTo(0,h*0.3);g.lineTo(-hw*0.12,h);g.lineTo(-hw,h);}
  else if(k==='d'){g.moveTo(-hw*0.45,0);g.lineTo(hw*0.45,0);g.lineTo(hw*0.5,h*0.35);g.lineTo(hw,h);g.lineTo(-hw,h);g.lineTo(-hw*0.5,h*0.35);}
  else{g.moveTo(-hw,0);g.lineTo(hw,0);g.lineTo(hw,h*0.7);g.lineTo(hw*1.8,h*0.85);g.lineTo(hw*1.8,h);g.lineTo(-hw,h);}
  g.closePath();g.fill();}
// حبل غسيل عبر الساحة: الهدوم الوردية تتمرجح وتمشي مع الهوا رايحة وراجعة
function L10Laundry(yr,items,tw,ta,te,ph=0,zs=1){const sag=34,ry=x=>yr+sag*(1-Math.pow(2*clamp(x,0,W)/W-1,2)),SZ={s:[42*zs,50*zs],t:[30*zs,75*zs],d:[46*zs,70*zs],k:[16*zs,32*zs]};
  const off=t=>60*Math.sin(Math.PI*(BT(t)-ph)/4),sw=(t,i)=>0.22*Math.sin(Math.PI*(BT(t)-ph)/2+i*0.7);
  const geo=(t,i)=>{const[x0,k]=items[i],[hw,hh]=SZ[k],x=x0+off(t),y=ry(x),a=sw(t,i);return[x-Math.sin(a)*hh,y+Math.cos(a)*hh,hw,hh,a,x,y];};

// هدية مرفوضة تنرمى من شباك الفندق: تطيح، تنط مرة على الأرض، وتطلع برا. kind 0 شنطة، 1 قزازة عطر، 2 علبة قبعة
function L10Toss(x0,y0,vx,vy,gr,tw,ta,kind,s=30){const fy=H-s*0.8,A=0.5*gr,t1=(-vy+Math.sqrt(vy*vy-4*A*(y0-fy)))/(2*A),v1=-(vy+gr*t1)*0.6;
  const P=e=>{const x=x0+vx*e;if(e<t1)return[x,y0+vy*e+A*e*e];const e2=e-t1;return[x,fy+v1*e2+A*e2*e2];};
  return{update(t){if(t<ta)return;const[x,y]=P(t-ta);if(y>H+60||x<-80||x>W+80)this.dead=true;},

      g.fillStyle=`rgba(255,42,109,${0.3+0.5*k})`;circle(x0,y0,6+6*k);return;}
    const e=t-ta,[x,y]=P(e);g.save();g.translate(x,y);g.rotate(e*vx*0.012);g.shadowColor=PINK;g.shadowBlur=14;g.fillStyle=PINK;

// ستارة مخمل على طرف الشاشة (الريتز): تنفتح وتتسكر مع السوينغ. side -1 يسار، 1 يمين. segs = [[بداية، نهاية]] بالثواني
function L10Curtain(side,segs,w0,w1){const te=segs[segs.length-1][1]+0.5,amt=t=>{let m=0;for(const[a,b] of segs)m=Math.max(m,Math.min(clamp((t-a)/0.5,0,1),clamp((b-t)/0.5,0,1)));return m;},
  wd=t=>amt(t)*(w0+(w1-w0)*(0.5-0.5*Math.cos(Math.PI*BT(t))));
  return{update(t){if(t>te)this.dead=true;},
  draw(t){let warn=0;for(const[a] of segs)if(t<a&&t>a-1.2)warn=Math.max(warn,1-(a-t)/1.2);const w=wd(t);

/* ================= أشكال المرحلة الثامنة: Hips Don't Lie (كرنفال بارانكيا) ================= */
// كل الأسماء تبدأ بـ L8 عشان ما تتشابه مع أسماء المراحل الثانية
// خطوة الكومبيا: ثلاث خطوات صغيرة (الضربات ١ و٢ و٣) وركلة كبيرة على الرابعة. ترجع كم خطوة مشى لين الضربة bt
const L8ST=[1,1,1,2.5],L8BAR=5.5;
function L8step(bt){const n=Math.floor(bt),f=bt-n,i=((n%4)+4)%4;let s=Math.floor(n/4)*L8BAR;for(let k=0;k<i;k++)s+=L8ST[k];const e=clamp(f/0.4,0,1);return s+L8ST[i]*(1-Math.pow(1-e,3));}
// هزة الخصر: يمين ويسار مع كل ضربة
function L8hip(bt){return Math.sin(Math.PI*bt);}
function L8ease(k){k=clamp(k,0,1);return k*k*(3-2*k);}
function L8hitC(p,x,y,r){const dx=p.x-x,dy=p.y-y,rr=r+p.r-2;return dx*dx+dy*dy<rr*rr;}
function L8txt(s,x,y,size,col){g.font=`${size}px ${TFONT}`;g.fillStyle=col;g.textAlign='center';g.textBaseline='middle';g.direction='ltr';g.fillText(s,x,y);}
// عملة: دايرة وردية وداخلها حلقة بيضا
function L8coin(x,y,r,a){g.globalAlpha=a;g.fillStyle=PINK;circle(x,y,r);g.strokeStyle='rgba(255,255,255,0.75)';g.lineWidth=2;g.beginPath();g.arc(x,y,r*0.55,0,TAU);g.stroke();g.globalAlpha=1;}
function L8ghost(x,y,r,a){g.strokeStyle=`rgba(255,42,109,${a})`;g.lineWidth=2;g.beginPath();g.arc(x,y,r*0.85,0,TAU);g.stroke();}
// عملة طايرة (تنرمي وتطيح بالجاذبية)
function L8Coin(x,y,vx,vy,gr,r=11){return{x,y,vx,vy,r,
  update(t,dt){this.px=this.x;this.py=this.y;this.vy+=gr*dt;this.x+=this.vx*dt;this.y+=this.vy*dt;if(this.x<-60||this.x>W+60||this.y>H+60||this.y<-700)this.dead=true;},
  draw(){g.fillStyle='rgba(255,42,109,0.2)';circle(this.x,this.y,this.r*1.6);L8coin(this.x,this.y,this.r*(1+0.12*pulse),1);},
  // يفحص المسافة لخط الحركة بين الفريمين (العملة السريعة ما تقفز فوق اللاعب)
  hit(p){if(this.px===undefined)return L8hitC(p,this.x,this.y,this.r);const dx=this.x-this.px,dy=this.y-this.py,l=dx*dx+dy*dy,k=l?clamp(((p.x-this.px)*dx+(p.y-this.py)*dy)/l,0,1):1;return L8hitC(p,this.px+dx*k,this.py+dy*k,this.r);}};}
// مسار بنقاط مفتاحية [ضربة، x، y، زاوية، حجم]، ويتمايل مع خطوة الكومبيا
function L8path(KF,bobA=8){return t=>{const b=BT(t);let i=0;while(i<KF.length-2&&b>=KF[i+1][0])i++;const A=KF[i],Bk=KF[i+1];const e=L8ease((b-A[0])/((Bk[0]-A[0])||1));
  let da=Bk[3]-A[3];da=Math.atan2(Math.sin(da),Math.cos(da));const bob=bobA*Math.sin(L8step(b)*Math.PI*2/L8BAR);
  const x=A[1]+(Bk[1]-A[1])*e,y=A[2]+(Bk[2]-A[2])*e,a=A[3]+da*e,s0=A[4]||1,s1=Bk[4]||1;return[x-Math.cos(a)*bob,y-Math.sin(a)*bob,a,s0+(s1-s0)*e];};}
// كلمة رمادية (ما تضر)
function L8Word(s,x,y,size,t0,t1,col){return{update(t){if(t>t1)this.dead=true;},
  draw(t){if(t<t0)return;const e=t-t0,a=Math.min(1,e/0.08,(t1-t)/0.3),sc=1+0.35*Math.exp(-e*10);g.globalAlpha=Math.max(0,a);g.save();g.translate(x,y);g.scale(sc,sc);L8txt(s,0,0,size,col||GREY+'0.55)');g.restore();g.globalAlpha=1;},

// حلقة عملات تكبر من نقطة (فيها مسافات بين العملات). tw: قبلها تنبض النقطة شفاف
function L8Ring(cx,cy,t0,v,n,ph=0,tw){const R=t=>40+v*(t-t0);return{
  update(t){if(t>t0&&R(t)>1500)this.dead=true;},

    const r=R(t);for(let i=0;i<n;i++){const a=ph+TAU*i/n,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;if(x<-20||x>W+20||y<-20||y>H+20)continue;L8coin(x,y,11*(1+0.1*pulse),1);}},
  hit(p,t){if(t<t0)return false;const r=R(t),d=Math.hypot(p.x-cx,p.y-cy);if(Math.abs(d-r)>11+p.r)return false;for(let i=0;i<n;i++){const a=ph+TAU*i/n;if(L8hitC(p,cx+Math.cos(a)*r,cy+Math.sin(a)*r,11))return true;}return false;}};}

/* ---------------- الفيز ١: كرنفال بارانكيا ---------------- */
// حزام عملات بعرض الشاشة وتحته شراشيب. ينفرد من اليسار لليمين بين ta و tu. y(t) مكانه
// sh: أوقات الهزة، drop: الشراشيب تطيح عملات
function L8Belt(o){const sp=26,cr=11,fs=22,n=Math.ceil((W+40)/sp)+1;
  const xm=t=>t<o.ta?-60:-20+(W+60)*L8ease((t-o.ta)/(o.tu-o.ta));
  const yb=(x,t)=>o.y(t)+16*Math.sin(x/140-Math.PI*BT(t));
  const inSh=t=>{if(!o.sh)return false;const b=BT(t);return o.sh.some(s=>b>=s[0]&&b<s[1]);};
  const fl=i=>i%4===0?4:2;
  const fx=(i,t,d)=>(-20+i*sp)+12*L8hip(BT(t))*d/90;
  let dropped=false;
  return{
  update(t){if(o.drop!==undefined&&!dropped&&t>=B(o.drop)){dropped=true;for(let i=0;i<n;i+=2){const x=-20+i*sp;if(x<10||x>W-10)continue;const y=yb(x,t);for(let j=1;j<=fl(i);j++)hazards.push(L8Coin(fx(i,t,j*fs),y+j*fs,0,-60+j*20,650,10));}}
    if(t>o.te||o.y(t)<-160)this.dead=true;},
  draw(t){if(t<o.tw)return;
    if(t<o.ta){const k=clamp((t-o.tw)/(o.ta-o.tw),0,1);g.strokeStyle=`rgba(255,42,109,${0.15+0.4*k})`;g.lineWidth=3;g.setLineDash([10,8]);g.beginPath();for(let x=0;x<=W;x+=40){const y=yb(x,o.ta);x?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();g.setLineDash([]);
      g.fillStyle=`rgba(255,42,109,${0.05+0.12*k})`;g.fillRect(0,o.y(o.ta)-14,W,4*fs+28);return;}
    const m=xm(t),sh=inSh(t),jj=i=>sh?4*Math.sin(t*45+i*1.3):0;
    g.strokeStyle='rgba(255,42,109,0.18)';g.lineWidth=cr*3;g.lineCap='round';g.beginPath();for(let x=-20;x<=m;x+=40){const y=yb(x,t);x<=-20?g.moveTo(x,y):g.lineTo(x,y);}g.stroke();g.lineCap='butt';
    for(let i=0;i<n;i++){const x=-20+i*sp;if(x>m)break;const y=yb(x,t)+jj(i);
      if(!dropped&&i%2===0){for(let j=1;j<=fl(i);j++)L8coin(fx(i,t,j*fs)+jj(i+j),y+j*fs,9,1);}
      L8coin(x,y,cr,1);}},
  hit(p,t){if(t<o.ta)return false;const m=xm(t);if(p.x>m+cr)return false;const y=yb(p.x,t);if(Math.abs(p.y-y)<cr+p.r-2)return true;
    if(dropped)return false;const dy=p.y-y;if(dy<0||dy>4*fs+cr)return false;const i0=Math.round((p.x+20)/sp);
    for(let i=i0-2;i<=i0+2;i++){if(i<0||i%2||-20+i*sp>m)continue;const L=fl(i)*fs;if(dy>L+9||dy<fs-9)continue;if(Math.abs(p.x-fx(i,t,clamp(dy,fs,L)))<9+p.r-2)return true;}return false;}};}
// "No fighting": كرتين عملات كبار يندفعون على بعض، وقبل ما يتضاربون يرتدون، وكل كرة تفك حلقة عملات

// ستارة عملات: خيوط عملات تتدلى من فوق (side 0) أو من تحت (side 1)
// X(k,t) مكان الخيط، len(k,t) طوله، tilt(k,t) ميلانه، wave(k,t,d) اهتزاز الوتر، sh أوقات الهزة

// علامة إسباني مقلوبة (¿ أو ¡) كبيرة تطيح من فوق وتنقلب

// مروحة إسبانية (أبانيكو): أضلاع عملات من نقطة وحدة، تنفتح وتلف. spread(t) فتحتها، rot(t) اتجاهها

  hit(p,t){if(t<o.ta||t>=o.te)return false;const dx=p.x-o.cx,dy=p.y-o.cy;if(L8hitC(p,o.cx,o.cy,34))return true;for(const a of ribs(t)){const c=Math.cos(a),s=Math.sin(a),pr=dx*c+dy*s;if(pr<o.r0-cr||pr>o.R+cr)continue;if(Math.abs(-dx*s+dy*c)<cr+p.r-2)return true;}return false;}};}
// راقصة رمادية عملاقة (ما تضر) وحزامها عملات وردية حول خصرها (يضر). x(t) مكانها، spin(t) لفة الحزام
// throws: الحزام يرمي عملات [{b,v,ev,gr}]، rip: الحزام يطلع حلقات بيضاوية تكبر [ضربات]

// حلقة بيضاوية عملات تكبر من خصر الراقصة

// أثر قدم كبير يدعس على الضربة (يبان شفاف قبل). ang اتجاه أصابعه، mir القدم اليسار

// كلمات إسبانية تمشي بصف مثل القطار. كل حرف صندوق يضر، والمسافات بين الكلمات ممرات. y(t) مكان الصف

      g.fillStyle=`rgba(255,42,109,${0.2+0.3*k})`;for(let j=0;j<4;j++){const ax=o.dir>0?40+j*40:W-40-j*40;g.beginPath();g.moveTo(ax+o.dir*14,y);g.lineTo(ax-o.dir*8,y-14);g.lineTo(ax-o.dir*8,y+14);g.closePath();g.fill();}}

// "mi casa, su casa": بيتين. وقت الطوفان كل شي برا البيت الآمن يضر. البيت الآمن ينور أبيض قبل الطوفان
// fl: [{tw,ta,te,s}] s رقم البيت الآمن
function L8Houses(hs,t0,t1,fl){
  const shape=(h)=>{const x=h.x,y=h.y;g.moveTo(x-95,y-40);g.lineTo(x,y-125);g.lineTo(x+95,y-40);g.lineTo(x+95,y+110);g.lineTo(x-95,y+110);g.closePath();};
  const inside=(h,p)=>{const x=p.x-h.x,y=p.y-h.y,m=p.r-1;if(Math.abs(x)>95-m||y>110-m)return false;if(y>=-40+m)return true;const roofY=-125+(Math.abs(x)/95)*85;return y>roofY+m*1.4;};
  // الطوفان الشغال أول، بعده تحذير الجاي، بعده اللي يختفي
  const cur=t=>{for(const f of fl)if(t>=f.ta&&t<f.te)return f;for(const f of fl)if(t>=f.tw&&t<f.ta)return f;for(const f of fl)if(t>=f.te&&t<f.te+0.25)return f;return null;};
  return{
  update(t){if(t>t1)this.dead=true;},
  draw(t){if(t<t0)return;const ap=Math.min(1,(t-t0)/0.4,(t1-t)/0.4);if(ap<=0)return;const f=cur(t);
    if(f){g.beginPath();g.rect(0,0,W,H);shape(hs[f.s]);
      if(t<f.ta){const k=clamp((t-f.tw)/(f.ta-f.tw),0,1);g.fillStyle=`rgba(255,42,109,${0.05+0.2*k})`;g.fill('evenodd');}
      else if(t<f.te){g.fillStyle=t-f.ta<0.06?'#fff':PINK;g.globalAlpha=0.92;g.fill('evenodd');g.globalAlpha=1;
        g.fillStyle='rgba(255,255,255,0.35)';const ph=(t-f.ta)*600;for(let y=-40;y<H+40;y+=60)for(let x=-40+((y/60)%2)*30;x<W+40;x+=60){const xx=x+ph%60;circle(xx,y,6);}}
      else{g.globalAlpha=Math.max(0,1-(t-f.te)/0.25)*0.9;g.fillStyle=PINK;g.fill('evenodd');g.globalAlpha=1;}}

// حزام عملات بعرض الشاشة وتحته شراشيب. ينفرد من اليسار لليمين بين ta و tu. y(t) مكانه

function L8Belt(o){const sp=26,cr=11,fs=22,n=Math.ceil((W+40)/sp)+1;
  const xm=t=>t<o.ta?-60:-20+(W+60)*L8ease((t-o.ta)/(o.tu-o.ta));

  const inSh=t=>{if(!o.sh)return false;const b=BT(t);return o.sh.some(s=>b>=s[0]&&b<s[1]);};
  const fl=i=>i%4===0?4:2;
  const fx=(i,t,d)=>(-20+i*sp)+12*L8hip(BT(t))*d/90;
  let dropped=false;
  return{
  update(t){if(o.drop!==undefined&&!dropped&&t>=B(o.drop)){dropped=true;for(let i=0;i<n;i+=2){const x=-20+i*sp;if(x<10||x>W-10)continue;const y=yb(x,t);for(let j=1;j<=fl(i);j++)hazards.push(L8Coin(fx(i,t,j*fs),y+j*fs,0,-60+j*20,650,10));}}
    if(t>o.te||o.y(t)<-160)this.dead=true;},
  draw(t){if(t<o.tw)return;
    if(t<o.ta){const k=clamp((t-o.tw)/(o.ta-o.tw),0,1);g.strokeStyle=`rgba(255,42,109,${0.15+0.4*k})`;g.lineWidth=3;g.setLineDash([10,8]);g.beginPath();for(let x=0;x<=W;x+=40){const y=yb(x,o.ta);x?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();g.setLineDash([]);
      g.fillStyle=`rgba(255,42,109,${0.05+0.12*k})`;g.fillRect(0,o.y(o.ta)-14,W,4*fs+28);return;}
    const m=xm(t),sh=inSh(t),jj=i=>sh?4*Math.sin(t*45+i*1.3):0;
    g.strokeStyle='rgba(255,42,109,0.18)';g.lineWidth=cr*3;g.lineCap='round';g.beginPath();for(let x=-20;x<=m;x+=40){const y=yb(x,t);x<=-20?g.moveTo(x,y):g.lineTo(x,y);}g.stroke();g.lineCap='butt';

      if(!dropped&&i%2===0){for(let j=1;j<=fl(i);j++)L8coin(fx(i,t,j*fs)+jj(i+j),y+j*fs,9,1);}
      L8coin(x,y,cr,1);}},
  hit(p,t){if(t<o.ta)return false;const m=xm(t);if(p.x>m+cr)return false;const y=yb(p.x,t);if(Math.abs(p.y-y)<cr+p.r-2)return true;
    if(dropped)return false;const dy=p.y-y;if(dy<0||dy>4*fs+cr)return false;const i0=Math.round((p.x+20)/sp);
    for(let i=i0-2;i<=i0+2;i++){if(i<0||i%2||-20+i*sp>m)continue;const L=fl(i)*fs;if(dy>L+9||dy<fs-9)continue;if(Math.abs(p.x-fx(i,t,clamp(dy,fs,L)))<9+p.r-2)return true;}return false;}};}
// "No fighting": كرتين عملات كبار يندفعون على بعض، وقبل ما يتضاربون يرتدون، وكل كرة تفك حلقة عملات

// ستارة عملات: خيوط عملات تتدلى من فوق (side 0) أو من تحت (side 1)
// X(k,t) مكان الخيط، len(k,t) طوله، tilt(k,t) ميلانه، wave(k,t,d) اهتزاز الوتر، sh أوقات الهزة

  const drop=t=>t<o.ta?0:t<o.ta+0.3?1-Math.pow(1-(t-o.ta)/0.3,3):t<o.te?1:Math.max(0,1-(t-o.te)/0.3);

  draw(t){if(t<o.tw)return;

      for(let k=0;k<n;k++){const l=L(k,o.ta);if(l<4)continue;g.moveTo(xd(k,o.ta,0),Y(0));g.lineTo(xd(k,o.ta,l),Y(l));}g.stroke();g.setLineDash([]);return;}
    const m=drop(t),sh=inSh(t);

  hit(p,t){if(t<o.ta||t>=o.te)return false;const m=drop(t),d=o.side?H-p.y:p.y;if(d<-cr)return false;
    for(let k=0;k<n;k++){const l=L(k,t)*m;if(l<cr||d>l+cr-2)continue;if(Math.abs(p.x-xd(k,t,clamp(d,0,l),false))<cr+p.r-2)return true;}return false;}};}
// علامة إسباني مقلوبة (¿ أو ¡) كبيرة تطيح من فوق وتنقلب

// مروحة إسبانية (أبانيكو): أضلاع عملات من نقطة وحدة، تنفتح وتلف. spread(t) فتحتها، rot(t) اتجاهها
function L8Fan(o){const cr=11,sp=28;

// راقصة رمادية عملاقة (ما تضر) وحزامها عملات وردية حول خصرها (يضر). x(t) مكانها، spin(t) لفة الحزام
// throws: الحزام يرمي عملات [{b,v,ev,gr}]، rip: الحزام يطلع حلقات بيضاوية تكبر [ضربات]
function L8Dancer(o){const s=o.s;

  const bc=(i,t)=>{const a=TAU*i/o.n+o.spin(t);return[hipX(t)+o.rx*Math.cos(a),hipY+o.ry*Math.sin(a),Math.sin(a),a];};

// حلقة بيضاوية عملات تكبر من خصر الراقصة

  update(t){if(rx*k(t)>1500)this.dead=true;},
  draw(t){const m=k(t);for(let i=0;i<n;i++){const a=ph+TAU*i/n,x=cx+Math.cos(a)*rx*m,y=cy+Math.sin(a)*ry*m;if(x<-20||x>W+20||y<-20||y>H+20)continue;L8coin(x,y,11,1);}},
  hit(p,t){const m=k(t);for(let i=0;i<n;i++){const a=ph+TAU*i/n;if(L8hitC(p,cx+Math.cos(a)*rx*m,cy+Math.sin(a)*ry*m,11))return true;}return false;}};}
// أثر قدم كبير يدعس على الضربة (يبان شفاف قبل). ang اتجاه أصابعه، mir القدم اليسار
function L8Foot(x,y,ang,s,tw,ta,te,mir){const c=Math.cos(ang),sn=Math.sin(ang),m=mir?-1:1;

// دوامة "go mad": أذرع عملات تلف حول النص، وكل ذراع فيه فراغ. R(t) طولها، rot(t) لفتها

      for(let i=0;i<o.arms;i++){const a=r0+TAU*i/o.arms;g.moveTo(cx,cy);g.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);}g.stroke();g.setLineDash([]);return;}

// "reading the signs": لوحات أسهم تطلع ورا بعض فوق مثل جملة، وبعدها كل وحدة تتنفذ بالترتيب
// السهم يأشر على النص الآمن، والنص الثاني يضر. d: 0 يمين، 1 تحت، 2 يسار، 3 فوق
function L8Signs(ds,apps,tas,dur){const n=ds.length,reg=d=>d===0?[0,0,W/2,H]:d===2?[W/2,0,W/2,H]:d===1?[0,0,W,H/2]:[0,H/2,W,H/2];

// ضو مسرح وردي من فوق يكنس. ang(t) اتجاهه

// جهاز كشف الكذب: ورق رسم بياني رمادي، وإبر ترسم خط وردي يمشي لليسار. nd: [{y(u), pen(u)}] u = وقت الجهاز

// "the attraction": جدارين عملات (فيهم فتحة) ينجذبون لبعض ويتلاقون بالنص. مغناطيسين رماديين على الأطراف

// "the tension": حبل مشدود عرض الشاشة يهتز مع الإيقاع ويزيد، وبعدين ينقطع ويطيح عملات

// "this is perfection": ماندالا عملات: الحلقات تتجمع (شفافة لين ta)، تلف عكس بعض، وعلى tb تنفجر لبرا بخطوط مستقيمة

// vert: الحبل عمودي. a0 مكانه، dir اتجاهه، unit طول الخطوة. clip: [x0,x1] يبان بس بهالجزء. lan: فوانيس
function L8Chain(o){const L=o.vert?H:W,PL=o.vert?W:H,sp=o.lan?36:26,cr=12,n=Math.ceil((L+80)/sp)+1;

  const pt=(k,t,a)=>{const u=-40+k*sp,c=a+off(u);return o.vert?[c+sw(u,t),u]:[u,c+sw(u,t)];};

  draw(t){if(t<tw)return;const a=pos(t);clipOn();

    g.strokeStyle='rgba(255,42,109,0.18)';g.lineWidth=cr*3;g.lineCap='round';
    for(const seg of [[-40,gc-gw/2],[gc+gw/2,L+40]]){if(seg[1]<=seg[0])continue;g.beginPath();for(let u=seg[0];u<=seg[1];u+=40){const c=a+off(u);o.vert?(u===seg[0]?g.moveTo(c,u):g.lineTo(c,u)):(u===seg[0]?g.moveTo(u,c):g.lineTo(u,c));}g.stroke();}
    g.lineCap='butt';
    for(let i=0;i<n;i++){const u=-40+i*sp;if(inGap(u))continue;const[x,y]=pt(i,t,a);

  hit(p,t){if(t<ta)return false;if(o.clip&&(p.x<o.clip[0]||p.x>o.clip[1]))return false;const a=pos(t),u=o.vert?p.y:p.x,v=o.vert?p.x:p.y;if(Math.abs(v-(a+off(u)+sw(u,t)))>=cr+p.r-2)return false;return Math.abs(u-gc)>gw/2-p.r+2;}};}

// موجة صوت مقوسة تطلع من فوهة الترومبيت. mr: تختفي بعد هالمسافة (نفخة صغيرة)

function L8Beam(x1,y1,a,len,w,tw,ta,te){const c=Math.cos(a),s=Math.sin(a);return{

/* ================= الحلقة الرئيسية ================= */
let last=performance.now();
const tick=()=>{},pick=()=>{};
let capAt=0,pumping=false,vsDirty=false,nextAt=0,fpsN=0,fpsAt=0,fpsVal=0;
const pumpCh=new MessageChannel();
function frame(now){
  if(!vsyncOn&&!document.hidden){if(!pumping){pumping=true;nextAt=performance.now();pumpCh.port2.postMessage(0);requestAnimationFrame(vsDraw);}return;}
  if(fpsCap){const iv=1000/fpsCap;if(capAt&&now-capAt<iv-0.7){requestAnimationFrame(frame);return;}capAt=(capAt&&now-capAt<iv*2)?capAt+iv:now;}
  step(now);requestAnimationFrame(frame);
}
pumpCh.port1.onmessage=()=>{
  if(vsyncOn||document.hidden){pumping=false;capAt=0;requestAnimationFrame(frame);return;}
  const now=performance.now(),iv=1000/fpsCap;
  if(now>=nextAt){nextAt=now-nextAt>iv*2?now+iv:nextAt+iv;step(now,true);vsDirty=true;}
  if(nextAt-now>6)setTimeout(()=>pumpCh.port2.postMessage(0),nextAt-now-5);else pumpCh.port2.postMessage(0);
};
// V-Sync طافي: اللعبة تمشي بسرعة الـ Framecap، والرسم مرة وحدة مع كل تحديث للشاشة (الرسم الزايد ما ينشاف ويسبب تقطيع)
function vsDraw(){if(!pumping)return;if(vsDirty){vsDirty=false;draw(performance.now());}requestAnimationFrame(vsDraw);}
function step(now,nd){
  const dt=Math.min(0.05,Math.max(0,now-last)/1000);last=now;fdt=dt;
  const inp=readInput();syncField();
  if(acc&&acc.dirty&&!syncing&&now-lastSyncTry>30000&&!['play','starting','levelIntro'].includes(state))sync();
  if(state==='gate'){if((f11Hit||fsOK())&&menuBuf){ensureAudio();gatePressAt=now;gatePassed=true;state='gateWait';}f11Hit=false;}
  else if(state==='gateWait'){if(actx.state==='running'){playMenu(0);state='splash';}else if(now-gatePressAt>600){gateHint=true;if(inp.any)ensureAudio();}}
  else if(state==='splash'){if(menuPos()>=MENU_DROP){goMain(now);}else if(inp.any&&menuPos()>1.2){stopMenu();playMenu(MENU_DROP);goMain(now);}}
  else if(state==='news'){const np=newsPages(),pg=d=>{newsPg+=d;newsPgAt=now;newsDir=d;tick();};
    if(inp.left&&newsPg<np-1)pg(1);else if(inp.right&&newsPg>0)pg(-1);
    else if(now-newsAt>700&&inp.confirm&&newsPg<np-1)pg(1);else if(now-newsAt>700&&(inp.confirm||inp.back||inp.pz))newsDone(now);}
  else if(state==='main'){
    const MO=[5,...MAIN.map(m=>m[1]),4],mn=MO.length;
    if(menuSel===ACC){if(inp.down)menuSel=0;else if(inp.up)menuSel=4;else if(inp.right)menuSel=5;}
    else{const mi=MO.indexOf(menuSel);if(inp.up)menuSel=MO[(mi+mn-1)%mn];else if(inp.down)menuSel=MO[(mi+1)%mn];
    else if(inp.right&&menuSel!==5)menuSel=5;else if(inp.left)menuSel=ACC;}
    if(inp.confirm){if(menuSel===4)setEasy(!easy);else if(menuSel===5)state='points';else if(menuSel===EXIT)window.close();
      else if(menuSel===ACC){state='account';accSel=0;authMsg='';logoutArm=0;}
      else if(menuSel===BOARD){state='board';board.mode=easy?'e':'n';board.sel=-1;loadBoard(false);}
      else state=['levels','friends','howto','settings'][menuSel];}
  }
  else if(state==='levels'){
    if(inp.left&&lvlSel<LEVELS.length-1){lvlSel++;tick();}
    if(inp.right&&lvlSel>0){lvlSel--;tick();}
    if((inp.sq||inp.restart)&&!inp.confirm){const L=LEVELS[lvlSel];if(L.ok&&L.buf){if(inp.sq)openPractice(L,'levels');else openBot(L,'levels');}else shakeCard=0.4;}
    else if(inp.confirm){const L=LEVELS[lvlSel];if(L.ok&&L.buf){pick();startLevel(L,'levels');}else{shakeCard=0.4;}}
    else if(inp.back||inp.pz){tick();state='main';}
  }
  else if(state==='friends'){
    if(inp.left&&friSel<FRIENDS.length-1)friSel++;
    if(inp.right&&friSel>0)friSel--;
    if((inp.sq||inp.restart)&&!inp.confirm){const L=FRIENDS[friSel];if(L.buf){if(inp.sq)openPractice(L,'friends');else openBot(L,'friends');}else shakeCard=0.4;}
    else if(inp.confirm){const L=FRIENDS[friSel];if(L.buf)startLevel(L,'friends');else shakeCard=0.4;}
    else if(inp.back||inp.pz)state='main';
  }
  else if(state==='howto'){if(inp.back||inp.pz||inp.confirm){tick();state='main';}}
  else if(state==='points'){if(inp.back||inp.pz||inp.confirm)state='main';}
  else if(state==='account'){
    if(acc){logoutArm=Math.max(0,logoutArm-dt);if(inp.confirm){if(logoutArm>0){logout();logoutArm=0;accSel=0;authMsg='';}else logoutArm=3;}else if(inp.back||inp.pz)state='main';}
    else{if(keys.Tab){keys.Tab=false;accSel=(accSel+1)%4;}
      if(inp.down)accSel=Math.min(3,accSel+1);else if(inp.up)accSel=Math.max(0,accSel-1);
      else if(inp.confirm&&!authBusy){if(accSel===0)accSel=1;else if(accSel===1||accSel===2)doAuth(false,nameVal,passVal);else doAuth(true,nameVal,passVal);}
      else if(inp.pz||(inp.back&&accSel>1)){state='main';authMsg='';}}
  }
  else if(state==='board'){const n=ALL_LV().length,ms0=boardModes();
    if(inp.left&&board.idx<n){board.idx++;board.sel=-1;tick();}else if(inp.right&&board.idx>0){board.idx--;board.sel=-1;tick();}
    if(!boardModes().includes(board.mode))board.mode=easy?'e':'n';
    const vis=boardVisible();if(board.sel<0||board.sel>=vis.length){const mi=vis.findIndex(x=>x.me);board.sel=mi>=0?mi:0;}
    if(inp.down&&board.sel<vis.length-1){board.sel++;tick();}else if(inp.up&&board.sel>0){board.sel--;tick();}
    if(inp.restart){const ms=boardModes();board.mode=ms[(ms.indexOf(board.mode)+1)%ms.length];board.sel=-1;tick();}
    else if(inp.confirm&&vis.length){tick();openProfile(vis[board.sel].p);}
    else if(inp.back||inp.pz)state='main';
    if(!board.busy&&performance.now()-board.at>60000)loadBoard(false);}
  else if(state==='settings'||state==='pauseSet'){const rows=setRows();if(setSel>=rows.length)setSel=0;const r=rows[setSel],d=inp.right?1:inp.left?-1:0;
    if(inp.up)setSel=(setSel+rows.length-1)%rows.length;else if(inp.down)setSel=(setSel+1)%rows.length;
    else if(d&&r==='vol')setVol(vol+0.1*d);
    else if((d||inp.confirm)&&r==='fs'){if(isFull())exitFS();else enterFS();}
    else if((d||inp.confirm)&&r==='vsync')setVsync(!vsyncOn);
    else if((d||inp.confirm)&&r==='counter')setFpsShow(!fpsShow);
    else if(d&&r==='fps'){let i=FPS_LIST.indexOf(fpsCap);if(i<0)i=4;setFps(FPS_LIST[clamp(i+d,0,FPS_LIST.length-1)]);}
    else if(d&&r==='res'){const L=resList();let i=L.indexOf(resSet);if(i<0)i=0;setRes(L[(i+L.length+d)%L.length]);}
    else if(inp.back||inp.pz||inp.confirm)state=state==='pauseSet'?'paused':'main';}
  else if(state==='profile'){const n=ALL_LV().length;prof.msgT-=dt;{const t=profScT();prof.sc+=(t-prof.sc)*Math.min(1,dt*14);if(Math.abs(t-prof.sc)<0.002)prof.sc=t;}
    if(inp.down&&prof.row<n-1){prof.row++;tick();}else if(inp.up&&prof.row>0){prof.row--;tick();}
    if(inp.left&&prof.col===0){prof.col=1;tick();}else if(inp.right&&prof.col===1){prof.col=0;tick();}
    if(inp.confirm){const L=ALL_LV()[prof.row],m=prof.col?'e':'n',r=prof.p[m][L.id];if(r&&hasRp(prof.p,L,m)){tick();openReplay(prof.p,L,m);}else{prof.msg=!r?'ما خلّص هذي المرحلة للحين':prof.busy?'لحظة، جاري التحميل…':'ما فيه Replay لهذي المرحلة';prof.msgT=2.2;}}
    else if(inp.back||inp.pz)state='board';}
  else if(state==='rpLoad'){if(inp.back||inp.pz)state=rp.bot?rp.back:'profile';else if(rp.doc&&rp.L.buf&&actx.state==='running')rpStart();else ensureAudio();}
  else if(['replay','rpGap','rpEnd'].includes(state)){
    if(inp.back||inp.pz)exitReplay();
    else{rpInput(inp,dt);
      if(state==='replay')updateReplay(dt);
      else if(state==='rpGap'){if(rp.paused)rp.gapAt+=dt*1000;else if(performance.now()-rp.gapAt>1300/Math.max(1,rp.rate))rpSeg(rp.seg+1);}}}
  else if(state==='practice')prMenuInput(inp);
  else if(state==='prStarting'){if(actx.state==='running'&&cur.buf)prBegin();else ensureAudio();}
  else if(state==='prEnd'){if(performance.now()-winAt>600&&inp.confirm)prGo();else if(inp.back||inp.pz)prToMenu();}
  else if(state==='starting'){
    if(actx.state==='running'&&cur.buf){if(startBeat===0&&introOn){introOn=false;state='levelIntro';introAt=now;player=null;hazards=[];particles=[];}else beginRun(startBeat);}
    else if(now-startReqAt>500)audioHint=true;
  }
  else if(state==='levelIntro'){if(now-introAt>3200)beginRun(0);}
  else if(state==='play'){if(inp.pz)pause();else{updatePlay(pr.on?dt*spd:dt,inp);if(pr.on)cpMsg=0;}}
  else if(state==='paused'&&pr.on)prPauseInput(inp);
  else if(state==='paused'){
    const pn=PAUSE.length;if(inp.up)pauseSel=(pauseSel+pn-1)%pn;if(inp.down)pauseSel=(pauseSel+1)%pn;
    if(inp.pz||inp.back)resume();
    else if(inp.confirm){if(pauseSel===0)resume();else if(pauseSel===1){stopMusic();requestStart(checkpoint);}else if(pauseSel===2){stopMusic();requestStart(0);}else if(pauseSel===3){state='pauseSet';setSel=0;}else{stopMusic();player=null;hazards=[];state=fromList;actx.resume().catch(()=>{});}}
  }
  else if(state==='dead'&&pr.on){if(now-deadAt>700&&inp.confirm)prGo();else if(inp.back)prToMenu();}
  else if(state==='dead'){if(now-deadAt>700&&inp.confirm)requestStart(checkpoint);else if(now-deadAt>700&&inp.restart)requestStart(0);else if(inp.back)toMenu();}
  else if(state==='win'){if(now-winAt>800&&inp.confirm){stopMusic();requestStart(0);}else if(inp.back){stopMusic();player=null;hazards=[];state=fromList;}}
  pvUpdate(now);
  if(pv.src||pv.had){if(menuSrc)stopMenu();}
  else if(['main','levels','howto','settings','friends','points','account','board','profile','rpLoad','practice','news'].includes(state)){if(!menuSrc&&menuBuf&&actx.state==='running')playMenu(MENU_DROP);}else if(menuSrc&&state!=='splash')stopMenu();
  const edt=['replay','rpGap','rpEnd'].includes(state)?(rp.paused?0:dt*rp.rate):dt;
  for(const q of particles){q.x+=q.vx*edt;q.y+=q.vy*edt;const f=Math.pow(0.04,edt);q.vx*=f;q.vy*=f;q.life-=edt;}
  particles=particles.filter(q=>q.life>0);
  gloom+=(gloomT-gloom)*Math.min(1,edt*3);shake=Math.max(0,shake-edt*50);flash=Math.max(0,flash-edt*2.2);cpMsg-=edt;toastT-=dt;shakeCard=Math.max(0,shakeCard-dt);
  {const k=Math.min(1,dt*12);if(lvlSel<lvlFirst)lvlFirst=lvlSel;else if(lvlSel>lvlFirst+3)lvlFirst=lvlSel-3;if(friSel<friFirst)friFirst=friSel;else if(friSel>friFirst+3)friFirst=friSel-3;
  const lt=clamp(lvlFirst,0,Math.max(0,LEVELS.length-4)),ft=clamp(friFirst,0,Math.max(0,FRIENDS.length-4));lvlScr+=(lt-lvlScr)*k;friScr+=(ft-friScr)*k;if(Math.abs(lt-lvlScr)<0.001)lvlScr=lt;if(Math.abs(ft-friScr)<0.001)friScr=ft;}
  if(!nd)draw(now);
  fpsN++;if(now-fpsAt>=500){fpsVal=fpsAt?Math.round(fpsN*1000/(now-fpsAt)):0;fpsN=0;fpsAt=now;}
  if(fpsShow&&fpsVal){g.setTransform(scale,0,0,scale,offX,offY);g.font=`800 22px ${FONT}`;g.textAlign='right';g.textBaseline='bottom';g.direction='ltr';
    g.lineWidth=4;g.strokeStyle='rgba(0,0,0,0.7)';g.strokeText(fpsVal+' FPS',W-14,H-10);g.fillStyle='rgba(255,255,255,0.85)';g.fillText(fpsVal+' FPS',W-14,H-10);g.direction='rtl';}
}
for(const L of [...LEVELS,...FRIENDS]){if(!L.name)continue;try{const v=localStorage.getItem('mg_best_'+L.name);if(RANKS.includes(v)){if(localStorage.getItem('mg_bestez_'+L.name)==='1'){localStorage.setItem('mg_beste_'+L.name,v);localStorage.removeItem('mg_best_'+L.name);}else L.best=v;}localStorage.removeItem('mg_bestez_'+L.name);const ve=localStorage.getItem('mg_beste_'+L.name);if(RANKS.includes(ve))L.bestE=ve;}catch(e){}}
dec(SONG_MENU).then(b=>{MENUS.normal.buf=b;applyMenu();}).catch(()=>{});
if(typeof SONG_EZ==='string')dec(SONG_EZ).then(b=>{MENUS.easy.buf=b;applyMenu();}).catch(()=>{});
dec(SONG_L1).then(b=>{LEVELS[0].buf=b;}).catch(()=>{LEVELS[0].err=true;});
dec(SONG_L2).then(b=>{LEVELS[1].buf=b;}).catch(()=>{LEVELS[1].err=true;});
dec(SONG_L3).then(b=>{LEVELS[2].buf=b;}).catch(()=>{LEVELS[2].err=true;});
dec(SONG_L4).then(b=>{LEVELS[3].buf=b;}).catch(()=>{LEVELS[3].err=true;});
dec(SONG_L5).then(b=>{LEVELS[4].buf=b;}).catch(()=>{LEVELS[4].err=true;});
if(typeof SONG_L6==='string')dec(SONG_L6).then(b=>{LEVELS[5].buf=b;}).catch(()=>{LEVELS[5].err=true;});
if(typeof SONG_L7==='string')dec(SONG_L7).then(b=>{LEVELS[6].buf=b;}).catch(()=>{LEVELS[6].err=true;});
if(typeof SONG_L8==='string'){const i8=LEVELS.findIndex(l=>l.id==='L8');dec(SONG_L8).then(b=>{LEVELS[i8].buf=b;}).catch(()=>{LEVELS[i8].err=true;});}
if(typeof SONG_L10==='string'){const i10=LEVELS.findIndex(l=>l.id==='L10');dec(SONG_L10).then(b=>{LEVELS[i10].buf=b;}).catch(()=>{LEVELS[i10].err=true;});}
if(typeof SONG_L11==='string'){const i11=LEVELS.findIndex(l=>l.id==='L11');dec(SONG_L11).then(b=>{LEVELS[i11].buf=b;}).catch(()=>{LEVELS[i11].err=true;});}
if(typeof SONG_L9==='string'){const i9=LEVELS.findIndex(l=>l.name==='المرحلة التاسعة');dec(SONG_L9).then(b=>{LEVELS[i9].buf=b;}).catch(()=>{LEVELS[i9].err=true;});}
dec(SONG_F1).then(b=>{FRIENDS[0].buf=b;}).catch(()=>{FRIENDS[0].err=true;});
dec(SONG_F2).then(b=>{FRIENDS[1].buf=b;}).catch(()=>{FRIENDS[1].err=true;});
dec(SONG_F3).then(b=>{FRIENDS[2].buf=b;}).catch(()=>{FRIENDS[2].err=true;});
dec(SONG_F4).then(b=>{FRIENDS[3].buf=b;}).catch(()=>{FRIENDS[3].err=true;});
if(typeof SONG_F5==='string')dec(SONG_F5).then(b=>{FRIENDS[4].buf=b;}).catch(()=>{FRIENDS[4].err=true;});
if(typeof SONG_F6==='string')dec(SONG_F6).then(b=>{FRIENDS[5].buf=b;}).catch(()=>{FRIENDS[5].err=true;});
if(typeof SONG_F7==='string')dec(SONG_F7).then(b=>{FRIENDS[6].buf=b;}).catch(()=>{FRIENDS[6].err=true;});
if(typeof SONG_F8==='string'){const f8=FRIENDS.findIndex(l=>l.id==='F8');dec(SONG_F8).then(b=>{FRIENDS[f8].buf=b;}).catch(()=>{FRIENDS[f8].err=true;});}
if(acc)sync();
requestAnimationFrame(frame);
})();
