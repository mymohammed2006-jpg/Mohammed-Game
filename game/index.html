    g.font=`800 26px ${FONT}`;g.textAlign='center';g.textBaseline='middle';for(let i=0;i<12;i++){const na=-Math.PI/2+i*TAU/12,rec=t-shotAt[i]<0.5;g.fillStyle=rec?'rgba(255,255,255,0.15)':GREY+'0.8)';g.fillText(AR_NUM[i],Math.cos(na)*(R-28),Math.sin(na)*(R-28)+2);}
    g.strokeStyle=PINK;g.lineCap='round';g.shadowColor=PINK;g.shadowBlur=live?18:0;g.lineWidth=12;g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(mA)*L,Math.sin(mA)*L);g.stroke();
    g.lineWidth=16;g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(mA/12-Math.PI*0.4)*R*0.55,Math.sin(mA/12-Math.PI*0.4)*R*0.55);g.stroke();g.shadowBlur=0;g.fillStyle=PINK;circle(0,0,14);
    g.restore();g.globalAlpha=1;},
  hit(p,t){if(t<ts+SPB*4)return false;if(Math.hypot(p.x-cx,p.y-cy)<R+6+p.r)return true;return segDist(p.x,p.y,[cx,cy],[cx+Math.cos(mA)*L,cy+Math.sin(mA)*L])<6+p.r;}};}

/* ================= مرحلة: انتظرتك سنين وأيام طوال (اختيار Nice) =================
   الضربات متتبعة (حوالي ١٥٧ نصف ضربة بالدقيقة). المقطع من ٠:٤٨ إلى ٢:١٩.
   ٠ الساعات تدق | ١٦ أوراق التقويم "سنين وأيام" | ٤٨ "سؤال"
   ٨٠ حفظ ← "شمس النهار" | ٩٦ "نجوم الليل" | ١١٢ الساعة الرملية "ما أقوى الصبر" + رسايل "جواب" ما توصل
   ١٦٠ حفظ ← الساعة الكبيرة | ٢٢٨ تنكسر */
function buildFriend3(){
  const E=[],R=mulberry32(1503),ev=(b,f)=>E.push({b,f});
  const rx=(a=140,b=W-140)=>a+R()*(b-a),ry=(a=120,b=H-120)=>a+R()*(b-a);
  const TI=ezT([{sp:345,wn:1.5},{sp:385,wn:1.3},{sp:405,wn:1.25}]);
  const clock=(hit,x,y,Rr,T,dur,a0)=>ev(hit-T.wn,()=>hazards.push(MiniClock(x,y,Rr,B(hit-T.wn),B(hit),B(hit+dur),a0)));
  const page=(b,x,T,vx=0)=>ev(b,()=>hazards.push(CalPage(x,-60,vx,T.sp*0.62,70,86,String(1+Math.floor(R()*30)))));
  const pageSide=(b,fromLeft,y,T)=>ev(b,()=>hazards.push(CalPage(fromLeft?-60:W+60,y,(fromLeft?1:-1)*T.sp*0.8,20,70,86,String(1+Math.floor(R()*30)))));
  const qmark=(hit,x,y,T,s=150)=>ev(hit-T.wn,()=>hazards.push(QMark(x,y,s,B(hit-T.wn),B(hit),B(hit+2),T.sp*0.85)));
  const qmarkP=(hit,T,s=140)=>{const jx=(R()*2-1)*100,jy=(R()*2-1)*80;ev(hit-T.wn,()=>{const x=clamp((player?player.x:W/2)+jx,90,W-90),y=clamp((player?player.y:H/2)+jy,90,H-90);hazards.push(QMark(x,y,s,B(hit-T.wn),B(hit),B(hit+2),T.sp*0.85));});};
  const star=(hit,x,y,ang,T)=>ev(hit-T.wn,()=>hazards.push(Star(x,y,B(hit-T.wn),B(hit),ang,T.sp*1.4)));
  const starP=(hit,x,y,T)=>ev(hit-T.wn,()=>{const a=player?Math.atan2(player.y-y,player.x-x):Math.PI/2;hazards.push(Star(x,y,B(hit-T.wn),B(hit),a,T.sp*1.35));});
  const env=(b,T,fromLeft)=>ev(b,()=>{if(!player)return;const x=fromLeft?-30:W+30,y=clamp(player.y+(R()*2-1)*120,40,H-40),a=Math.atan2(player.y-y,player.x-x);hazards.push(Envelope(x,y,Math.cos(a)*T.sp,Math.sin(a)*T.sp));});

  /* ---------- القسم الأول ---------- */
  let T=TI[0];
  // ٠:٤٨ الانتظار: ساعات تطلع وتدق مع كل ضربة
  clock(4,W*0.25,H*0.35,120,T,24,-Math.PI/2);clock(8,W*0.75,H*0.65,120,T,22,Math.PI/2);clock(14,W*0.5,H*0.5,100,T,14,0);
  for(let b=6;b<16;b+=2)qmark(b+1,rx(),ry(),T,100);for(let b=8;b<16;b+=2)page(b,rx(80,W-80),T);clock(10,W*0.5,H*0.2,90,T,10,Math.PI/2);
  // ٠:٥٤ "سنين وأيام": أوراق التقويم تنشق وتطير
  for(let b=16;b<48;b++){page(b,rx(80,W-80),T,(R()*2-1)*60);if(b%4===1)pageSide(b+0.5,b%8===1,ry(),T);}
  clock(28,W*0.2,H*0.5,110,T,16,0);clock(36,W*0.8,H*0.5,110,T,10,Math.PI);for(let b=18;b<48;b+=3)qmarkP(b+1,T,110);
  // ١:٠٦ "أو حتى سؤال": علامات استفهام تنزل ونقطتها تنط
  for(let b=48;b<80;b+=2){qmarkP(b,T);page(b+1,rx(80,W-80),T);if(b%4===0)qmark(b+1,rx(),ry(),T,120);}
  clock(52,W*0.2,H*0.3,100,T,12,0);clock(66,W*0.8,H*0.7,100,T,12,Math.PI);
  clock(60,W*0.5,H*0.5,130,T,16,-Math.PI/2);
  /* ---------- القسم الثاني ---------- */
  T=TI[1];
  ev(80,()=>{flash=Math.max(flash,0.22);shake=Math.max(shake,9);});
  // ١:١٨ "يا شمس النهار": شمس تعبر الساحة
  ev(80,()=>hazards.push(Sun(B(80),B(96),H*0.55,300)));clock(82,W*0.25,H*0.7,100,T,12,0);clock(86,W*0.75,H*0.7,100,T,10,Math.PI);
  for(let b=82;b<96;b++){page(b,rx(80,W-80),T);if(b%2===0)qmarkP(b+0.5,T,120);}
  // ١:٢٤ "يا نجوم الليل": قمر ونجوم تطيح شهب
  ev(95,()=>hazards.push(Moon(B(95),B(113))));
  for(let b=96;b<112;b+=0.5){const x=rx(60,W-60);if(b%1===0)starP(b+1,x,20+R()*120,T);else star(b+1,x,20+R()*100,Math.PI/2+(R()*2-1)*0.5,T);}
  clock(100,W*0.3,H*0.6,110,T,10,0);clock(104,W*0.7,H*0.4,110,T,8,Math.PI);for(let b=98;b<112;b+=2)qmarkP(b,T,110);clock(84,W*0.5,H*0.25,100,T,10,0);clock(98,W*0.2,H*0.75,100,T,12,0);clock(102,W*0.8,H*0.75,100,T,10,Math.PI);
  // ١:٣٠ "ما أقوى الصبر": ساعة رملية تنقلب، ورسايل "جواب" ما توصل
  {const fl=[124,136,148].map(B);ev(112,()=>hazards.push(Hourglass(W/2,H/2-60,B(112),B(158),fl,T)));}
  for(let b=114;b<158;b++){env(b,T,b%2===0);if(b%2===1)env(b+0.5,T,b%4===1);if(b%4===2)page(b+0.5,rx(80,W-80),T);starP(b+0.5,rx(80,W-80),30,T);if(b%2===0)qmarkP(b+0.5,T,110);}
  clock(126,W*0.5,H*0.85,95,T,20,0);clock(116,W*0.18,H*0.3,105,T,18,0);clock(120,W*0.82,H*0.7,105,T,18,Math.PI);clock(136,W*0.18,H*0.7,105,T,20,0);clock(140,W*0.82,H*0.3,105,T,18,Math.PI);
  /* ---------- القسم الثالث (الزعيم) ---------- */
  T=TI[2];const TT=T;
  ev(160,()=>hazards.push(GreatClock(B(160),B(228),TT)));
  for(let b=166;b<226;b+=1){env(b,T,b%2===0);if(b%2)continue;if(b%4===2)qmarkP(b+1,T,110);else page(b+1,rx(80,W-80),T);}
  for(let b=168;b<224;b+=0.5)starP(b+0.25,rx(80,W-80),20,T);
  clock(172,W*0.15,H*0.5,100,T,24,0);clock(180,W*0.85,H*0.5,100,T,24,Math.PI);
  E.sort((a,b)=>a.b-b.b);return E;
}

/* ================= أشكال مرحلة: MEGALOVANIA ================= */
const GC=8,GR=4,GW=W/GC,GH=H/GR;
// خانة بعدّاد: رقمها ينزل مع كل ضربة، وتضرب لما يوصل صفر
function CountTile(i,j,tw,ta,te){const x=i*GW,y=j*GH;return{
  update(t){if(t>te+0.25)this.dead=true;},
  draw(t){if(t<ta){const n=Math.max(1,Math.ceil((ta-t)/SPB-1e-6)),k=clamp((t-tw)/(ta-tw),0,1);g.fillStyle=`rgba(255,42,109,${0.06+0.14*k})`;g.fillRect(x+4,y+4,GW-8,GH-8);g.strokeStyle='rgba(255,42,109,0.75)';g.lineWidth=2;g.strokeRect(x+10,y+10,GW-20,GH-20);
      g.font=`800 ${n===1?70:56}px ${FONT}`;g.fillStyle=n===1?'rgba(255,42,109,0.95)':'rgba(255,42,109,0.6)';g.textAlign='center';g.textBaseline='middle';g.fillText(ar(n),x+GW/2,y+GH/2+4);}
    else{const a=t<te?1:Math.max(0,1-(t-te)/0.25);g.globalAlpha=a;g.save();g.shadowColor=PINK;g.shadowBlur=18;g.fillStyle=(t-ta)<0.07?'#fff':PINK;g.fillRect(x+3,y+3,GW-6,GH-6);g.restore();g.globalAlpha=1;}},
  hit(p,t){return t>=ta&&t<te&&Math.abs(p.x-(x+GW/2))<GW/2-3+p.r&&Math.abs(p.y-(y+GH/2))<GH/2-3+p.r;}};}
// الذاكرة: خانات تومض بالترتيب، وبعدين تضرب بنفس الترتيب بسرعة
function Memory(cells,show0,showStep,strike0,strikeStep){const dur=Math.max(0.12,strikeStep*0.75);return{
  update(t){if(t>strike0+cells.length*strikeStep+0.5)this.dead=true;},
  draw(t){cells.forEach(([i,j],k)=>{const x=i*GW,y=j*GH,s0=show0+k*showStep,a0=strike0+k*strikeStep;
      if(t>=s0&&t<s0+showStep*0.85){const q=1-(t-s0)/(showStep*0.85);g.fillStyle=`rgba(255,42,109,${0.15+0.3*q})`;g.fillRect(x+4,y+4,GW-8,GH-8);g.font=`800 52px ${FONT}`;g.fillStyle='rgba(255,255,255,0.85)';g.textAlign='center';g.textBaseline='middle';g.fillText(ar(k+1),x+GW/2,y+GH/2+4);}
      if(t>=strike0-0.6&&t<a0){g.strokeStyle='rgba(255,42,109,0.18)';g.lineWidth=2;g.strokeRect(x+12,y+12,GW-24,GH-24);}
      if(t>=a0-0.1&&t<a0){g.strokeStyle='rgba(255,42,109,0.9)';g.lineWidth=4;g.strokeRect(x+8,y+8,GW-16,GH-16);}
      if(t>=a0&&t<a0+dur+0.2){const a=t<a0+dur?1:1-(t-a0-dur)/0.2;g.globalAlpha=a;g.save();g.shadowColor=PINK;g.shadowBlur=18;g.fillStyle=(t-a0)<0.06?'#fff':PINK;g.fillRect(x+3,y+3,GW-6,GH-6);g.restore();g.globalAlpha=1;}});},
  hit(p,t){for(let k=0;k<cells.length;k++){const a0=strike0+k*strikeStep;if(t>=a0&&t<a0+dur){const[i,j]=cells[k],x=i*GW,y=j*GH;if(Math.abs(p.x-(x+GW/2))<GW/2-3+p.r&&Math.abs(p.y-(y+GH/2))<GH/2-3+p.r)return true;}}return false;}};}
// مدفع: يشحن ويطلق شعاع عريض
function Cannon(x,y,ang,tw,ta,te,bw=46){const len=2400;return{
  update(t){if(t>te+0.3)this.dead=true;},
  draw(t){const k=clamp((t-tw)/(ta-tw),0,1),act=t>=ta&&t<te,a=t<te?1:Math.max(0,1-(t-te)/0.3);g.save();g.translate(x,y);g.rotate(ang);g.globalAlpha=a;
    if(t<ta){g.fillStyle=`rgba(255,42,109,${0.04+0.12*k})`;g.fillRect(30,-bw/2,len,bw);g.fillStyle=`rgba(255,42,109,${0.3+0.5*k})`;g.fillRect(30,-1.5,len,3);g.strokeStyle=`rgba(255,42,109,${0.4+0.5*k})`;g.lineWidth=3;g.beginPath();g.arc(36,0,10+30*(1-k),0,TAU);g.stroke();}
    else if(act){const fl=Math.max(0,1-(t-ta)/0.12),ww=bw*(1+0.12*pulse);g.shadowColor=PINK;g.shadowBlur=26;g.fillStyle=PINK;g.fillRect(30,-ww/2,len,ww);if(fl>0){g.globalAlpha=fl;g.fillStyle='#fff';g.fillRect(30,-ww/2,len,ww);g.globalAlpha=1;}}
    g.fillStyle=act?PINK:`rgba(255,42,109,${0.45+0.4*k})`;g.beginPath();g.moveTo(42,0);g.lineTo(0,-24);g.lineTo(-16,-12);g.lineTo(-16,12);g.lineTo(0,24);g.closePath();g.fill();g.fillStyle='#000';g.fillRect(-6,-5,14,10);
    g.restore();g.globalAlpha=1;},
  hit(p,t){if(t<ta||t>=te)return false;return obbHit(p.x,p.y,p.r,x+Math.cos(ang)*(30+len/2),y+Math.sin(ang)*(30+len/2),len/2,bw/2,ang)||Math.hypot(p.x-x,p.y-y)<24+p.r;}};}
// جدار كامل ما ينعبر إلا بالاندفاع على الإيقاع
function DashWall(dir,tw,ta,sp,th=26,tag=false){const vert=dir==='L'||dir==='R',sg=(dir==='L'||dir==='U')?-1:1,ext=vert?W:H,st=sg<0?ext+th:-th,pos=t=>st+sg*sp*(t-ta);return{
  update(t){const p=pos(t);if(t>ta&&(p<-th*2||p>ext+th*2))this.dead=true;},
  draw(t){if(t<ta){const k=clamp((t-tw)/(ta-tw),0,1);g.fillStyle=`rgba(255,42,109,${0.25+0.5*k})`;const n=8;for(let i=0;i<n;i++){const c=(i+0.5)/n*(vert?H:W),o=((t*3)%1)*30;g.save();if(vert){g.translate(sg<0?W-50-o:50+o,c);if(sg<0)g.scale(-1,1);}else{g.translate(c,sg<0?H-50-o:50+o);g.rotate(sg<0?-Math.PI/2:Math.PI/2);}
        g.beginPath();g.moveTo(-10,-14);g.lineTo(6,0);g.lineTo(-10,14);g.lineTo(-4,0);g.closePath();g.fill();g.translate(16,0);g.beginPath();g.moveTo(-10,-14);g.lineTo(6,0);g.lineTo(-10,14);g.lineTo(-4,0);g.closePath();g.fill();g.restore();}
      if(tag){g.globalAlpha=0.4+0.5*k;txt('اندفع!',W/2,H/2-150,44,PINK);g.globalAlpha=1;}return;}
    const p=pos(t);g.save();g.shadowColor=PINK;g.shadowBlur=22;g.fillStyle=PINK;if(vert)g.fillRect(p-th/2,0,th,H);else g.fillRect(0,p-th/2,W,th);g.restore();},
  hit(pl,t){if(t<ta)return false;const p=pos(t);return vert?Math.abs(pl.x-p)<th/2+pl.r:Math.abs(pl.y-p)<th/2+pl.r;}};}
// باحث: مربع يلاحقك ببطء ثم ينفجر
function Seeker(x,y,tw,t0,t1,sp,turn){let vx=0,vy=0,rot=0;return{x,y,
  update(t,dt){if(t<t0)return;if(t>=t1){for(let i=0;i<4;i++){const a=i*Math.PI/2+Math.PI/4;hazards.push(Bullet(this.x,this.y,Math.cos(a)*240,Math.sin(a)*240,8));}burst(this.x,this.y,PINK,12);this.dead=true;return;}
    rot+=dt*4;if(player){const a=Math.atan2(player.y-this.y,player.x-this.x),ca=Math.atan2(vy,vx);let da=a-ca;da=Math.atan2(Math.sin(da),Math.cos(da));const na=(vx||vy)?ca+clamp(da,-turn*dt,turn*dt):a;vx=Math.cos(na)*sp;vy=Math.sin(na)*sp;}
    this.x=clamp(this.x+vx*dt,0,W);this.y=clamp(this.y+vy*dt,0,H);},
  draw(t){g.save();g.translate(this.x,this.y);g.rotate(rot);if(t<t0){const k=clamp((t-tw)/(t0-tw),0,1);g.strokeStyle=`rgba(255,42,109,${0.3+0.6*k})`;g.lineWidth=3;const s=30-14*k;g.strokeRect(-s,-s,2*s,2*s);}else{const bl=(t1-t)<0.5&&Math.floor(t*14)%2===0;g.shadowColor=PINK;g.shadowBlur=16;g.fillStyle=bl?'#fff':PINK;g.fillRect(-16,-16,32,32);g.fillStyle='#000';g.fillRect(-6,-6,12,12);}g.restore();},
  hit(p,t){return t>=t0&&Math.abs(p.x-this.x)<16+p.r&&Math.abs(p.y-this.y)<16+p.r;}};}

// ===== الزعيم: الكابوس — قناع حاد يطفو فوق ويدير الهجمات =====
function Nightmare(ts,te,T){let x=W/2,y=-150,lastS=-1,ex=false;const Y=110;
  const cannonAt=(t,cx,cy,ang,bw=44)=>hazards.push(Cannon(cx,cy,ang,t,t+SPB*T.wn,t+SPB*(T.wn+0.6),bw));
  return{
  update(t){const k=clamp((t-ts)/(SPB*3),0,1);x=W/2+Math.sin((t-ts)*0.6)*260*k;y=-150+(Y+150)*(1-Math.pow(1-k,3));
    if(t>=te&&!ex){ex=true;for(let i=0;i<30;i++){const a=i*TAU/30;hazards.push(Bullet(x,y,Math.cos(a)*230,Math.sin(a)*230,8));}burst(x,y,PINK,90,580);burst(x,y,'#fff',45,480);shake=30;flash=0.8;rumble(700,1,1);this.dead=true;return;}
    if(t<ts+SPB*4)return;
    const s=Math.floor(BT(t)*4+1e-6);if(s===lastS)return;lastS=s;const b=s/4,p=s%16,bar=Math.floor(s/16);if(t>te-SPB*2)return;
    if(b<224){// مدافع الحواف تطلق بالدور مع عقارب الساعة
      if(p%4===0){const q=(s/4)%4,C=[[30,H*0.5,0],[W*0.5,H-30,-Math.PI/2],[W-30,H*0.5,Math.PI],[30,H*0.2,0.25]];const c=C[q];if(q===3)cannonAt(t,x,y+40,Math.PI/2,50);else cannonAt(t,c[0],c[1],c[2]);}
    }else if(b<256){// شقوق القناع: ليزرات مايلة من القناع بالتناوب
      if(p%4===0){const a=Math.PI/2+((p/4)%2?0.55:-0.55)*(bar%2?1:-1);hazards.push(Cannon(x,y+30,a,t,t+SPB*T.wn,t+SPB*(T.wn+0.5),30));}
    }else{// النهاية: شعاع من القناع على مكانك كل ضربتين
      if(p%8===0&&player){const a=Math.atan2(player.y-(y+30),player.x-x);cannonAt(t,x,y+30,a,40);}
    }},
  draw(t){const k=clamp((t-ts)/(SPB*3),0,1);g.save();g.translate(x,y);const s=1+0.06*pulse;g.scale(s,s);
    g.shadowColor=PINK;g.shadowBlur=34;g.fillStyle=PINK;g.beginPath();g.moveTo(0,-80);g.lineTo(58,-20);g.lineTo(46,50);g.lineTo(0,82);g.lineTo(-46,50);g.lineTo(-58,-20);g.closePath();g.fill();g.shadowBlur=0;
    g.fillStyle='#000';g.beginPath();g.moveTo(-40,-14);g.lineTo(-10,-4);g.lineTo(-36,8);g.closePath();g.fill();g.beginPath();g.moveTo(40,-14);g.lineTo(10,-4);g.lineTo(36,8);g.closePath();g.fill();
    g.beginPath();g.moveTo(-34,30);for(let i=0;i<=8;i++)g.lineTo(-34+i*8.5,i%2?42:30);g.lineTo(34,36);for(let i=8;i>=0;i--)g.lineTo(-34+i*8.5,i%2?48:40);g.closePath();g.fill();
    g.restore();},
  hit(p,t){if(t<ts+SPB*3)return false;return Math.hypot(p.x-x,p.y-y)<58+p.r;}};}

/* ================= مرحلة: MEGALOVANIA (اختيار Nightmare) =================
   ١٢٠ ضربة بالدقيقة، الأغنية كاملة. كل شي محسوب ومرتب، مع لمسات تلاحقك.
   ٠ تعليم العدّاد والمرايا | ٣٢ الممر | ٤٨ المرايا + العدّاد | ٦٤ المدافع | ٨٠ الذاكرة | ٩٤ أول اندفاع
   ٩٦ حفظ ← الصندوق | ١١٢ موجات العدّاد | ١٢٨ الممر السريع + مدافع | ١٤٤ جدران الاندفاع | ١٦٠ ذاكرة طويلة | ١٧٦ الباحثين
   ١٩٢ حفظ ← الكابوس | ٢٨٨ ينهزم | ٢٨٨–٣١٠ الخاتمة */
function buildFriend4(){
  const E=[],ev=(b,f)=>E.push({b,f});
  const TI=ezT([{sp:320,wn:1.6,gap:180},{sp:330,wn:1.6,gap:180},{sp:350,wn:1.5,gap:170}]);

const STR_Y=[195,315,435,555];
// نوتة موسيقية: مكانها معادلة ثابتة بالوقت (سرعة وتسارع وتمايل)، فتمشي نفس الشي كل مرة
function Note(x0,y0,vx,vy,t0,o={}){const ax=o.ax||0,ay=o.ay||0,r=o.r||10,sw=o.sw||0,sf=o.sf||3,ph=o.ph||0,hrt=!!o.heart,life=o.life||9;

  return{
  update(t){if(t-t0>life)this.dead=true;else if(t-t0>0.6){const q=pos(t);if(q[0]<-100||q[0]>W+100||q[1]<-130||q[1]>H+130)this.dead=true;}},
  draw(t){if(t<t0)return;const[x,y]=pos(t),s=r*(1+0.15*pulse);g.save();g.translate(x,y);g.fillStyle='rgba(255,42,109,0.22)';circle(0,0,s*1.8);g.fillStyle=PINK;
    if(hrt){g.translate(0,s*0.1);heartPath(s*1.05);g.fill();}
    else{g.save();g.rotate(-0.35);g.beginPath();g.ellipse(0,0,s*1.12,s*0.84,0,0,TAU);g.fill();g.restore();g.fillStyle='rgba(255,42,109,0.6)';g.fillRect(s*0.72,-s*2.3,s*0.32,s*2.3);
      g.beginPath();g.moveTo(s*1.04,-s*2.3);g.quadraticCurveTo(s*1.9,-s*1.7,s*1.55,-s*0.95);g.quadraticCurveTo(s*1.6,-s*1.55,s*1.04,-s*1.7);g.fill();}
    g.restore();},
  hit(p,t){if(t<t0)return false;const[x,y]=pos(t),dx=p.x-x,dy=p.y-y,rr=r+p.r-2;return dx*dx+dy*dy<rr*rr;}};}

// وتر ينشد: خط تحذير شفاف، وبعدين يهتز وردي ويضر (ang رقم أو دالة بالوقت للأوتار اللي تلف)
function Pluck(cx,cy,ang,tw,ta,te,hw=18){const A=typeof ang==='function'?ang:()=>ang,len=3000;return{

function BowStroke(vert,c,dir,tw,ta,te,lance=false,len=620,th=13){const ext=vert?H:W,s0=dir>0?-20:ext+20,s1=dir>0?ext+len+20:-len-20;

      g.fillStyle=`rgba(255,42,109,${0.35+0.55*k})`;for(let i=0;i<3;i++){const u=(dir>0?18:ext-18)+dir*i*22,[x,y]=P(u,0);g.save();g.translate(x,y);g.rotate(vert?(dir>0?Math.PI/2:-Math.PI/2):(dir>0?0:Math.PI));g.beginPath();g.moveTo(-8,-th+2);g.lineTo(6,0);g.lineTo(-8,th-2);g.lineTo(-3,0);g.closePath();g.fill();g.restore();}

      g.shadowBlur=0;g.fillStyle=GREY+'0.85)';const[sx,sy]=P(tl-dir*10,0);g.save();g.translate(sx,sy);g.beginPath();g.moveTo(-26,-34);g.lineTo(26,-34);g.lineTo(26,6);g.quadraticCurveTo(0,40,0,40);g.quadraticCurveTo(0,40,-26,6);g.closePath();g.fill();g.restore();}
    else{const r=(u,v,l,w)=>{const[x,y]=P(Math.min(u,u+l),v);if(vert)g.fillRect(x-w/2,y,w,Math.abs(l));else g.fillRect(x,y-w/2,Math.abs(l),w);};
      r(tl,-th+4,h-tl,6);g.globalAlpha=0.75;r(tl,th-4,h-tl,3);g.globalAlpha=1;r(tl+dir*10,0,dir*26,th*2);r(h-dir*8,0,dir*8,th*2-4);}
    g.restore();},
  hit(p,t){if(t<ta||t>=te)return false;const h=head(t),a=Math.min(h,h-dir*len),b=Math.max(h,h-dir*len),u=vert?p.y:p.x,v=vert?p.x:p.y;return Math.abs(v-c)<th+p.r-1&&u>a-p.r&&u<b+p.r;}};}
// صفحة كتاب تنقلب: حافتها تمسح الساحة من جهة لجهة (الحافة بس تضر)، وفوق وتحت الصفحة مكان آمن
function PageTurn(dir,tw,ta,te,y0=80,y1=H-80){const PW=W/2+40,ew=22,LF=12,ex=t=>W/2+dir*PW*Math.cos(Math.PI*clamp((t-ta)/(te-ta),0,1)),lf=t=>Math.sin(Math.PI*clamp((t-ta)/(te-ta),0,1))*LF;

      g.fillStyle=`rgba(255,42,109,${0.3+0.5*k})`;for(let i=-1;i<=1;i++){g.save();g.translate(W/2+i*60,H/2);g.scale(-dir,1);g.beginPath();g.moveTo(-14,-22);g.lineTo(10,0);g.lineTo(-14,22);g.lineTo(-6,0);g.closePath();g.fill();g.restore();}return;}

function HxWorm(x,y,tw,t0,t1,sp,turn,n){let a=Math.atan2(H/2-y,W/2-x),hx=x,hy=y;const hist=[];const S=20,lag=4;

// يشحن قبل ما تنقطع الموسيقى، وينفجر بكسلات عند ٢:٣٩
const HX_SKULL=['....#####....','..#########..','.###########.','.###########.','###..###..###','###..###..###','#############','.#####.#####.','..#########..','..#.#.#.#.#..','..#########..','...#.#.#.#...'];
function HxSkull(ts,tc,tx,T,moves){

  const ring=(n,sp,a0)=>{for(let i=0;i<n;i++){const a=a0+i*TAU/n;hazards.push(HxPix(x+Math.cos(a)*60,y+Math.sin(a)*60,Math.cos(a)*sp,Math.sin(a)*sp,10));}};
  const eyes=(t)=>{if(!player)return;eyeT=t;const ex0=x,ey0=y-SH*0.1,a=Math.atan2(player.y-ey0,player.x-ex0),L=2600,c=Math.cos(a),s=Math.sin(a);

    else if(b<368){const o=(b-316)%8;if(o===0||o===4)eyes(t);else if(o===2)ring(12,T.sp*0.75,b*0.4);else if(o===6)fan(5,0.2,T.sp);else if(o===3||o===7)fan(3,0.3,T.sp*0.9);}

// كل الأسماء تبدأ بـ L7 عشان ما تتشابه مع أسماء المراحل الثانية
// قوس رمية: من (x0,y0) إلى (x1,y1) في D ثانية، وأعلى نقطة فوق الأعلى منهم بـ hgt
function L7arc(x0,y0,x1,y1,hgt,D){const top=Math.min(y0,y1)-hgt,a=y0-top,c=y1-top,u=(Math.sqrt(2*a)+Math.sqrt(2*c))/D,gr=u*u;return{vx:(x1-x0)/D,vy:-Math.sqrt(2*gr*a),gr};}
// كرة جغلة: تطير بقوس (جاذبية)، وتنط على الأرض إذا bn أكبر من صفر
function L7Ball(x,y,vx,vy,gr,r=12,bn=0){let rot=rnd()*TAU;return{x,y,vx,vy,r,
  update(t,dt){this.vy+=gr*dt;this.x+=this.vx*dt;this.y+=this.vy*dt;rot+=dt*5*(this.vx<0?-1:1);
    if(bn>0&&this.y>H-this.r&&this.vy>0){this.y=H-this.r;this.vy=-this.vy*0.8;bn--;burst(this.x,H-4,PINK,4,140);}
    if(this.x<-90||this.x>W+90||this.y>H+90||this.y<-900)this.dead=true;},
  draw(){const s=this.r*(1+0.12*pulse);g.fillStyle='rgba(255,42,109,0.22)';circle(this.x,this.y,s*1.6);g.fillStyle=PINK;circle(this.x,this.y,s);
    g.save();g.translate(this.x,this.y);g.rotate(rot);g.strokeStyle='rgba(255,255,255,0.75)';g.lineWidth=Math.max(2,s*0.2);g.beginPath();g.arc(0,0,s*0.62,-0.9,0.9);g.stroke();g.beginPath();g.arc(0,0,s*0.62,Math.PI-0.9,Math.PI+0.9);g.stroke();g.restore();},
  hit(p){const dx=p.x-this.x,dy=p.y-this.y,rr=this.r+p.r-2;return dx*dx+dy*dy<rr*rr;}};}
// عصا جغلة: تلف وهي طايرة بقوس
function L7Club(x,y,vx,vy,gr,spin,a0){let a=a0===undefined?rnd()*TAU:a0;return{x,y,vx,vy,
  update(t,dt){this.vy+=gr*dt;this.x+=this.vx*dt;this.y+=this.vy*dt;a+=spin*dt;if(this.x<-90||this.x>W+90||this.y>H+90||this.y<-900)this.dead=true;},

    g.shadowBlur=0;g.fillStyle='rgba(255,255,255,0.7)';g.fillRect(3,-8,4,16);g.restore();},
  hit(p){return obbHit(p.x,p.y,p.r-1,this.x-Math.cos(a)*4,this.y-Math.sin(a)*4,23,7,a);}};}
// حلقة جغلة كبيرة: تطير بقوس، ووسطها فاضي تقدر تعدي منه
function L7Hoop(x,y,vx,vy,gr,R=60,th=11){let rot=rnd()*TAU;return{x,y,vx,vy,
  update(t,dt){this.vy+=gr*dt;this.x+=this.vx*dt;this.y+=this.vy*dt;rot+=dt*3;if(this.x<-160||this.x>W+160||this.y>H+160||this.y<-900)this.dead=true;},
  draw(){g.save();g.translate(this.x,this.y);g.shadowColor=PINK;g.shadowBlur=16;g.strokeStyle=PINK;g.lineWidth=th*(1+0.15*pulse);g.beginPath();g.arc(0,0,R,0,TAU);g.stroke();g.shadowBlur=0;
    g.strokeStyle='rgba(255,255,255,0.6)';g.lineWidth=th*0.45;for(let i=0;i<8;i++){const a=rot+i*TAU/8;g.beginPath();g.arc(0,0,R,a,a+0.25);g.stroke();}g.restore();},

// رمية: قبل ما تنرمي يبان مسارها نقط، وعلى الضربة تطلع الكرة (أو العصا)
function L7Toss(x0,y0,x1,y1,hgt,tw,ta,D,o={}){const q=L7arc(x0,y0,x1,y1,hgt,D),club=!!o.club,hoop=!!o.hoop,r=o.r||12,bn=o.bn||0,ext=o.ext||1.3;let done=false;

  update(t){if(!done&&t>=ta){done=true;hazards.push(o.twin?L7Twin(x0,y0,q.vx,q.vy,q.gr,o.R||28,o.w||9,r):o.staff?L7Staff(x0,y0,q.vx,q.vy,q.gr,o.L1||46,o.L2||280,o.spin||4,o.a0||0):hoop?L7Hoop(x0,y0,q.vx,q.vy,q.gr,o.R||60):club?L7Club(x0,y0,q.vx,q.vy,q.gr,(q.vx>0?1:-1)*10,o.a0):L7Ball(x0,y0,q.vx,q.vy,q.gr,r,bn));this.dead=true;}},
  draw(t){const k=clamp((t-tw)/(ta-tw),0,1),n=o.dots||24;g.fillStyle=`rgba(255,42,109,${0.2+0.55*k})`;
    for(let i=1;i<=n;i++){if(i/n>k*1.2+0.12)break;const[px,py]=P(D*ext*i/n);if(py>H+20||px<-30||px>W+30)break;const s=2+1.5*k;g.fillRect(px-s,py-s,2*s,2*s);}
    g.strokeStyle=`rgba(255,42,109,${0.4+0.5*k})`;g.lineWidth=2;g.beginPath();g.arc(clamp(x0,8,W-8),clamp(y0,8,H-8),(o.staff?(o.L2||280):o.twin?(o.R||28)+r:hoop?(o.R||60):r)+10-7*k,0,TAU);g.stroke();},
  hit(){return false;}};}
// فطيرة كريمة: تنرمي عالي وتنزل على مكانك، وتنفجر كريمة تبقى شوي
function L7Pie(x,y,tw,tl,te,PR=54){let st=0;
  return{
  update(t){if(st===0&&t>=tl){st=1;burst(x,y,PINK,14,260);burst(x,y,'#fff',8,200);shake=Math.max(shake,6);}if(t>te+0.3)this.dead=true;},
  draw(t){
    if(t<tl){const k=clamp((t-tw)/(tl-tw),0,1);g.strokeStyle=`rgba(255,42,109,${0.3+0.6*k})`;g.lineWidth=3;g.setLineDash([10,8]);g.beginPath();g.arc(x,y,PR,0,TAU);g.stroke();g.setLineDash([]);
      g.fillStyle=`rgba(255,42,109,${0.05+0.13*k})`;circle(x,y,PR*k);
      const f=clamp((t-tw)/(tl-tw)*1.6-0.6,0,1);if(f>0){const s=2.4-1.4*f,py=y-260*(1-f)*(1-f);g.globalAlpha=0.35+0.65*f;g.save();g.translate(x,py);g.scale(s,s);g.rotate(t*3);g.shadowColor=PINK;g.shadowBlur=14;g.fillStyle=PINK;g.beginPath();g.ellipse(0,0,20,15,0,0,TAU);g.fill();g.shadowBlur=0;g.fillStyle='#fff';g.beginPath();g.ellipse(0,-3,14,8,0,0,TAU);g.fill();g.restore();g.globalAlpha=1;}return;}
    const e=t-tl,a=t<te?1:Math.max(0,1-(t-te)/0.3);g.globalAlpha=a;g.save();g.translate(x,y);g.shadowColor=PINK;g.shadowBlur=18;g.fillStyle=e<0.06?'#fff':PINK;g.beginPath();
    for(let i=0;i<14;i++){const an=i*TAU/14,rr=PR*(i%2?0.8:1.04)*Math.min(1,0.6+e*6);i?g.lineTo(Math.cos(an)*rr,Math.sin(an)*rr):g.moveTo(rr,0);}g.closePath();g.fill();
    g.shadowBlur=0;g.fillStyle='rgba(255,255,255,0.8)';circle(-PR*0.25,-PR*0.2,PR*0.2);circle(PR*0.3,PR*0.15,PR*0.13);g.restore();g.globalAlpha=1;},
  hit(p,t){return t>=tl&&t<te&&Math.hypot(p.x-x,p.y-y)<PR*0.86+p.r-2;}};}
// كرتين توأم: يلفون حول بعض بسرعة وهم طايرين بقوس (مثل اللولب)
function L7Twin(x,y,vx,vy,gr,R=28,w=9,r=15){let ph=rnd()*TAU;return{x,y,vx,vy,
  bp(k){const a=ph+k*Math.PI;return[this.x+Math.cos(a)*R,this.y+Math.sin(a)*R];},
  update(t,dt){this.vy+=gr*dt;this.x+=this.vx*dt;this.y+=this.vy*dt;ph+=w*dt*(this.vx<0?-1:1);if(this.x<-120||this.x>W+120||this.y>H+120||this.y<-900)this.dead=true;},
  draw(){const[a,b]=[this.bp(0),this.bp(1)];g.strokeStyle='rgba(255,42,109,0.35)';g.lineWidth=3;g.beginPath();g.arc(this.x,this.y,R,0,TAU);g.stroke();

  hit(p){for(const k of [0,1]){const[px,py]=this.bp(k),dx=p.x-px,dy=p.y-py,rr=r+p.r-2;if(dx*dx+dy*dy<rr*rr)return true;}return false;}};}
// عصا جغلة طويلة: تطير بقوس وهي تلف حول نفسها مثل المروحة، ونصها فاضي (تقدر تعدي من النص)
function L7Staff(x,y,vx,vy,gr,L1,L2,spin,a0,th=16){let a=a0;const hl=(L2-L1)/2,mid=(L1+L2)/2;return{x,y,vx,vy,

  draw(){g.save();g.translate(this.x,this.y);g.rotate(a);g.shadowColor=PINK;g.shadowBlur=16;g.fillStyle=PINK;
    for(const sd of [-1,1]){g.fillRect(sd>0?L1:-L2,-th/2,L2-L1,th);circle(sd*L2,0,th*0.8);}
    g.shadowBlur=0;g.fillStyle='rgba(255,255,255,0.75)';for(const sd of [-1,1])for(let k=1;k<6;k++){const d=sd*(L1+(L2-L1)*k/6);g.fillRect(d-3,-th/2,6,th);}

function readInput(){
  let x=0,y=0,dash=false,confirm=false,pz=false,back=false,restart=false,sq=false,l1=false,r1=false;
  if(keys.ArrowLeft||keys.KeyA)x-=1;if(keys.ArrowRight||keys.KeyD)x+=1;if(keys.ArrowUp||keys.KeyW)y-=1;if(keys.ArrowDown||keys.KeyS)y+=1;

    const b=i=>gp.buttons[i]&&gp.buttons[i].pressed;
    if(gp.buttons.some(bb=>bb&&bb.pressed))padAny=true;
    const ax=gp.axes[0]||0,ay=gp.axes[1]||0,mag=Math.hypot(ax,ay);

    if(b(0)||b(2)||b(4)||b(5)||b(6)||b(7))dash=true;
    if(b(0))confirm=true;if(b(9))pz=true;if(b(1))back=true;if(b(3)||b(8))restart=true;if(b(2))sq=true;if(b(4))l1=true;if(b(5))r1=true;
  }
  const cur={dash,confirm,pz,back,restart,sq,l1,r1,padAny,left:x<-0.5,right:x>0.5,up:y<-0.5,down:y>0.5},out={x,y};

}

function updatePlay(dt,inp){

  if(m>0.2){p.fx=mx/m;p.fy=my/m;}

// الـ Replay: حركة المربع تنسجل 50 مرة بالثانية (مكان x,y + الاندفاع + الأرواح) لكل جولة من نقطة حفظ (segment)، مع رقم العشوائية حقها.
// لكل مرحلة ونوع (نورمال/إيزي) Replay واحد لأفضل حرف: حرف أحسن يبدّله، ونفس الحرف ما يبدّل اللي قبله (القوانين تمنعه).
const RP_HZ=50,RP_MAX_SEGS=100,RP_MAX_BYTES=900000;

function saveRpq(){try{localStorage.setItem('mg_rpq',JSON.stringify(rpq));}catch(e){}}
function recSample(t){
  if(!rec||!rec.cur)return;const c=rec.cur,p=player;if(c.t0===null)c.t0=t;
  while(c.t0+c.n/RP_HZ<=t&&c.n<60000){c.b.push(Math.round(clamp(p.x,0,1300)*50),Math.round(clamp(p.y,0,1300)*50),(p.dash>0?1:0)|(clamp(p.hp,0,7)<<1));c.n++;}

function packRp(a){const u=new Uint8Array(a.length/3*5);for(let i=0,j=0;i<a.length;i+=3,j+=5){u[j]=a[i]&255;u[j+1]=a[i]>>8;u[j+2]=a[i+1]&255;u[j+3]=a[i+1]>>8;u[j+4]=a[i+2];}
  let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s);}
function unpackRp(b64){const s=atob(b64),n=s.length/5|0,a=new Uint16Array(n*3);for(let i=0,j=0;i<n;i++,j+=5){a[i*3]=s.charCodeAt(j)|(s.charCodeAt(j+1)<<8);a[i*3+1]=s.charCodeAt(j+2)|(s.charCodeAt(j+3)<<8);a[i*3+2]=s.charCodeAt(j+4);}return a;}

function rpWin(r){
  if(!rec||!rec.segs.length)return;const L=cur,m=easy?'e':'n',best=L[easy?'bestE':'best'];rec.cur=null;
  if(best&&RANKS.indexOf(r)>RANKS.indexOf(best)){rec=null;return;}
  const segs=rec.segs.filter(s=>s.n>1).map(s=>({cp:s.cp,seed:s.seed,t0:s.t0||0,n:s.n,d:packRp(s.b)}));rec=null;
  // ما فيه حد للموتات: الحد هو حجم الملف (Firebase يقبل 1 ميغا تقريبًا للملف) = حوالي 45 دقيقة لعب
  if(!segs.length||segs.length>RP_MAX_SEGS||segs.reduce((a,s)=>a+s.d.length+80,0)>RP_MAX_BYTES)return;
  rpq[L.id+'_'+m]={lvl:L.id,m,r,hz:RP_HZ,segs};saveRpq();
}
function rpFields(q){return{uid:{stringValue:acc.uid},lvl:{stringValue:q.lvl},m:{stringValue:q.m},r:{stringValue:q.r},v:{integerValue:'1'},hz:{integerValue:String(q.hz)},
  segs:{arrayValue:{values:q.segs.map(s=>({mapValue:{fields:{cp:{integerValue:String(s.cp)},seed:{integerValue:String(s.seed)},t0:{doubleValue:s.t0},n:{integerValue:String(s.n)},d:{stringValue:s.d}}}}))}}};}
async function flushRpq(){
  for(const k of Object.keys(rpq)){const q=rpq[k],L=ALL_LV().find(x=>x.id===q.lvl),best=L&&L[q.m==='e'?'bestE':'best'];
    if(best!==q.r){if(!best||RANKS.indexOf(q.r)>RANKS.indexOf(best)){delete rpq[k];saveRpq();}continue;}
    try{await commit([{update:{name:`${FS_DOC}/replays/${acc.uid}_${q.lvl}_${q.m}`,fields:rpFields(q)},updateTransforms:[{fieldPath:'at',setToServerValue:'REQUEST_TIME'}]}]);delete rpq[k];saveRpq();}
    catch(e){if(e.message==='NET')throw e;delete rpq[k];saveRpq();}
  }
}

// مشغّل الـ Replay: نفس المرحلة ونفس الأغنية ونفس الهجمات، والمربع يمشي على الحركة المسجلة
// يشتغل مثل الفيديو: إيقاف وتشغيل، ترجيع وتقديم ٥ ثواني، السرعة، وإخفاء الكلام اللي فوق
// الترجيع والتقديم: نبدأ المحاولة من أولها ونمشّي المرحلة بسرعة بدون رسم ولا صوت لين نوصل الثانية المطلوبة (نفس العشوائية فتطلع نفس الهجمات)
// أي Replay بنفس الشكل (segs) يقدر يستخدم هذي الشاشة، حتى لو جاي من البوت
const rp={p:null,L:null,m:'n',doc:null,seg:0,err:false,gapAt:0,gapDead:false,endAt:0,saveEasy:false,paused:false,rate:1,hide:false,barT:0,aT:0,aCT:0,off:[],tot:0};
const RP_RATES=[0.25,0.5,0.75,1,1.5,2],RP_JUMP=5,RP_SMALL=1,RP_FINE=0.1,RP_ST=1/120;
function openReplay(p,L,m){rp.p=p;rp.L=L;rp.m=m;rp.doc=null;rp.err=false;state='rpLoad';
  jfetch(`${FS_URL}/replays/${p.uid}_${L.id}_${m}`).then(d=>{if(state==='rpLoad'&&rp.L===L&&rp.m===m)rp.doc=parseRp(d);}).catch(()=>{if(state==='rpLoad')rp.err=true;});}
function parseRp(d){const f=d.fields;return{r:f.r.stringValue,hz:+f.hz.integerValue||RP_HZ,segs:f.segs.arrayValue.values.map(v=>{const s=v.mapValue.fields;
  return{cp:+s.cp.integerValue,seed:+s.seed.integerValue,t0:+(s.t0.doubleValue!==undefined?s.t0.doubleValue:s.t0.integerValue),n:+s.n.integerValue,b:unpackRp(s.d.stringValue)};})};}

function rpKill(){if(!src)return;try{src.stop();}catch(e){}try{src.disconnect();musicGain.disconnect();}catch(e){}src=null;musicGain=null;}
// يبدأ المحاولة i من الثانية T بالأغنية (بدون T = من أولها)
function rpGo(i,T){
  rp.seg=i;const s=rp.doc.segs[i],T0=rpFrom(s);checkpoint=s.cp;stopMusic();beginRun(s.cp,s.seed);rpKill();state='replay';player.inv=1e9;
  T=T===undefined?T0:Math.max(T0,T);
  if(T>T0){dry=true;for(let t=T0;t<T-1e-9;){const d=Math.min(RP_ST,T-t);t+=d;rpApply(t,d,false);}dry=false;particles=[];shake=flash=0;cpMsg=0;}
