# تجربة بناء: كل ما ينرفع تعديل، يبني اللعبة والمثبّت بدون ما ينشر شي للاعبين.
name: تجربة بناء (بدون نشر)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -q && sudo apt-get install -y -q nsis
      - uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-4.5.2-mono
      - run: |
          if [ ! -f ~/godot/Godot_v4.5.2-stable_mono_linux_x86_64/Godot_v4.5.2-stable_mono_linux.x86_64 ]; then
            mkdir -p ~/godot && cd ~/godot
            curl -sSLo g.zip https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_mono_linux_x86_64.zip
            unzip -q g.zip && rm g.zip
          fi
      - run: bash tools/release/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: test-build
          path: |
            build/release/Mohammed-Game-Setup.exe
            build/release/Mohammed-Game-Update.exe
            build/release/latest.yml
          retention-days: 7
